<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Profile · emonad</title>
  <meta name="description" content="emonad.lol profile">
  <meta property="og:title" content="emonad profile">
  <meta property="og:description" content="emonad.lol — XP, levels, click farming on the home of $EMO.">
  <meta property="og:image" content="https://emonad.lol/og-image.jpg">
  <meta property="og:url" content="https://emonad.lol/profile.html">
  <meta property="og:type" content="profile">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="emonad profile">
  <meta name="twitter:description" content="emonad.lol — XP, levels, click farming on the home of $EMO.">
  <meta name="twitter:image" content="https://emonad.lol/og-image.jpg">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>
    try {
      var t = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/emo-skin.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #aaaaaa;
      --accent: #7B3FE4;
      --accent-hover: #6930c3;
      --accent-glow: rgba(123, 63, 228, 0.25);
      --surface: #f5f3ff;
      --surface-border: #e4d8f8;
      --ticker-bg: rgba(255, 255, 255, 0.92);
      --ticker-border: #e9e0f5;
      --stat-bg: #ffffff;
    }
    [data-theme="dark"] {
      --bg-color: #08070b;
      --text-color: #ffffff;
      --text-secondary: #9a94a8;
      --text-muted: #8a8496;
      --accent: #9B5FFF;
      --accent-hover: #b080ff;
      --accent-glow: rgba(155, 95, 255, 0.3);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-border: rgba(255, 255, 255, 0.1);
      --ticker-bg: rgba(15, 15, 15, 0.92);
      --ticker-border: rgba(255, 255, 255, 0.08);
      --stat-bg: rgba(255, 255, 255, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(ellipse 90% 55% at 50% -8%, rgba(155, 95, 255, 0.22) 0%, transparent 58%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(232, 77, 127, 0.08) 0%, transparent 55%),
        var(--bg-color);
      color: var(--text-color);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Top nav */
    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-color);
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 600;
    }
    .nav-back:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--text-color);
    }
    .nav-bar .grow { flex: 1; }
    .theme-toggle {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--accent); background: var(--accent-glow); }

    /* Page background — mirror the share-card vibe */
    body {
      background:
        radial-gradient(ellipse 800px 600px at 12% 8%, rgba(155, 95, 255, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse 900px 600px at 88% 4%, rgba(236, 72, 153, 0.18) 0%, transparent 55%),
        var(--bg-color);
    }
    [data-theme="dark"] body {
      background:
        radial-gradient(ellipse 800px 600px at 12% 8%, rgba(155, 95, 255, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse 900px 600px at 88% 4%, rgba(236, 72, 153, 0.22) 0%, transparent 55%),
        #08070b;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 20px 28px;
    }

    .panel {
      background: linear-gradient(180deg,
        rgba(255,255,255,0.04) 0%,
        rgba(255,255,255,0.015) 100%);
      border: 1px solid rgba(155, 95, 255, 0.22);
      border-radius: 26px;
      padding: 28px 32px 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45),
                  0 0 80px rgba(155, 95, 255, 0.18),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    [data-theme="light"] .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.7) 100%);
      border-color: rgba(155, 95, 255, 0.3);
    }

    /* Top wordmark strip inside panel */
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
      font-size: 13px;
    }
    .panel-head .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--text-color);
      font-weight: 900;
      letter-spacing: 0.18em;
      font-size: 12px;
    }
    .panel-head .brand::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .panel-head .tag {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .panel-head .tag::before {
      content: '';
      width: 36px; height: 1px;
      background: rgba(155, 95, 255, 0.4);
    }

    /* Hero — avatar with glow + level chip below */
    .hero {
      text-align: center;
      position: relative;
      margin-bottom: 16px;
    }
    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }
    .avatar-wrap img {
      width: 132px; height: 132px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      box-shadow: 0 0 50px rgba(155, 95, 255, 0.6),
                  0 12px 36px rgba(0,0,0,0.5);
      display: block;
    }
    .level-chip {
      position: absolute;
      bottom: -16px;
      left: 50%; transform: translateX(-50%);
      min-width: 100px;
      height: 36px;
      padding: 0 18px;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.14em;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 22px rgba(0,0,0,0.5),
                  0 0 24px rgba(155, 95, 255, 0.7);
      border: 3px solid var(--bg-color, #0a0612);
      white-space: nowrap;
    }
    .level-chip.maxed {
      background: linear-gradient(135deg, var(--accent), #ec4899);
    }
    [data-theme="dark"] .level-chip { border-color: #0a0612; }
    [data-theme="light"] .level-chip { border-color: #ffffff; }

    .name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.005em;
      margin-bottom: 2px;
      color: var(--text-color);
    }
    .handle {
      font-size: 15px;
      color: #b8a3e8;
      font-weight: 500;
    }
    [data-theme="light"] .handle { color: #7B3FE4; opacity: 0.7; }

    /* Hero XP — match the card */
    .xp-block {
      text-align: center;
      margin: 22px 0 6px;
      line-height: 1;
    }
    .xp-block .num {
      font-size: 72px;
      font-weight: 900;
      color: var(--text-color);
      letter-spacing: -0.01em;
      text-shadow: 0 0 36px rgba(155, 95, 255, 0.55);
      font-variant-numeric: tabular-nums;
    }
    .xp-block .suf {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent);
      margin-left: 4px;
    }
    .xp-context {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b8a3e8;
      margin-bottom: 18px;
    }
    [data-theme="light"] .xp-context { color: #7B3FE4; opacity: 0.7; }

    /* 5-cell stat grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat {
      background: linear-gradient(180deg,
        rgba(155, 95, 255, 0.18) 0%,
        rgba(155, 95, 255, 0.06) 100%);
      border: 1px solid rgba(155, 95, 255, 0.35);
      border-radius: 16px;
      padding: 14px 8px 12px;
      text-align: center;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .stat .num {
      font-size: 28px;
      font-weight: 900;
      color: var(--text-color);
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px rgba(155, 95, 255, 0.35);
    }
    .stat .lab {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b8a3e8;
      margin-top: 6px;
      line-height: 1.2;
    }
    [data-theme="light"] .stat .lab { color: #7B3FE4; opacity: 0.75; }

    /* Owner-only daily-XP banner — uses the SAME .emo-daily-banner class
       the modal does (CSS injected by emo-profile.js). We just need a top
       margin so it sits nicely above the stats grid. */
    .emo-daily-banner.in-profile {
      margin: 0 0 16px;
    }
    .emo-daily-banner.in-profile .head .total { color: var(--text-color); }
    .emo-daily-banner.in-profile .head .lbl   { color: var(--text-color); opacity: 0.92; }
    .emo-daily-banner.in-profile .chip {
      color: var(--text-color);
    }
    .emo-daily-banner.in-profile.complete .head .lbl,
    .emo-daily-banner.in-profile.complete .head .total { color: #22c55e; }

    /* Referral block — sits between stats and actions. Always visible on a
       profile so any visitor can grab THAT USER's invite link and share it
       (the user earns the XP, the visitor's link is shaped for them). */
    .referral-block {
      margin: 14px 0 16px;
      padding: 14px 16px 16px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(155, 95, 255, 0.12) 0%, rgba(236, 72, 153, 0.10) 100%);
      border: 1px solid rgba(155, 95, 255, 0.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative;
    }
    [data-theme="light"] .referral-block {
      background:
        linear-gradient(135deg, rgba(155, 95, 255, 0.10) 0%, rgba(236, 72, 153, 0.08) 100%);
      border-color: rgba(155, 95, 255, 0.4);
    }
    .referral-block .rb-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .referral-block .rb-eyebrow {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #b8a3e8;
    }
    [data-theme="light"] .referral-block .rb-eyebrow { color: #7B3FE4; opacity: 0.85; }
    .referral-block .rb-stats {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .referral-block .rb-stats b {
      color: var(--text-color);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .referral-block .rb-stats .sep {
      opacity: 0.4;
      margin: 0 6px;
    }
    .referral-block .rb-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
    }
    .referral-block .rb-link {
      font-family: 'Space Grotesk', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-color);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(155, 95, 255, 0.28);
      border-radius: 10px;
      padding: 9px 12px;
      letter-spacing: 0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    [data-theme="light"] .referral-block .rb-link {
      background: rgba(255,255,255,0.7);
      border-color: rgba(155, 95, 255, 0.3);
    }
    .referral-block .rb-link em {
      font-style: normal;
      color: #9B5FFF;
      font-weight: 900;
    }
    .referral-block .rb-btn {
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(155, 95, 255, 0.32);
      background: rgba(155, 95, 255, 0.10);
      color: var(--text-color);
      font: inherit;
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      cursor: pointer;
      padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .referral-block .rb-btn:hover {
      background: rgba(155, 95, 255, 0.22);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .referral-block .rb-btn.primary {
      background: linear-gradient(135deg, #9B5FFF, #ec4899);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(155, 95, 255, 0.35);
    }
    .referral-block .rb-cta {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-align: center;
      opacity: 0.85;
    }
    .referral-block .rb-cta b {
      color: var(--text-color);
      font-weight: 900;
    }
    @media (max-width: 640px) {
      .referral-block .rb-row { grid-template-columns: 1fr; }
      .referral-block .rb-btn { width: 100%; }
      .referral-block .rb-head { gap: 6px; }
    }

    /* Action buttons */
    .actions {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 10px;
    }
    .btn {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(155, 95, 255, 0.28);
      background: rgba(155, 95, 255, 0.06);
      color: var(--text-color);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      display: flex; align-items: center; justify-content: center;
      padding: 0 14px;
      transition: all 0.2s ease;
      gap: 6px;
    }
    .btn:hover {
      border-color: var(--accent);
      background: rgba(155, 95, 255, 0.18);
      transform: translateY(-1px);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), #ec4899);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 22px rgba(155, 95, 255, 0.45);
    }
    .btn.primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 8px 28px rgba(155, 95, 255, 0.6);
    }

    /* Loading / empty / error states */
    .empty, .loading, .error {
      text-align: center;
      padding: 70px 24px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .empty .big, .error .big {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-color);
      margin-bottom: 10px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(155, 95, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .container { padding: 60px 14px 24px; }
      .panel { padding: 24px 18px 18px; border-radius: 22px; }
      .panel-head .tag { display: none; }
      .avatar-wrap img { width: 108px; height: 108px; }
      .level-chip { height: 32px; font-size: 12px; min-width: 88px; bottom: -14px; }
      .name { font-size: 22px; }
      .xp-block .num { font-size: 58px; }
      .xp-block .suf { font-size: 22px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stats .stat:nth-child(4) { grid-column: 1 / span 2; }
      .stats .stat:nth-child(5) { grid-column: 3; }
      .stat .num { font-size: 22px; }
      .stat .lab { font-size: 9.5px; }
      .actions { grid-template-columns: 1fr; }
      .nav-bar { padding: 0 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .stat, .level-chip, .avatar-wrap img,
      .nav-back, .theme-toggle { transition: none !important; }
      .spinner { animation-duration: 1.6s; }
    }

    /* Share modal */
    .share-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9990;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .share-modal {
      width: 100%; max-width: 640px;
      background: var(--bg-color);
      border: 1px solid var(--surface-border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6),
                  0 0 60px var(--accent-glow);
      position: relative;
      max-height: 90vh; overflow-y: auto;
    }
    .share-modal h3 {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding-right: 36px;
    }
    .share-modal .preview {
      width: 100%;
      aspect-ratio: 1200 / 630;
      border-radius: 14px;
      overflow: hidden;
      background: #0a0a0a;
      border: 1px solid var(--surface-border);
      display: block;
      margin-bottom: 12px;
    }
    .share-modal .preview canvas,
    .share-modal .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .share-modal .hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 14px;
      text-align: center;
      line-height: 1.5;
    }
    .share-modal .hint b { color: var(--text-color); }
    .share-modal .row {
      display: grid; gap: 8px;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .share-modal .row .btn { min-height: 42px; font-size: 12.5px; }
    .share-modal-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
    }
    .share-modal-close:hover { color: var(--text-color); border-color: var(--accent); }
    @media (max-width: 480px) {
      .share-modal { padding: 16px; border-radius: 18px; }
      .share-modal .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="nav-bar glass-bar">
    <a class="nav-back" href="emo.html" aria-label="Back to main site">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      $EMO
    </a>
    <span class="grow"></span>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span id="themeIcon">◐</span>
    </button>
    <span id="emoAuthSlot" class="emo-auth-host"></span>
  </nav>

  <div class="container">
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading profile…</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var html = document.documentElement;
      var saved = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      html.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').addEventListener('click', function() {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>

  <script type="module">
    import EmoProfile from './emo-profile.js';

    function safeHttpsUrl(u) {
      if (!u || typeof u !== 'string') return '';
      try {
        var parsed = new URL(u);
        return parsed.protocol === 'https:' ? parsed.href : '';
      } catch { return ''; }
    }
    function upscaleAvatar(url, size, handle) {
      var out = '';
      if (typeof EmoProfile.highResAvatar === 'function') out = EmoProfile.highResAvatar(url, size, handle);
      else if (handle) {
        const clean = String(handle).replace(/^@/, '').trim();
        if (clean) out = 'https://unavatar.io/twitter/' + encodeURIComponent(clean);
      } else if (url) {

        } else {
          out = url;
        }
      }
      return safeHttpsUrl(out);

    function loadImageCORS(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('image_failed'));
        img.src = src;
      });
    }

    // Force-fresh image load: bypasses both browser HTTP cache and any
    // crossOrigin-related cache splits by fetching the bytes, wrapping in
    // a blob URL, and feeding that to <Image>. Returns a same-origin (blob:)
    // image that the canvas can draw without tainting.
    async function loadImageFresh(src) {
      const res = await fetch(src, { cache: 'no-store', mode: 'cors', credentials: 'omit' });
      if (!res.ok) throw new Error('fetch_' + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      try {
        return await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('blob_img_failed'));
          img.src = url;
        });
      } finally {
        // Caller has the decoded Image; the blob URL can be released
        // after a tick so the image has time to fully decode.
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ── Avatar loader: force-fresh via fetch(cache: 'no-store') + blob URL.
    //    This bypasses both browser HTTP cache and CORS-mode cache splits
    //    that were causing the share card to show stale PFPs even after
    //    the user changed their avatar on X.
    async function fetchFreshAvatar(profile) {
      const handle = (profile.x_handle || '').replace(/^@/, '');
      const bust = Date.now();
      const tries = [];
      if (handle) {
        tries.push(`https://unavatar.io/twitter/${encodeURIComponent(handle)}?size=1000&_=${bust}`);
        tries.push(`https://unavatar.io/x/${encodeURIComponent(handle)}?size=1000&_=${bust}`);
        tries.push(`https://unavatar.io/twitter/${encodeURIComponent(handle)}`);
      }
      if (profile.avatar_url) {
        const cu = profile.avatar_url;
        tries.push(cu.includes('img.clerk.com')
          ? cu + (cu.includes('?') ? '&' : '?') + 'width=512&_=' + bust
          : cu);
      }
      // Try loadImageFresh (real cache bypass) first for each source.
      // Fall back to loadImageCORS (uses browser cache) only if fresh load fails.
      for (const src of tries) {
        try { const img = await loadImageFresh(src); if (img) return img; } catch {}
      }
      for (const src of tries) {
        try { const img = await loadImageCORS(src);  if (img) return img; } catch {}
      }
      return null;
    }

    async function buildStatsCard(p) {
      const W = 1200, H = 630;
      const SCALE = 2;
      const canvas = document.createElement('canvas');
      canvas.width = W * SCALE; canvas.height = H * SCALE;
      const ctx = canvas.getContext('2d');
      ctx.scale(SCALE, SCALE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // ─── Background ────────────────────────────────────────────
      // Base
      ctx.fillStyle = '#0a0612';
      ctx.fillRect(0, 0, W, H);

      // Twin radial blooms (top-left soft + top-right strong)
      const bloomL = ctx.createRadialGradient(180, 80, 0, 180, 80, 720);
      bloomL.addColorStop(0, 'rgba(155, 95, 255, 0.32)');
      bloomL.addColorStop(0.45, 'rgba(155, 95, 255, 0.08)');
      bloomL.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bloomL; ctx.fillRect(0, 0, W, H);

      const bloomR = ctx.createRadialGradient(1080, 40, 0, 1080, 40, 700);
      bloomR.addColorStop(0, 'rgba(236, 72, 153, 0.30)');
      bloomR.addColorStop(0.45, 'rgba(236, 72, 153, 0.06)');
      bloomR.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bloomR; ctx.fillRect(0, 0, W, H);

      // Bottom vignette
      const vig = ctx.createLinearGradient(0, H - 240, 0, H);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

      // Inset card stroke
      ctx.save();
      ctx.strokeStyle = 'rgba(155, 95, 255, 0.18)';
      ctx.lineWidth = 2;
      roundRectPath(ctx, 18, 18, W - 36, H - 36, 28);
      ctx.stroke();
      ctx.restore();

      // ─── Header strip (top) ────────────────────────────────────
      // Brand wordmark with leading accent dot
      ctx.save();
      ctx.fillStyle = '#9B5FFF';
      ctx.shadowColor = 'rgba(155, 95, 255, 0.65)';
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(56, 54, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fff';
      ctx.font = '900 19px "Space Grotesk", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('E M O N A D . L O L', 72, 60);

      // Decorative right-side accent: small dot + line
      ctx.save();
      ctx.strokeStyle = 'rgba(155, 95, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W - 56, 56); ctx.lineTo(W - 200, 56); ctx.stroke();
      ctx.fillStyle = '#9B5FFF';
      ctx.beginPath(); ctx.arc(W - 56, 56, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // ─── Avatar ────────────────────────────────────────────────
      const handle = (p.profile.x_handle || '').replace(/^@/, '');
      const avatarImg = await fetchFreshAvatar(p.profile);
      const srcW = avatarImg?.naturalWidth || 400;
      // ar ≤ srcW / (2 * SCALE) keeps the avatar pixel-perfect, never upscaled.
      const ar = Math.max(78, Math.min(85, Math.floor(srcW / 4)));
      const ax = W / 2, ay = 158;

      // Outer glow ring
      ctx.save();
      ctx.shadowColor = 'rgba(155, 95, 255, 0.7)';
      ctx.shadowBlur = 60;
      ctx.fillStyle = 'rgba(155, 95, 255, 0.9)';
      ctx.beginPath(); ctx.arc(ax, ay, ar + 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // Avatar disc
      ctx.save();
      ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.closePath();
      ctx.clip();
      if (avatarImg) {
        ctx.drawImage(avatarImg, ax - ar, ay - ar, ar * 2, ar * 2);
      } else {
        ctx.fillStyle = '#1a1424';
        ctx.fillRect(ax - ar, ay - ar, ar * 2, ar * 2);
        ctx.fillStyle = '#9B5FFF';
        ctx.font = 'bold 120px "Space Grotesk", system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((handle || '?').charAt(0).toUpperCase(), ax, ay);
      }
      ctx.restore();

      // Sharp accent ring on top
      ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2);
      ctx.strokeStyle = '#9B5FFF'; ctx.lineWidth = 5;
      ctx.stroke();
      ctx.beginPath(); ctx.arc(ax, ay, ar + 3, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
      ctx.stroke();

      // Level chip — overlapping bottom of avatar
      const chipText = p.maxed ? 'MAX LEVEL' : ('LEVEL ' + p.level);
      ctx.font = '900 20px "Space Grotesk", system-ui, sans-serif';
      const chipPad = 22;
      const chipW = Math.max(110, ctx.measureText(chipText).width + chipPad * 2);
      const chipH = 44;
      const chipCx = ax;
      const chipCy = ay + ar + 4;

      ctx.save();
      ctx.shadowColor = 'rgba(155, 95, 255, 0.8)';
      ctx.shadowBlur = 28;
      if (p.maxed) {
        const cg = ctx.createLinearGradient(chipCx - chipW/2, chipCy, chipCx + chipW/2, chipCy);
        cg.addColorStop(0, '#9B5FFF');
        cg.addColorStop(1, '#ec4899');
        ctx.fillStyle = cg;
      } else {
        ctx.fillStyle = '#9B5FFF';
      }
      roundRectPath(ctx, chipCx - chipW/2, chipCy - chipH/2, chipW, chipH, 22);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 4;
      roundRectPath(ctx, chipCx - chipW/2, chipCy - chipH/2, chipW, chipH, 22);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(chipText, chipCx, chipCy + 1);

      // ─── Identity block ────────────────────────────────────────
      // Display name
      ctx.fillStyle = '#fff';
      ctx.font = '800 38px "Space Grotesk", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      const name = p.profile.display_name || handle || 'Anonymous';
      // Truncate name if too long
      const maxNameW = W - 200;
      let drawName = name;
      while (ctx.measureText(drawName).width > maxNameW && drawName.length > 4) {
        drawName = drawName.slice(0, -1);
      }
      if (drawName !== name) drawName = drawName.trim() + '…';
      ctx.fillText(drawName, W/2, 312);

      // @handle
      ctx.fillStyle = '#b8a3e8';
      ctx.font = '500 22px "Space Grotesk", system-ui, sans-serif';
      ctx.fillText('@' + handle, W/2, 342);

      // ─── Hero XP — the focal point ────────────────────────────
      // Composite "179 XP" — big number + smaller "XP" suffix sharing baseline.
      const xpStr = String(p.total);
      ctx.save();
      ctx.font = '900 88px "Space Grotesk", system-ui, sans-serif';
      const xpNumW = ctx.measureText(xpStr).width;
      ctx.font = '900 36px "Space Grotesk", system-ui, sans-serif';
      const xpSuffW = ctx.measureText(' XP').width;
      const compW = xpNumW + xpSuffW;
      const startX = W / 2 - compW / 2;
      const baseY = 425;

      ctx.shadowColor = 'rgba(155, 95, 255, 0.65)';
      ctx.shadowBlur = 36;
      ctx.fillStyle = '#fff';
      ctx.font = '900 88px "Space Grotesk", system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(xpStr, startX, baseY);

      ctx.fillStyle = '#9B5FFF';
      ctx.font = '900 36px "Space Grotesk", system-ui, sans-serif';
      ctx.fillText(' XP', startX + xpNumW, baseY);
      ctx.restore();

      // XP context line under the hero
      ctx.fillStyle = 'rgba(184, 163, 232, 0.85)';
      ctx.font = '700 14px "Space Grotesk", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      const ctxLine = p.maxed
        ? 'MAXED OUT  ·  4200 IS THE MEME'
        : ((60 - (p.total % 60)) + ' XP TO LEVEL ' + (p.level + 1));
      ctx.fillText(ctxLine, W/2, 452);

      // ─── Stat grid (5 cards) ──────────────────────────────────
      const ecLevelN = Number(p.ecLevel) || 0;
      const flBestN  = Number(p.flBest)  || 0;
      const trN      = Number(p.trReadings) || 0;
      const blocks   = Number(p.blocks)  || 0;
      const emonads  = Number(p.emonads) || 0;

      const cards = [
        { big: String(blocks),                        lab: 'BLOCKS' },
        { big: String(emonads),                       lab: 'EMONADS' },
        { big: ecLevelN > 0 ? 'Lv ' + ecLevelN : '—', lab: 'EMO CRUSH' },
        { big: flBestN  > 0 ? String(flBestN)  : '—', lab: 'FLAP EMONAD' },
        { big: trN      > 0 ? String(trN)      : '—', lab: 'TAROT' },
      ];

      const gridY    = 478;
      const gridH    = 102;
      const gridPad  = 48;
      const gap      = 14;
      const cellW    = (W - gridPad * 2 - gap * (cards.length - 1)) / cards.length;

      for (let i = 0; i < cards.length; i++) {
        const x = gridPad + i * (cellW + gap);
        const y = gridY;

        // Cell background — slightly stronger fill, deeper border, soft inner glow
        ctx.save();
        const cellGrad = ctx.createLinearGradient(x, y, x, y + gridH);
        cellGrad.addColorStop(0, 'rgba(155, 95, 255, 0.18)');
        cellGrad.addColorStop(1, 'rgba(155, 95, 255, 0.06)');
        ctx.fillStyle = cellGrad;
        roundRectPath(ctx, x, y, cellW, gridH, 18);
        ctx.fill();
        ctx.strokeStyle = 'rgba(155, 95, 255, 0.35)';
        ctx.lineWidth = 1.5;
        roundRectPath(ctx, x, y, cellW, gridH, 18);
        ctx.stroke();
        // Top accent line
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + 18, y + 1);
        ctx.lineTo(x + cellW - 18, y + 1);
        ctx.stroke();
        ctx.restore();

        // Big number — pixel-bold, with subtle glow
        ctx.save();
        ctx.shadowColor = 'rgba(155, 95, 255, 0.35)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#fff';
        ctx.font = '900 46px "Space Grotesk", system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(cards[i].big, x + cellW / 2, y + 58);
        ctx.restore();

        // Label — wider letter-spacing for the engraved feel
        ctx.fillStyle = '#b8a3e8';
        ctx.font = '800 14px "Space Grotesk", system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(cards[i].lab, x + cellW / 2, y + 85);
      }

      // ─── Footer ───────────────────────────────────────────────
      // Left side: tagline
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 13px "Space Grotesk", system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('the home of $EMO  ·  live on monad', 56, H - 30);

      // Right side: brand mark with accent dot
      ctx.fillStyle = '#9B5FFF';
      const dotX = W - 175;
      const brandY = H - 30;
      ctx.beginPath(); ctx.arc(dotX, brandY - 5, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '900 18px "Space Grotesk", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('emonad.lol', dotX + 12, brandY);

      return canvas;
    }

    function openShareModal(p) {
      // Remove existing
      const prev = document.getElementById('shareRoot'); if (prev) prev.remove();

      const root = document.createElement('div');
      root.className = 'share-backdrop';
      root.id = 'shareRoot';
      root.addEventListener('click', e => { if (e.target === root) root.remove(); });

      const modal = document.createElement('div');
      modal.className = 'share-modal';
      modal.innerHTML = `
        <button class="share-modal-close" aria-label="Close">✕</button>
        <h3>Share your stats</h3>
        <div class="preview" id="sharePreview">
          <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;">Generating card…</div>
        </div>
        <div class="hint">Tip: <b>Copy image</b> → click <b>Tweet</b> → paste (Ctrl+V) into the X compose box.</div>
        <div class="row">
          <button class="btn" id="shareCopy" type="button">Copy image</button>
          <button class="btn" id="shareDownload" type="button">Download</button>
          <a class="btn primary" id="shareTweet" target="_blank" rel="noopener noreferrer" href="${p.xShareHref}">Tweet</a>
        </div>
      `;
      root.appendChild(modal);
      document.body.appendChild(root);

      modal.querySelector('.share-modal-close').addEventListener('click', () => root.remove());
      const onKey = e => { if (e.key === 'Escape') { root.remove(); document.removeEventListener('keydown', onKey); } };
      document.addEventListener('keydown', onKey);

      // Build the card asynchronously
      buildStatsCard(p).then(canvas => {
        const preview = modal.querySelector('#sharePreview');
        preview.innerHTML = '';
        preview.appendChild(canvas);

        const handle = (p.profile.x_handle || 'emonad').replace(/^@/, '');
        const filename = `emonad-${handle}-${p.total}xp.png`;

        const copyBtn = modal.querySelector('#shareCopy');
        copyBtn.addEventListener('click', async () => {
          try {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
            if (!navigator.clipboard || !window.ClipboardItem) {
              throw new Error('clipboard_unsupported');
            }
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            const orig = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = orig, 1500);
          } catch (err) {
            console.warn('copy image failed', err);
            copyBtn.textContent = "Can't copy — use Download";
            setTimeout(() => copyBtn.textContent = 'Copy image', 2200);
          }
        });

        const dlBtn = modal.querySelector('#shareDownload');
        dlBtn.addEventListener('click', () => {
          canvas.toBlob(blob => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
          }, 'image/png');
        });
      }).catch(err => {
        console.error('card build failed', err);
        const preview = modal.querySelector('#sharePreview');
        preview.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;text-align:center;padding:0 16px;">Couldn't render card. You can still tweet the link.</div>`;
      });
    }

    EmoProfile.init({ page: 'profile' })
      .then(() => EmoProfile.mount('#emoAuthSlot'))
      .catch(err => console.warn('EmoProfile init failed:', err));

    load().catch(err => {
      console.error(err);
      document.getElementById('content').innerHTML = `
        <div class="error">
          <div class="big">Couldn't load profile</div>
          <div>${escapeHtml(err.message || 'Unknown error')}</div>
        </div>`;
    });
  </script>
</body>
</html>
