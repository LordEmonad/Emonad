name = "emonad-og"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Custom domain — added manually in CF dashboard after first deploy.
# (Workers → emonad-og → Settings → Triggers → Custom Domains → Add Domain → `i.emonad.lol`)
# We don't auto-bind via `routes` because Custom Domains capture the whole
# hostname automatically once attached; wrangler's `routes` block is only
# for path-pattern matching on existing zones.

# Workers Paid: 10M requests/month, 30s CPU per request, 30M CPU ms/month.
# We set cpu_ms explicitly so the deployment binds to the paid limit even
# if the plan-upgrade hasn't fully propagated to this Worker's defaults.
[limits]
cpu_ms = 30000

# Secrets (set via `wrangler secret put SUPABASE_ANON_KEY` AFTER first deploy):
#   SUPABASE_ANON_KEY — public anon key from Supabase project settings
[vars]
SUPABASE_URL = "https://jdymhwsfmodqxvhcdsti.supabase.co"
SITE_ORIGIN  = "https://emonad.lol"
