    // ─────────────────────────────────────────────────────────
    //  Reading flow
    // ─────────────────────────────────────────────────────────
    async function startReading() {
      setPhase('shuffling');
      openPanel(false);
      clearStage();
      await sleep(60);
      measureStage();
      await spawnDeckAtCenter();
      await shuffleAnim();
      await fanCards();
      enterPickPhase();
    }

    function measureStage() {
      // Compute the area available to cards. When the reading panel is open, the
      // panel covers either the right ~420px (desktop) or bottom 55% (mobile),
      // so cards must fit inside the remaining region. Compute that target up
      // front so cards don't briefly overflow during the panel's slide-in.
      const r = stageTable.getBoundingClientRect();
      let w = r.width, h = r.height;
      if (state.phase === 'revealed') {
        if (window.innerWidth <= 900) h = h * 0.45;
        else w = Math.max(360, w - 420);
      }
      state.stageDims = { w, h };
    }

    function getCardSize(forSpread = state.spread) {
      const sp = SPREADS[forSpread];
      const n = sp.count;
      const W = state.stageDims.w, H = state.stageDims.h;
      const isPhone = window.innerWidth <= 720;
      let cw;
      if (n === 1)       cw = Math.min(W * 0.32, H * 0.40);
      else if (n === 3)  cw = Math.min(W * 0.22, H * 0.34);
      else if (n === 7)  cw = Math.min(W * 0.13, H * 0.26);
      else               cw = Math.min(W * 0.10, H * 0.20); // celtic
      // Phone-aware floor: small enough to fit the spread but readable.
      const minCw = isPhone ? (n >= 7 ? 50 : 64) : 72;
      cw = Math.max(minCw, cw);
      return { cw, ch: cw * 8 / 5 };
    }

    async function spawnDeckAtCenter() {
      // Reversals off by default — every card is drawn upright. The data
      // model still supports reversed; flip this to `Math.random() < 0.3` to
      // re-enable.
      state.deck = shuffleArr(CARDS).map(c => ({ card: c, reversed: false }));
      const W = state.stageDims.w, H = state.stageDims.h;
      const { cw, ch } = getCardSize();
      const els = [];
      for (let i = 0; i < state.deck.length; i++) {
        const c = makeCard(state.deck[i]);
        c.classList.add('no-anim');
        c.style.setProperty('--cw', cw + 'px');
        c.style.setProperty('--ch', ch + 'px');
        c.style.left = (W/2 - cw/2) + 'px';
        c.style.top = (H/2 - ch/2) + 'px';
        c.style.transform = `translate(${(Math.random()-0.5)*1.5}px, ${(Math.random()-0.5)*1.5}px) rotate(${(i-state.deck.length/2)*0.18}deg)`;
        c.style.zIndex = i;
        stageTable.appendChild(c);
        els.push(c);
      }
      state.cardEls = els;
      renderHudDots(0, 0);
      await sleep(80);
      // remove no-anim
      els.forEach(c => c.classList.remove('no-anim'));
    }

    async function shuffleAnim() {
      const { cw, ch } = getCardSize();
      const W = state.stageDims.w, H = state.stageDims.h;
      const cx = W/2 - cw/2, cy = H/2 - ch/2;
      const els = state.cardEls;
      // pass 1: explode out
      for (let i = 0; i < els.length; i++) {
        const c = els[i];
        const a = Math.random() * Math.PI * 2;
        const r = 80 + Math.random() * 70;
        c.style.transition = 'transform 0.55s cubic-bezier(0.4, 0, 0.4, 1)';
        c.style.transform = `translate(${Math.cos(a)*r}px, ${Math.sin(a)*r*0.6}px) rotate(${(Math.random()-0.5)*60}deg)`;
      }
      await sleep(540);
      // pass 2: collapse back & jiggle
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < els.length; i++) {
          const c = els[i];
          c.style.transition = 'transform 0.22s cubic-bezier(0.5, 0, 0.5, 1)';
          c.style.transform = `translate(${(Math.random()-0.5)*10}px, ${(Math.random()-0.5)*8}px) rotate(${(Math.random()-0.5)*18}deg)`;
        }
        await sleep(220);
      }
    }

    // Mobile-only: lay all 22 face-down cards out in a clean grid that fills
    // the visible stage. Tapping a card behaves identically to the desktop
    // fan, but the layout is non-rotated and tap-target friendly.
    async function placeMobileGrid(els, W, H) {
      const n = els.length;
      const cols = 5;                      // 5 wide → 22 fits in 5×5 grid (last row has 2)
      const rows = Math.ceil(n / cols);
      const gap = 8;
      const sideM = 12;
      const topM = 64;                     // clearance for HUD dots
      const bottomM = 14;

      const availW = W - 2 * sideM;
      const availH = H - topM - bottomM;

      // Width-first sizing, then scale down if rows exceed available height.
      let cardW = (availW - (cols - 1) * gap) / cols;
      let cardH = cardW * 8 / 5;
      const totalRowsH = rows * cardH + (rows - 1) * gap;
      if (totalRowsH > availH) {
        cardH = (availH - (rows - 1) * gap) / rows;
        cardW = cardH * 5 / 8;
      }

      const totalH = rows * cardH + (rows - 1) * gap;
      const startY = topM + (availH - totalH) / 2;

      for (let i = 0; i < n; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const itemsThisRow = (r === rows - 1) ? (n - r * cols) : cols;
        const rowW = itemsThisRow * cardW + (itemsThisRow - 1) * gap;
        const rowStartX = (W - rowW) / 2;
        const x = rowStartX + c * (cardW + gap);
        const y = startY + r * (cardH + gap);

        const card = els[i];
        card.style.setProperty('--cw', cardW + 'px');
        card.style.setProperty('--ch', cardH + 'px');
        card.style.transition = 'transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), left 0.7s cubic-bezier(0.22, 1, 0.36, 1), top 0.7s cubic-bezier(0.22, 1, 0.36, 1)';
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        card.style.transform = 'rotate(0deg)';
        card.style.zIndex = 100 + i;
        card.dataset.fanIndex = i;
        card.dataset.fanRot = 0;
        card.style.setProperty('--hover-pop', `translateY(-${Math.round(cardH * 0.14)}px) scale(1.06)`);
      }
      await sleep(720);
    }

    async function fanCards() {
      const els = state.cardEls;
      const W = state.stageDims.w, H = state.stageDims.h;
      const fanCount = els.length;
      const isPhone = window.innerWidth <= 720;

      // On phones, picking is a flat grid — no fan, no rotation.
      if (isPhone) return placeMobileGrid(els, W, H);

      // Desktop: classic fan / hand-of-cards.
      const fanCw = Math.max(78, Math.min(130, W * 0.088, H * 0.20));
      const fanCh = fanCw * 8 / 5;

      const margin = 22;
      const topMargin = 72;
      const arcCx = W / 2;
      const arcCy = H + fanCh * 0.35;
      const radius = Math.max(220, arcCy - topMargin - fanCh / 2);

      const safeHalfW = (fanCw + fanCh) / 2 + margin;
      const sinHalfMax = Math.max(0.05, Math.min(0.55, (arcCx - safeHalfW) / radius));
      const halfAngle = Math.asin(sinHalfMax);
      const totalAngle = halfAngle * 2;
      const startAngle = -Math.PI / 2 - totalAngle / 2;

      for (let i = 0; i < fanCount; i++) {
        const t = fanCount === 1 ? 0.5 : i / (fanCount - 1);
        const angle = startAngle + t * totalAngle;
        const px = arcCx + Math.cos(angle) * radius;
        const py = arcCy + Math.sin(angle) * radius;
        const rot = (angle + Math.PI / 2) * 180 / Math.PI;
        const c = els[i];
        c.style.setProperty('--cw', fanCw + 'px');
        c.style.setProperty('--ch', fanCh + 'px');
        c.style.transition = 'transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), left 0.85s cubic-bezier(0.22, 1, 0.36, 1), top 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
        c.style.left = (px - fanCw / 2) + 'px';
        c.style.top  = (py - fanCh / 2) + 'px';
        c.style.transform = `rotate(${rot}deg)`;
        // Fan cards sit at high z so they ALWAYS overlay picked cards during
        // the picking phase (picked cards slip beneath the spread).
        c.style.zIndex = 100 + i;
        c.dataset.fanIndex = i;
        c.dataset.fanRot = rot;
        c.style.setProperty('--hover-pop', `translateY(-${Math.round(fanCh * 0.18)}px) scale(1.08)`);
      }
      await sleep(880);
    }

    function enterPickPhase() {
      setPhase('picking');
      const need = SPREADS[state.spread].count;
      renderHudDots(0, need);
      state.cardEls.forEach(c => {
        c.classList.add('hover-lift');
        c.addEventListener('click', onPickCard);
      });
    }

    function renderHudDots(filled, total) {
      hudDots.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const d = el('div', 'hud-dot' + (i < filled ? ' filled' : ''));
        hudDots.appendChild(d);
      }
    }

    async function onPickCard(e) {
      if (state.phase !== 'picking') return;
      const c = e.currentTarget;
      if (c.classList.contains('picked')) return;
      const need = SPREADS[state.spread].count;
      if (state.picks.length >= need) return;
      const fanIdx = parseInt(c.dataset.fanIndex, 10);
      c.classList.add('picked');
      c.classList.remove('hover-lift');
      c.style.pointerEvents = 'none';
      state.picks.push(fanIdx);
      const slotIdx = state.picks.length - 1;
      animateToSlot(c, slotIdx);
      renderHudDots(state.picks.length, need);
      if (state.picks.length === need) {
        // dim leftovers and fade them out
        state.cardEls.forEach(other => {
          if (!other.classList.contains('picked')) {
            other.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            other.style.opacity = '0';
            other.style.transform += ' scale(0.92)';
          }
        });
        await sleep(520);
        state.cardEls.forEach(c => { if (!c.classList.contains('picked')) c.remove(); });
        await revealAll();
        await sleep(300);
        renderReading();
      }
    }

    function getSlotMetrics(slotIdx) {
      const sp = SPREADS[state.spread];
      const layout = sp.layout[slotIdx];
      const W = state.stageDims.w, H = state.stageDims.h;
      const { cw, ch } = getCardSize();
      const px = W * layout.x;
      const py = H * layout.y;
      return { cw, ch, px, py, rot: layout.rot || 0, cross: !!layout.cross };
    }

    function animateToSlot(cardEl, slotIdx) {
      const { cw, ch, px, py, rot } = getSlotMetrics(slotIdx);
      cardEl.style.setProperty('--cw', cw + 'px');
      cardEl.style.setProperty('--ch', ch + 'px');
      cardEl.style.transition = 'left 0.85s cubic-bezier(0.22,1,0.36,1), top 0.85s cubic-bezier(0.22,1,0.36,1), transform 0.85s cubic-bezier(0.22,1,0.36,1)';
      cardEl.style.left = (px - cw/2) + 'px';
      cardEl.style.top = (py - ch/2) + 'px';
      cardEl.style.transform = `rotate(${rot}deg)`;
      // Picked cards slip BENEATH the fan during picking. Within picked
      // cards, later picks sit on top of earlier ones (matters for the
      // Celtic Cross, where slot 2 visually crosses slot 1).
      cardEl.style.zIndex = 1 + slotIdx;
      cardEl.dataset.slot = slotIdx;
    }

    async function revealAll() {
      const sp = SPREADS[state.spread];
      const sortedPicks = state.cardEls
        .filter(c => c.classList.contains('picked'))
        .sort((a, b) => (+a.dataset.slot) - (+b.dataset.slot));
      // add position labels
      sortedPicks.forEach((c, i) => {
        const layout = sp.layout[i];
        if (layout.cross) return;
        const { cw, ch, px, py } = getSlotMetrics(i);
        const lab = el('div', 'pos-label', { text: sp.positions[i].label });
        lab.style.left = px + 'px';
        lab.style.top = (py + ch / 2 + 8) + 'px';
        lab.style.width = (cw + 30) + 'px';
        stageTable.appendChild(lab);
        setTimeout(() => lab.classList.add('visible'), 260 * i + 1100);
      });
      // flip with stagger
      for (let i = 0; i < sortedPicks.length; i++) {
        await sleep(220);
        sortedPicks[i].classList.add('flipped');
      }
      // After reveal, make cards tappable to open the zoom viewer.
      sortedPicks.forEach(c => {
        c.style.pointerEvents = 'auto';
        c.style.cursor = 'zoom-in';
        c.addEventListener('click', onRevealedCardClick);
      });
    }

    function onRevealedCardClick(e) {
      const c = e.currentTarget;
      const slot = parseInt(c.dataset.slot, 10);
      const fanIdx = parseInt(c.dataset.fanIndex, 10);
      const entry = state.deck[fanIdx];
      const position = SPREADS[state.spread].positions[slot];
      openCardModal(entry, position);
    }

    // ─────────────────────────────────────────────────────────
    //  Reading panel render
    // ─────────────────────────────────────────────────────────
    function renderReading() {
      setPhase('revealed');
      const sp = SPREADS[state.spread];
      const question = ''; // question input removed — readings are unprompted
      const picks = state.cardEls
        .filter(c => c.classList.contains('picked'))
        .sort((a, b) => (+a.dataset.slot) - (+b.dataset.slot))
        .map(c => state.deck[parseInt(c.dataset.fanIndex, 10)]);

      document.getElementById('readingSpreadName').textContent = sp.name;
      const qEl = document.getElementById('readingQuestion');
      qEl.textContent = '';
      qEl.style.display = 'none';

      const body = document.getElementById('readingBody');
      body.innerHTML = '';
      picks.forEach((entry, i) => {
        const r = el('div', 'read-card');
        r.style.animationDelay = (i * 0.08) + 's';
        const meaning = entry.reversed ? entry.card.reversed : entry.card.upright;
        r.innerHTML = `
          <div class="pos">${escapeHtml(sp.positions[i].label)}</div>
          <div class="name">${escapeHtml(entry.card.name)}<span class="orient">${entry.reversed ? '· Reversed' : '· Upright'}</span></div>
          <div class="frame">${escapeHtml(sp.positions[i].frame)}</div>
          <div class="keys">${entry.card.keys.map(k => `<span class="key">${escapeHtml(k)}</span>`).join('')}</div>
          <div class="meaning">${escapeHtml(meaning)}</div>`;
        body.appendChild(r);
      });
      const synth = el('div', 'synthesis');
      synth.innerHTML = `<h3>The thread</h3>${synthesize(picks, sp, question)}`;
      body.appendChild(synth);

      openPanel(true);

      // Re-measure for the panel-open layout and reposition cards immediately.
      // Both the stage-table and the cards use 0.85s transitions, so they
      // animate into their final positions in sync.
      relayoutCards();

      // Save
      try {
        localStorage.setItem('emo:tarot:last', JSON.stringify({
          ts: Date.now(), spread: state.spread, question,
          picks: picks.map(p => ({ slug: p.card.slug, reversed: p.reversed })),
        }));
      } catch (_) {}

      // Claim daily +5 XP if user is logged in (silent no-op otherwise).
      // EmoProfile also bumps tarot_records.readings_count server-side
      // (via trigger) so the public profile page reflects the new count.
      try {
        const EP = window.EmoProfile;
        if (EP && EP.isLoggedIn && EP.isLoggedIn()) {
          EP.claimDaily('tarot');
        }
      } catch (e) { console.warn('tarot: EmoProfile claim failed', e); }
    }

    function relayoutCards() {
      measureStage();
      state.cardEls.forEach(c => {
        if (!c.classList.contains('picked')) return;
        const slotIdx = parseInt(c.dataset.slot, 10);
        if (Number.isNaN(slotIdx)) return;
        const { cw, ch, px, py, rot } = getSlotMetrics(slotIdx);
        c.style.setProperty('--cw', cw + 'px');
        c.style.setProperty('--ch', ch + 'px');
        c.style.left = (px - cw/2) + 'px';
        c.style.top = (py - ch/2) + 'px';
        c.style.transform = `rotate(${rot}deg)`;
      });
      // re-position position labels
      const sp = SPREADS[state.spread];
      stageTable.querySelectorAll('.pos-label').forEach((lab, i) => {
        const layout = sp.layout[i];
        if (!layout || layout.cross) { lab.remove(); return; }
        const { cw, ch, px, py } = getSlotMetrics(i);
        lab.style.left = px + 'px';
        lab.style.top = (py + ch / 2 + 8) + 'px';
        lab.style.width = (cw + 30) + 'px';
      });
    }

    // ─────────────────────────────────────────────────────────
    //  Synthesis (uses elemental dignities + spread signature)
    // ─────────────────────────────────────────────────────────
    function elementSignature(picks) {
      const c = { fire:0, water:0, air:0, earth:0 };
      picks.forEach(p => { c[p.card.el] = (c[p.card.el] || 0) + 1; });
      const sorted = Object.entries(c).filter(([,n]) => n > 0).sort((a,b) => b[1] - a[1]);
      if (!sorted.length) return null;
      const total = picks.length;
      const [domEl, domN] = sorted[0];
      const phr = {
        fire:  "runs hot — action, will, urgency",
        water: "runs deep — feelings, intuition, undercurrent",
        air:   "runs sharp — thought, communication, clarity",
        earth: "runs grounded — body, money, slow-build",
      };
      const dominance = domN >= Math.ceil(total * 0.6)
        ? `the reading <strong>${phr[domEl]}</strong> — pace yourself accordingly`
        : (sorted.length >= 3 ? `mixed elements — there's no single weather, the answer is in the blend` : `${phr[domEl]}, with ${sorted[1][0]} as a counterweight`);
      return { dominance, breakdown: sorted.map(([el,n]) => `${n} ${el}`).join(' · ') };
    }
    function dignityNote(a, b) {
      const r = dignity(a.card.el, b.card.el);
      return r === 'friendly' ? 'amplifying each other'
           : r === 'hostile'  ? 'pulling in opposite directions'
           : r === 'compound' ? 'doubling down on the same note'
                              : 'side by side, neither helping nor hurting';
    }
    function reversalNote(rc, total) {
      if (rc === 0) return "";
      if (rc / total >= 0.6) return ` Most cards landed reversed — read them as <em>blocked, delayed, or pointing inward</em>, not negative. The whole reading is asking for an internal pivot before an external one.`;
      if (rc === 1) return ` One card is reversed — read it as <em>blocked, internalized, or running quiet</em>, not as a curse.`;
      return ` Several cards reversed. Reversed isn't bad — it's <em>blocked, internal, delayed, or shadow-side</em>. Honesty before action.`;
    }
    // Build a "thesis sentence" — one line that ties all cards together up
    // front. Uses each card's first keyword + spread-specific connective glue.
    function buildThesis(picks, sp) {
      const first = (p) => p.card.keys[0];
      if (picks.length === 1) {
        return `Today's air is <em>${escapeHtml(first(picks[0]))}</em> — that's the lens for everything you'll touch.`;
      }
      if (picks.length === 3) {
        const [p1, p2, p3] = picks;
        return `What was <em>${escapeHtml(first(p1))}</em> is becoming <em>${escapeHtml(first(p2))}</em>, pointing toward <em>${escapeHtml(first(p3))}</em>.`;
      }
      if (picks.length === 7) {
        const present = picks[1], advice = picks[5], outcome = picks[6];
        return `You're standing in <em>${escapeHtml(first(present))}</em>; the move is <em>${escapeHtml(first(advice))}</em>, the destination is <em>${escapeHtml(first(outcome))}</em>.`;
      }
      // Celtic Cross
      const heart = picks[0], self = picks[6], outcome = picks[9];
      return `At the heart: <em>${escapeHtml(first(heart))}</em>. Your stance: <em>${escapeHtml(first(self))}</em>. Where this lands: <em>${escapeHtml(first(outcome))}</em>.`;
    }

    // Closing essence sentence — derived from the most "outcome-like" card
    // for each spread. Always second person, present tense, action verb.
    function buildEssence(picks, sp) {
      // For named pairs, prefer that combo's flavor.
      const np = findNamedPair(picks);
      if (np && picks.length >= 3) {
        // Use the card that's later in the spread for the essence (more
        // forward-looking).
        const focus = (np.a.card.n + np.b.card.n >= 16) ? np.b : np.a;
        return CARD_ESSENCE[focus.card.n];
      }
      let outcomeCard;
      if (picks.length === 1)      outcomeCard = picks[0];
      else if (picks.length === 3) outcomeCard = picks[2];   // future
      else if (picks.length === 7) outcomeCard = picks[5];   // advice (more actionable than outcome)
      else                         outcomeCard = picks[9];   // celtic outcome
      return CARD_ESSENCE[outcomeCard.card.n];
    }

    // Trajectory shape detection for 3-card spread (Pollack/Greer)
    function trajectoryShape(p1, p2, p3) {
      const e1 = p1.card.el, e2 = p2.card.el, e3 = p3.card.el;
      if (e1 === e2 && e2 === e3) return { kind: 'stagnation', text: "Same element across all three positions — you're swimming in one current. The lesson is what you do <em>inside</em> the constant, not how to escape it." };
      if (e1 === e3 && e1 !== e2) return { kind: 'pivot',      text: "Past and future share an element with the present pivoting through a different current — this is a true turning point, not a smooth arc." };
      if (e1 === e3)              return { kind: 'cyclic',     text: "Past and future share the same energy — a pattern is repeating. Notice it before it becomes a habit." };
      if (dignity(e1, e3) === 'hostile') return { kind: 'reversal', text: "Past and future are in opposing elements — genuine change is underway. The middle card is the lever." };
      if (dignity(e1, e3) === 'friendly') return { kind: 'flowing',  text: "Past and future are friendly elements — momentum is on your side, no fight needed." };
      return { kind: 'mixed', text: "Three different elements — a varied arc, no single weather pattern. Trust the through-line, not any one position." };
    }

    function reversedHint(p, force) {
      if (!p.reversed) return '';
      return force ? ' reversed' : ' (rev)';
    }

    function synthesize(picks, sp, question) {
      const sig = elementSignature(picks);
      const rc = picks.filter(p => p.reversed).length;
      const allUpright = rc === 0;

      // Meta — element signature + archetypal axis if present
      const namedPair = findNamedPair(picks);
      const sum21 = findSum21Axis(picks);
      const theo = picks.length > 1 ? theosophicSum(picks) : null;
      let metaBits = [];
      if (sig)    metaBits.push(`${sig.breakdown}; ${sig.dominance}`);
      if (sum21)  metaBits.push(`<strong style="color:var(--gold)">Archetypal axis.</strong> ${sum21.meaning}`);
      else if (namedPair) metaBits.push(`<strong style="color:var(--gold)">A named pair sits in this reading.</strong> ${namedPair.meaning}`);
      if (theo && picks.length >= 3) {
        const tn = theoCardName(theo);
        if (tn) metaBits.push(`<strong style="color:var(--gold)">Soul card.</strong> The numbers reduce to <strong>${escapeHtml(tn)}</strong> — the deeper archetype underneath the surface question.`);
      }
      if (allUpright && picks.length > 1) {
        metaBits.push(`Every card landed upright — the energies are running in the open here, no hidden sabotage. What you see is what's actually moving.`);
      }
      const sigLine = metaBits.length
        ? `<p style="color:var(--text-2);font-size:13.5px"><strong style="color:var(--gold);letter-spacing:0.5px">Signature.</strong> ${metaBits.join('. ')}.${reversalNote(rc, picks.length)}</p>`
        : "";

      // Thesis (always first)
      const thesis = `<p>${buildThesis(picks, sp)}</p>`;

      // Body — per spread
      let body = '';
      if (picks.length === 1) {
        const p = picks[0];
        body = `<p><strong>${escapeHtml(p.card.name)}</strong>${reversedHint(p, true)} sits with you today. ${p.reversed ? "Reversed here reads as <em>blocked, internal, or running quiet</em> — not as a curse." : "It's the air the day is breathing — lean into it where you can."}</p>`;

      } else if (picks.length === 3) {
        const [p1, p2, p3] = picks;
        const traj = trajectoryShape(p1, p2, p3);
        body = `<p><strong>${escapeHtml(p1.card.name)}</strong>${reversedHint(p1)} set the bones; <strong>${escapeHtml(p2.card.name)}</strong>${reversedHint(p2)} is what you're standing in; <strong>${escapeHtml(p3.card.name)}</strong>${reversedHint(p3)} is the door at the end of the hall.</p><p>${traj.text}</p>`;

      } else if (picks.length === 7) {
        const [past, present, hidden, querent, others, advice, outcome] = picks;
        // Three diagnostic axes per the horseshoe craft notes
        const pastVsOutcome = dignity(past.card.el, outcome.card.el);
        const hiddenVsQuerent = dignity(hidden.card.el, querent.card.el);
        const stanceVsRoom = dignity(querent.card.el, others.card.el);

        const arcLine = pastVsOutcome === 'compound'
          ? `<p>Past and outcome share elements — the wave you started in is still the one carrying you. If that's a problem, this is the moment to break the pattern.</p>`
          : pastVsOutcome === 'hostile'
            ? `<p>Past and outcome sit in opposite elements — a genuine pivot is underway, you're not just repeating yourself.</p>`
            : `<p>Past and outcome are different but compatible — natural evolution, not a rupture.</p>`;

        const hiddenLine = hiddenVsQuerent === 'hostile'
          ? `<p><strong>${escapeHtml(hidden.card.name)}</strong>${reversedHint(hidden)} sits below the waterline — and it's at odds with how you're showing up (<strong>${escapeHtml(querent.card.name)}</strong>${reversedHint(querent)}). Name the gap before it names you.</p>`
          : `<p>What you don't yet see: <strong>${escapeHtml(hidden.card.name)}</strong>${reversedHint(hidden)}. Bring it into light and the rest stops feeling so heavy.</p>`;

        const roomLine = stanceVsRoom === 'hostile'
          ? `<p>Your stance and the room (<strong>${escapeHtml(others.card.name)}</strong>${reversedHint(others)}) are at odds — they're seeing a different movie than you are. Don't argue the perception; change the picture.</p>`
          : stanceVsRoom === 'friendly'
            ? `<p>Your stance and the room are aligned — the people around this are reading you correctly. You don't need to over-explain.</p>`
            : '';

        const adviceLine = `<p><strong>${escapeHtml(advice.card.name)}</strong>${reversedHint(advice)} is the lever — the outcome (<strong>${escapeHtml(outcome.card.name)}</strong>${reversedHint(outcome)}) is conditional on whether you take it.</p>`;

        body = arcLine + hiddenLine + roomLine + adviceLine;

      } else {
        // Celtic Cross (10) — diagnostic axes per master craft
        const [heart, cross, foundation, past, crown, future, self, env, hopes, outcome] = picks;
        const hcDig = dignity(heart.card.el, cross.card.el);
        const fcDig = dignity(foundation.card.el, crown.card.el);
        const pfDig = dignity(past.card.el, future.card.el);
        const seDig = dignity(self.card.el, env.card.el);
        const coDig = dignity(crown.card.el, outcome.card.el);
        const hoDig = dignity(hopes.card.el, outcome.card.el);

        const heartLine = `<p>The defining tension: <strong>${escapeHtml(heart.card.name)}</strong>${reversedHint(heart)} crossed by <strong>${escapeHtml(cross.card.name)}</strong>${reversedHint(cross)}. ${hcDig === 'hostile' ? "The obstacle is structural — coming from outside or from a deep pattern." : hcDig === 'friendly' ? "The obstacle is internal — your own resistance dressed up as an external block." : "An obstacle that neither wholly threatens nor wholly serves you. Read its lesson, not its threat."}</p>`;

        const fcLine = fcDig === 'hostile'
          ? `<p>Foundation (<strong>${escapeHtml(foundation.card.name)}</strong>${reversedHint(foundation)}) and conscious aim (<strong>${escapeHtml(crown.card.name)}</strong>${reversedHint(crown)}) are <em>misaligned</em>. What you say you want and what you're actually rooted in are pulling in different directions — the conscious plan won't survive the foundation as-is.</p>`
          : fcDig === 'friendly'
            ? `<p>Foundation and crown speak the same language — your visible aim rests on real ground. Don't second-guess the plan.</p>`
            : `<p>Foundation: <strong>${escapeHtml(foundation.card.name)}</strong>${reversedHint(foundation)}. Crown: <strong>${escapeHtml(crown.card.name)}</strong>${reversedHint(crown)}. Tolerating each other, neither leading — the question is which one you commit to.</p>`;

        const trajLine = pfDig === 'compound'
          ? `<p>Past and near future share elements — the same wave is still carrying you. ${past.card.n === future.card.n ? "Same card past and future — a cycle is closing exactly where it opened." : "Same energy, different shape."}</p>`
          : pfDig === 'hostile'
            ? `<p>Past and near future sit in opposing elements — a real pivot is at the door, not just a refresh.</p>`
            : '';

        const stanceLine = seDig === 'hostile'
          ? `<p>Your stance (<strong>${escapeHtml(self.card.name)}</strong>${reversedHint(self)}) and the environment (<strong>${escapeHtml(env.card.name)}</strong>${reversedHint(env)}) clash — you're misreading your own image, or the room is. Worth checking which.</p>`
          : '';

        const hopesLine = hopes.card.n === outcome.card.n
          ? `<p>Hopes/fears and outcome are the same card — what you fear and what arrives are the same energy. Make peace with the card, not with avoidance.</p>`
          : hoDig === 'hostile'
            ? `<p>What you carry quietly (<strong>${escapeHtml(hopes.card.name)}</strong>${reversedHint(hopes)}) is fighting the outcome. Notice the resistance; it's louder than you think.</p>`
            : '';

        const outcomeLine = `<p><strong>${escapeHtml(outcome.card.name)}</strong>${reversedHint(outcome)} is where this lands on the current line. ${coDig === 'hostile' ? "It diverges from your conscious aim — adjust the plan or accept the deviation." : coDig === 'friendly' ? "It aligns with what you're crowning — keep the line." : "Neither resisting nor confirming the goal — the lever is your stance."}</p>`;

        body = heartLine + fcLine + trajLine + stanceLine + hopesLine + outcomeLine;
      }

      // Essence — closing line, ≤15 words, second-person imperative
      const essence = `<p style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><strong style="color:var(--gold);letter-spacing:0.5px">Essence.</strong> ${escapeHtml(buildEssence(picks, sp))}</p>`;

      return [sigLine, thesis, body, essence].join('');
    }

    // ─────────────────────────────────────────────────────────
    //  Share image renderer (offscreen canvas → PNG)
    // ─────────────────────────────────────────────────────────
    async function generateShareImage() {
      const sp = SPREADS[state.spread];
      const question = '';
      const picks = state.cardEls.filter(c => c.classList.contains('picked'))
        .sort((a,b) => (+a.dataset.slot)-(+b.dataset.slot))
        .map(c => state.deck[parseInt(c.dataset.fanIndex, 10)]);

      const W = 1080, H = 1080;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // ── Background: deep midnight with layered glows ──
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#1d1240');
      bg.addColorStop(0.55, '#0c0820');
      bg.addColorStop(1, '#04020c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // upper purple aurora
      let glow = ctx.createRadialGradient(W/2, -80, 0, W/2, 220, 760);
      glow.addColorStop(0, 'rgba(176, 124, 255, 0.5)');
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      // bottom amber glow
      glow = ctx.createRadialGradient(W/2, H + 60, 0, W/2, H - 180, 640);
      glow.addColorStop(0, 'rgba(255, 154, 60, 0.22)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      // side ambient
      glow = ctx.createRadialGradient(60, H/2, 0, 60, H/2, 540);
      glow.addColorStop(0, 'rgba(120, 50, 230, 0.18)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      glow = ctx.createRadialGradient(W - 60, H/2, 0, W - 60, H/2, 540);
      glow.addColorStop(0, 'rgba(120, 50, 230, 0.14)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      // sealed-edge vignette
      const vig = ctx.createRadialGradient(W/2, H/2, H * 0.35, W/2, H/2, H * 0.85);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

      // stars
      for (let i = 0; i < 200; i++) {
        const x = Math.random() * W, y = Math.random() * H;
        const r = Math.random() * 1.4 + 0.3;
        const a = Math.random() * 0.7 + 0.2;
        ctx.fillStyle = Math.random() < 0.08 ? `rgba(243,210,122,${a})` : `rgba(203,179,255,${a})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      // a handful of warm embers
      for (let i = 0; i < 18; i++) {
        const x = Math.random() * W, y = Math.random() * H;
        const r = Math.random() * 2 + 1.4;
        const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
        halo.addColorStop(0, 'rgba(255, 200, 120, 0.55)');
        halo.addColorStop(1, 'rgba(255, 140, 60, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(x, y, r * 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 220, 160, 0.85)';
        ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fill();
      }

      // outer double gold frame
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.6)';
      ctx.lineWidth = 1.4;
      roundRectStroke(ctx, 24, 24, W - 48, H - 48, 22);
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.22)';
      ctx.lineWidth = 1;
      roundRectStroke(ctx, 34, 34, W - 68, H - 68, 18);

      // corner flourishes
      drawCornerFlourishes(ctx, 24, 24, W - 48, H - 48);

      // ── Header ──
      ctx.textAlign = 'center';
      // top divider with center diamond
      drawDivider(ctx, W/2, 78, 280);

      ctx.fillStyle = '#f3d27a';
      ctx.font = '800 22px "Space Grotesk", system-ui, sans-serif';
      drawSpacedText(ctx, 'EMO TAROT', W/2, 116, 9);

      // spread name with subtle gold-tinted gradient
      const titleGrad = ctx.createLinearGradient(W * 0.2, 0, W * 0.8, 0);
      titleGrad.addColorStop(0, '#ffe5a8');
      titleGrad.addColorStop(0.5, '#ffffff');
      titleGrad.addColorStop(1, '#ffe5a8');
      ctx.fillStyle = titleGrad;
      ctx.font = '800 60px "Space Grotesk", system-ui, sans-serif';
      ctx.fillText(sp.name, W/2, 184);

      if (question) {
        ctx.fillStyle = '#d8c8f0';
        ctx.font = 'italic 24px "Space Grotesk", system-ui, sans-serif';
        const qText = `"${question.length > 76 ? question.slice(0, 76).trim() + '…' : question}"`;
        ctx.fillText(qText, W/2, 226);
      }

      // small divider before cards
      drawDivider(ctx, W/2, question ? 256 : 230, 240);

      // ── Cards section ──
      const cardsTop = 254;
      const cardsBottom = 580;
      // subtle backdrop frame around cards (very light)
      ctx.save();
      const cardBg = ctx.createLinearGradient(0, cardsTop - 8, 0, cardsBottom + 8);
      cardBg.addColorStop(0, 'rgba(232, 200, 122, 0.05)');
      cardBg.addColorStop(0.5, 'rgba(192, 132, 255, 0.06)');
      cardBg.addColorStop(1, 'rgba(232, 200, 122, 0.04)');
      ctx.fillStyle = cardBg;
      roundRectFill(ctx, 56, cardsTop - 10, W - 112, cardsBottom - cardsTop + 20, 20);
      // hairline border
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.18)';
      ctx.lineWidth = 1;
      roundRectStroke(ctx, 56, cardsTop - 10, W - 112, cardsBottom - cardsTop + 20, 20);
      ctx.restore();

      const cardArea = { top: cardsTop, bottom: cardsBottom, left: 60, right: W - 60 };
      await drawCardStrip(ctx, picks, sp, cardArea);

      // divider before reading
      drawDivider(ctx, W/2, 600, 280);

      // ── The Reading — full summary box ──
      const paragraphs = extractShareParagraphs();
      const synthBoxX = 56;
      const synthBoxY = 622;
      const synthBoxW = W - 112;
      const synthBoxH = 318;

      // box background
      ctx.save();
      const sbg = ctx.createLinearGradient(0, synthBoxY, 0, synthBoxY + synthBoxH);
      sbg.addColorStop(0, 'rgba(232, 200, 122, 0.14)');
      sbg.addColorStop(0.55, 'rgba(120, 50, 230, 0.09)');
      sbg.addColorStop(1, 'rgba(232, 200, 122, 0.06)');
      ctx.fillStyle = sbg;
      roundRectFill(ctx, synthBoxX, synthBoxY, synthBoxW, synthBoxH, 20);
      ctx.restore();

      // double gold border
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.55)';
      ctx.lineWidth = 1.4;
      roundRectStroke(ctx, synthBoxX, synthBoxY, synthBoxW, synthBoxH, 20);
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.22)';
      ctx.lineWidth = 1;
      roundRectStroke(ctx, synthBoxX + 6, synthBoxY + 6, synthBoxW - 12, synthBoxH - 12, 16);

      // section title
      ctx.fillStyle = '#ffe5a8';
      ctx.textAlign = 'center';
      ctx.font = '800 18px "Space Grotesk", system-ui, sans-serif';
      drawSpacedText(ctx, '✦   THE READING   ✦', W/2, synthBoxY + 40, 5);

      // tiny gold underline beneath title
      const ulY = synthBoxY + 56;
      const ulW = 90;
      const ulG = ctx.createLinearGradient(W/2 - ulW, ulY, W/2 + ulW, ulY);
      ulG.addColorStop(0, 'rgba(232, 200, 122, 0)');
      ulG.addColorStop(0.5, 'rgba(232, 200, 122, 0.7)');
      ulG.addColorStop(1, 'rgba(232, 200, 122, 0)');
      ctx.strokeStyle = ulG;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W/2 - ulW, ulY);
      ctx.lineTo(W/2 + ulW, ulY);
      ctx.stroke();

      // reading body — multiple paragraphs
      if (paragraphs.length) {
        ctx.fillStyle = '#f6ecd2';
        ctx.textAlign = 'left';
        ctx.font = '400 22px "Space Grotesk", system-ui, sans-serif';
        const padding = 36;
        const lineH = 30;
        const paraGap = 12;
        const bodyTop = synthBoxY + 86;
        const bodyHeight = synthBoxH - 86 - 24; // leaves bottom padding
        const maxLines = Math.floor(bodyHeight / lineH);
        drawParagraphs(
          ctx,
          paragraphs,
          synthBoxX + padding,
          bodyTop,
          synthBoxW - padding * 2,
          lineH,
          paraGap,
          maxLines
        );
      }

      // ── Keyword pills ──
      const keywords = extractShareKeywords(picks, sp);
      if (keywords.length) {
        drawKeywordPills(ctx, keywords, W/2, 970);
      }

      // ── Footer (placed nicely, well clear of pills and inside frame) ──
      const footerY = 1018;
      // small centered ornament above brand line
      drawDivider(ctx, W/2, footerY - 20, 200);

      ctx.fillStyle = '#ffe5a8';
      ctx.textAlign = 'center';
      ctx.font = '800 19px "Space Grotesk", system-ui, sans-serif';
      drawSpacedText(ctx, 'EMONAD.LOL', W/2, footerY, 5);

      // delicate flanking gold dots beside the brand
      ctx.fillStyle = '#e8c87a';
      const brandTextW = ctx.measureText('EMONAD.LOL').width + 5 * 9; // approx letter-spaced width
      ctx.beginPath(); ctx.arc(W/2 - brandTextW/2 - 18, footerY + 6, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(W/2 + brandTextW/2 + 18, footerY + 6, 3, 0, Math.PI*2); ctx.fill();

      // tiny tagline beneath
      ctx.fillStyle = '#a89ec8';
      ctx.font = '500 11px "Space Grotesk", system-ui, sans-serif';
      drawSpacedText(ctx, 'A TAROT READING', W/2, footerY + 22, 4);

      return canvas;
    }

    // Pull the full reading paragraphs (skipping the Signature metadata line)
    // for the share summary. Returns an array of paragraph strings so they
    // can be rendered with proper spacing between them.
    function extractShareParagraphs() {
      const synthEl = document.querySelector('.synthesis');
      if (!synthEl) return [];
      const paras = [...synthEl.querySelectorAll('p')];
      return paras
        .map(p => p.textContent.trim())
        .filter(t => t && !/^Signature\./i.test(t));
    }

    // Three keyword pills capturing the essence of the spread, varying by count.
    function extractShareKeywords(picks, sp) {
      const cap = (s) => s.toUpperCase();
      if (sp.count === 1)  return picks[0].card.keys.slice(0, 3).map(cap);
      if (sp.count === 3)  return picks.map(p => cap(p.card.keys[0]));
      if (sp.count === 7)  return [picks[1], picks[5], picks[6]].map(p => cap(p.card.keys[0])); // present, advice, outcome
      return [picks[0], picks[6], picks[9]].map(p => cap(p.card.keys[0]));                      // celtic: heart, self, outcome
    }

    function drawKeywordPills(ctx, keywords, cx, cy) {
      ctx.save();
      const pillH = 38;
      const padX = 22;
      const gap = 14;
      ctx.font = '800 14px "Space Grotesk", system-ui, sans-serif';
      const widths = keywords.map(k => ctx.measureText(k).width + padX * 2);
      const totalW = widths.reduce((a, b) => a + b, 0) + (keywords.length - 1) * gap;
      let cursor = cx - totalW / 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < keywords.length; i++) {
        const w = widths[i];
        const x = cursor;
        const y = cy - pillH / 2;
        // soft glow halo
        ctx.shadowColor = 'rgba(232, 200, 122, 0.45)';
        ctx.shadowBlur = 16;
        // pill bg
        const g = ctx.createLinearGradient(x, y, x, y + pillH);
        g.addColorStop(0, 'rgba(232, 200, 122, 0.22)');
        g.addColorStop(1, 'rgba(192, 132, 255, 0.10)');
        ctx.fillStyle = g;
        roundRectFill(ctx, x, y, w, pillH, pillH / 2);
        ctx.shadowBlur = 0;
        // border
        ctx.strokeStyle = 'rgba(232, 200, 122, 0.65)';
        ctx.lineWidth = 1.2;
        roundRectStroke(ctx, x, y, w, pillH, pillH / 2);
        // text
        ctx.fillStyle = '#ffe5a8';
        ctx.fillText(keywords[i], x + w / 2, cy + 1);
        cursor += w + gap;
      }
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }

    // Decorative divider: a horizontal gold line with a tilted diamond at center
    function drawDivider(ctx, cx, cy, totalW) {
      ctx.save();
      const half = totalW / 2;
      // line gradient (fades at edges and at center to leave room for the diamond)
      const g = ctx.createLinearGradient(cx - half, cy, cx + half, cy);
      g.addColorStop(0,    'rgba(232, 200, 122, 0)');
      g.addColorStop(0.18, 'rgba(232, 200, 122, 0.5)');
      g.addColorStop(0.42, 'rgba(232, 200, 122, 0.5)');
      g.addColorStop(0.5,  'rgba(232, 200, 122, 0)');
      g.addColorStop(0.58, 'rgba(232, 200, 122, 0.5)');
      g.addColorStop(0.82, 'rgba(232, 200, 122, 0.5)');
      g.addColorStop(1,    'rgba(232, 200, 122, 0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - half, cy);
      ctx.lineTo(cx + half, cy);
      ctx.stroke();
      // diamond
      ctx.fillStyle = 'rgba(232, 200, 122, 0.85)';
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-3.5, -3.5, 7, 7);
      ctx.restore();
    }

    // Ornate corner brackets on the outer frame
    function drawCornerFlourishes(ctx, x, y, w, h) {
      ctx.save();
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.7)';
      ctx.lineWidth = 1.4;
      const len = 38, off = 2;
      // each corner: two short orthogonal strokes + tiny diagonal
      const corners = [
        { x: x + off,     y: y + off,     dx:  1, dy:  1 },
        { x: x + w - off, y: y + off,     dx: -1, dy:  1 },
        { x: x + off,     y: y + h - off, dx:  1, dy: -1 },
        { x: x + w - off, y: y + h - off, dx: -1, dy: -1 },
      ];
      for (const c of corners) {
        ctx.beginPath();
        ctx.moveTo(c.x, c.y + c.dy * len);
        ctx.lineTo(c.x, c.y);
        ctx.lineTo(c.x + c.dx * len, c.y);
        ctx.stroke();
        // corner dot
        ctx.fillStyle = 'rgba(232, 200, 122, 0.8)';
        ctx.beginPath(); ctx.arc(c.x, c.y, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function roundRectStroke(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.stroke();
    }
    function roundRectFill(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }
    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawSpacedText(ctx, text, x, y, spacing) {
      // poor-man letter spacing — measure each char and draw individually.
      ctx.save();
      const total = ctx.measureText(text).width + spacing * (text.length - 1);
      let cursor = x - total / 2;
      ctx.textAlign = 'left';
      for (const ch of text) {
        const w = ctx.measureText(ch).width;
        ctx.fillText(ch, cursor, y);
        cursor += w + spacing;
      }
      ctx.restore();
    }

    // Returns the number of lines actually drawn so callers can position the
    // next paragraph below. Honors maxLines and adds an ellipsis if truncated.
    function wrapAndDrawText(ctx, text, x, y, maxW, lineH, maxLines = 6) {
      const words = text.split(/\s+/);
      let line = '', lineCount = 0, cursorY = y;
      for (let i = 0; i < words.length; i++) {
        const test = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(test).width > maxW && line) {
          ctx.fillText(line, x, cursorY);
          line = words[i];
          cursorY += lineH;
          lineCount++;
          if (lineCount >= maxLines - 1) {
            while (ctx.measureText(line + ' ' + words[i+1] + '…').width <= maxW && i + 1 < words.length) {
              i++;
              line += ' ' + words[i];
            }
            ctx.fillText(line + (i < words.length - 1 ? '…' : ''), x, cursorY);
            return lineCount + 1;
          }
        } else {
          line = test;
        }
      }
      if (line) {
        ctx.fillText(line, x, cursorY);
        return lineCount + 1;
      }
      return lineCount;
    }

    // Draw a sequence of paragraphs with breathing room between them, sharing
    // a fixed line budget. Distributes lines across paragraphs but lets each
    // paragraph break naturally.
    function drawParagraphs(ctx, paragraphs, x, y, maxW, lineH, paraGap, maxLines) {
      let cursorY = y;
      let linesLeft = maxLines;
      for (let i = 0; i < paragraphs.length && linesLeft > 0; i++) {
        const drawn = wrapAndDrawText(ctx, paragraphs[i], x, cursorY, maxW, lineH, linesLeft);
        cursorY += drawn * lineH;
        linesLeft -= drawn;
        if (i < paragraphs.length - 1 && linesLeft > 0) {
          cursorY += paraGap;
        }
      }
    }

    async function drawCardStrip(ctx, picks, sp, area) {
      const n = picks.length;
      // Per-spread layout: 1 hero, 3 row, 7 single row (horseshoe), 10 as 5+5 grid
      const cols = n <= 5 ? n : (n === 7 ? 7 : 5);
      const rows = Math.ceil(n / cols);
      const minGapX = 20, gapY = 30;
      const labelH = 56;
      const availW = area.right - area.left;
      const availH = area.bottom - area.top;

      // Card size: fit both per-row height (incl. label) and per-column width.
      const heightBudget = (availH - (rows - 1) * gapY) / rows - labelH;
      const widthBudget  = (availW - (cols - 1) * minGapX) / cols;
      let cardW = Math.min(widthBudget, heightBudget * 5 / 8);
      let cardH = cardW * 8 / 5;

      // Hero treatment for 1-card spread
      if (n === 1) {
        const heroH = Math.min(availH - labelH, 540);
        cardH = heroH;
        cardW = cardH * 5 / 8;
        if (cardW > availW) { cardW = availW; cardH = cardW * 8 / 5; }
      }

      const totalH = rows * (cardH + labelH) + (rows - 1) * gapY;
      const startY = area.top + (availH - totalH) / 2;

      for (let i = 0; i < n; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const itemsThisRow = (r === rows - 1) ? (n - r * cols) : cols;

        // EVEN-SPREAD LAYOUT: prefer space-around (equal padding on both sides
        // and equal gaps between cards). If that gap exceeds 70% of cardW
        // (cards floating in too much empty space) cap it. If it's tighter
        // than minGapX, switch to space-between (cards span full row width).
        let rowGapX, rowStartX;
        const spaceAroundGap = (availW - itemsThisRow * cardW) / (itemsThisRow + 1);
        if (spaceAroundGap >= minGapX) {
          rowGapX = Math.min(spaceAroundGap, cardW * 0.7);
          const rowW = itemsThisRow * cardW + (itemsThisRow - 1) * rowGapX;
          rowStartX = area.left + (availW - rowW) / 2;
        } else {
          // Tight row: span full width, equal gaps, no side padding.
          rowGapX = itemsThisRow > 1
            ? (availW - itemsThisRow * cardW) / (itemsThisRow - 1)
            : 0;
          rowStartX = area.left;
        }

        const x = rowStartX + c * (cardW + rowGapX);
        const y = startY + r * (cardH + labelH + gapY);
        // Label width budget: extend halfway into the gap on each side so
        // long card names have room without colliding with neighbors.
        const labelMaxW = cardW + Math.min(rowGapX * 0.85, cardW * 0.4);
        await drawShareCard(ctx, x, y, cardW, cardH, picks[i], sp.positions[i], labelMaxW);
      }
    }

    // Pick the largest font in `weight Npx family` form that fits `text`
    // within `maxW`. Returns the font string.
    function fitFont(ctx, text, weight, family, maxFont, minFont, maxW) {
      for (let f = maxFont; f >= minFont; f--) {
        ctx.font = `${weight} ${f}px ${family}`;
        if (ctx.measureText(text).width <= maxW) return ctx.font;
      }
      ctx.font = `${weight} ${minFont}px ${family}`;
      return ctx.font;
    }

    async function drawShareCard(ctx, x, y, w, h, entry, position, labelMaxW) {
      const stageCard = [...state.cardEls].find(c => c.dataset.slug === entry.card.slug);
      const img = stageCard ? stageCard.querySelector('.art-layer img') : null;
      const imgLoaded = img && img.complete && img.naturalWidth > 0 && !img.classList.contains('broken');

      if (imgLoaded) {
        // Compute the actual displayed image size (contain mode)
        const ar = img.naturalWidth / img.naturalHeight;
        const cardAr = w / h;
        let dw, dh;
        if (ar > cardAr) { dw = w; dh = w / ar; }
        else { dh = h; dw = h * ar; }
        const ix = x + (w - dw) / 2;  // top-left of displayed image
        const iy = y + (h - dh) / 2;
        const r  = Math.min(14, dw * 0.04, dh * 0.04);

        // shadow that hugs the IMAGE bounds (not the chassis)
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 32;
        ctx.shadowOffsetY = 16;
        ctx.fillStyle = '#0a0418';
        roundRectFill(ctx, ix, iy, dw, dh, r);
        ctx.restore();

        // draw the image clipped to rounded rect at its native bounds
        ctx.save();
        if (entry.reversed) {
          ctx.translate(x + w/2, y + h/2);
          ctx.rotate(Math.PI);
          ctx.translate(-(x + w/2), -(y + h/2));
        }
        roundRectPath(ctx, ix, iy, dw, dh, r);
        ctx.clip();
        ctx.drawImage(img, ix, iy, dw, dh);
        ctx.restore();

        // Reversed badge sits over the image's top-right corner
        if (entry.reversed) {
          ctx.fillStyle = 'rgba(20, 10, 40, 0.85)';
          ctx.strokeStyle = 'rgba(232, 200, 122, 0.55)';
          ctx.lineWidth = 0.8;
          roundRectFill(ctx, ix + dw - 44, iy + 8, 36, 16, 4);
          roundRectStroke(ctx, ix + dw - 44, iy + 8, 36, 16, 4);
          ctx.fillStyle = '#f3da9a';
          ctx.font = '800 9px "Space Grotesk", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('REV', ix + dw - 26, iy + 17);
          ctx.textBaseline = 'alphabetic';
        }
      } else {
        // Placeholder fallback — full chassis with parchment, glyph, and name
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 14;
        ctx.fillStyle = '#0d0820';
        roundRectFill(ctx, x, y, w, h, 10);
        ctx.restore();

        ctx.save();
        roundRectPath(ctx, x, y, w, h, 10);
        ctx.clip();
        const fg = ctx.createLinearGradient(x, y, x, y + h);
        fg.addColorStop(0, '#1d1530');
        fg.addColorStop(1, '#0d0820');
        ctx.fillStyle = fg;
        ctx.fillRect(x, y, w, h);

        // placeholder: ornate frame + glyph + name
        // inner gold border
        ctx.strokeStyle = 'rgba(232, 200, 122, 0.4)';
        ctx.lineWidth = 1;
        roundRectStroke(ctx, x + 8, y + 8, w - 16, h - 16, 6);

        // soft glow circle
        const g = ctx.createRadialGradient(x + w/2, y + h * 0.45, 0, x + w/2, y + h * 0.45, w * 0.6);
        g.addColorStop(0, 'rgba(155, 95, 255, 0.32)');
        g.addColorStop(1, 'rgba(155, 95, 255, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        // numeral pill
        ctx.fillStyle = '#e8c87a';
        ctx.font = '800 11px "Space Grotesk", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const num = toRoman(entry.card.n);
        const numW = ctx.measureText(num).width + 18;
        ctx.strokeStyle = 'rgba(232, 200, 122, 0.4)';
        ctx.lineWidth = 1;
        roundRectStroke(ctx, x + w/2 - numW/2, y + 22, numW, 16, 8);
        ctx.fillText(num, x + w/2, y + 31);

        // big glyph
        ctx.fillStyle = '#d6b6ff';
        ctx.font = `400 ${Math.floor(w * 0.32)}px serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(cardGlyph(entry.card.n), x + w/2, y + h/2);

        // card name
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 11px "Space Grotesk", system-ui, sans-serif';
        ctx.textBaseline = 'alphabetic';
        const nameStr = entry.card.name.toUpperCase();
        drawSpacedText(ctx, nameStr, x + w/2, y + h - 22, 2);

        ctx.restore();

        // outer gold border on chassis (over clip)
        ctx.strokeStyle = 'rgba(232, 200, 122, 0.55)';
        ctx.lineWidth = 1.2;
        roundRectStroke(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 10);

        // Reversed badge on chassis corner
        if (entry.reversed) {
          ctx.fillStyle = 'rgba(20, 10, 40, 0.85)';
          ctx.strokeStyle = 'rgba(232, 200, 122, 0.4)';
          ctx.lineWidth = 0.8;
          roundRectFill(ctx, x + w - 44, y + 8, 36, 16, 4);
          roundRectStroke(ctx, x + w - 44, y + 8, 36, 16, 4);
          ctx.fillStyle = '#f3da9a';
          ctx.font = '800 9px "Space Grotesk", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('REV', x + w - 26, y + 17);
          ctx.textBaseline = 'alphabetic';
        }
      }

      // ── Labels below card ──
      const labelW = labelMaxW || (w + 18);
      const cx = x + w / 2;

      // 1) Position label: small gold caps, letter-spaced
      // Strip the leading "N. " ordering from labels like "1. Heart" — it's
      // implicit in the visual order of the cards on the share card.
      const posStr = (position.label || '').replace(/^\d+\.\s*/, '').toUpperCase();
      // pick the largest font that fits with the spacing we want
      let posFont = 13;
      let posSpacing = 2.6;
      ctx.font = `800 ${posFont}px "Space Grotesk", system-ui, sans-serif`;
      // poor-man's letter-spaced width measurement
      while (
        posFont > 9 &&
        ctx.measureText(posStr).width + posSpacing * (posStr.length - 1) > labelW
      ) {
        posFont--;
        ctx.font = `800 ${posFont}px "Space Grotesk", system-ui, sans-serif`;
      }
      ctx.fillStyle = '#f3d27a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      drawSpacedText(ctx, posStr, cx, y + h + 14, posSpacing);

      // 2) Subtle gold underline beneath the position label
      const ulY = y + h + 14 + posFont + 6;
      const ulW = Math.min(28, labelW * 0.16);
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - ulW, ulY);
      ctx.lineTo(cx + ulW, ulY);
      ctx.stroke();

      // 3) Card name: white, adaptive font so long names ("The High Priestess",
      //    "Wheel of Fortune") still fit cleanly without overflow.
      const nameStr = entry.card.name + (entry.reversed ? ' ↧' : '');
      ctx.fillStyle = '#ffffff';
      fitFont(ctx, nameStr, '800', '"Space Grotesk", system-ui, sans-serif', 19, 13, labelW);
      ctx.fillText(nameStr, cx, ulY + 8);

      ctx.textBaseline = 'alphabetic';
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const sp = SPREADS[state.spread];
      const picks = state.cardEls.filter(c => c.classList.contains('picked'))
        .sort((a,b) => (+a.dataset.slot)-(+b.dataset.slot))
        .map(c => state.deck[parseInt(c.dataset.fanIndex, 10)]);
      const lines = [`Emo Tarot — ${sp.name}`, ''];
      picks.forEach((p, i) => {
        lines.push(`${sp.positions[i].label}: ${p.card.name}${p.reversed ? ' (Reversed)' : ''}`);
        lines.push(`  ${p.reversed ? p.card.reversed : p.card.upright}`);
      });
      lines.push('', 'emonad.lol/tarot');
      try { await navigator.clipboard.writeText(lines.join('\n')); toast('Reading copied'); }
      catch { toast('Could not copy'); }
    });

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('visible'), 1800);
    }

    // ─────────────────────────────────────────────────────────
    //  Resize
    // ─────────────────────────────────────────────────────────
    let rt;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (state.phase === 'revealed') relayoutCards();
      }, 120);
    });

  })();
  </script>

  <script type="module">
    import EmoProfile from '../emo-profile.js';
    EmoProfile.init({ page: 'tarot' })
      .then(() => EmoProfile.mount('#emoAuthSlot'))
      .catch(err => console.warn('EmoProfile init failed:', err));
  </script>
