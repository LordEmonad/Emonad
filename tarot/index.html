  <style>
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url(../fonts/SpaceGrotesk-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --bg-0: #f8f3ea;
      --bg-1: #fff8e8;
      --text:  #1c1530;
      --text-2: #4a3f5d;
      --text-3: #8a7fa3;
      --accent: #6b2dd4;
      --accent-2: #b07cff;
      --accent-3: rgba(123, 63, 228, 0.16);
      --gold:   #b88a2e;
      --gold-2: #d8a64a;
      --gold-3: #ff9a3c;
      --line:   rgba(48,30,80,0.10);
      --line-2: rgba(48,30,80,0.18);
      --surface: rgba(255,251,240,0.85);
      --shadow-card: 0 28px 56px rgba(80, 30, 180, 0.18), 0 8px 18px rgba(0,0,0,0.10);
      --vignette:
        radial-gradient(ellipse at 50% 0%, rgba(176, 124, 255, 0.18), transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(232, 168, 74, 0.14), transparent 60%);
      --tb: rgba(255,250,236,0.82);
    }
    [data-theme="dark"] {
      /* Deep midnight indigo with candlelight gold and electric purple */
      --bg-0: #060218;
      --bg-1: #120732;
      --bg-2: #1d0f4a;
      --text: #f4ecd7;       /* warm parchment cream */
      --text-2: #b9a8d8;     /* soft lavender */
      --text-3: #6e5e8c;     /* muted dusk */
      --accent: #c084ff;     /* electric purple */
      --accent-2: #e8d4ff;
      --accent-3: rgba(192, 132, 255, 0.22);
      --gold:   #e8c87a;     /* candlelight */
      --gold-2: #ffdf9a;     /* warm flame */
      --gold-3: #ff9a3c;     /* amber ember */
      --line:   rgba(232, 200, 122, 0.10);
      --line-2: rgba(232, 200, 122, 0.22);
      --surface: rgba(28, 14, 56, 0.62);
      --shadow-card:
        0 36px 72px rgba(0,0,0,0.7),
        0 0 0 1px rgba(232,200,122,0.22),
        0 0 80px rgba(192, 132, 255, 0.22);
      --vignette:
        radial-gradient(ellipse at 50% -10%, rgba(192, 132, 255, 0.34), transparent 52%),
        radial-gradient(ellipse at 95% 90%, rgba(255, 154, 60, 0.18), transparent 55%),
        radial-gradient(ellipse at 5% 60%, rgba(120, 50, 230, 0.18), transparent 55%),
        radial-gradient(ellipse at 50% 105%, rgba(232, 200, 122, 0.12), transparent 60%);
      --tb: rgba(12, 6, 30, 0.82);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--vignette), var(--bg-0);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
      letter-spacing: 0.01em;
      position: relative;
    }
    body::before {
      /* Sealed vignette frame — draws the eye to center */
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.55) 100%);
      opacity: 0.6;
    }
    [data-theme="light"] body::before { opacity: 0.18; }

    /* Drifting fog/aurora layers — creates an atmosphere of mist and candlelight */
    .fog {
      position: fixed;
      inset: -10%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      mix-blend-mode: screen;
      will-change: transform;
    }
    .fog-1 {
      background:
        radial-gradient(ellipse 60% 40% at 30% 35%, rgba(192, 132, 255, 0.18), transparent 55%),
        radial-gradient(ellipse 50% 35% at 70% 65%, rgba(255, 154, 60, 0.12), transparent 55%);
      animation: fogDrift1 38s ease-in-out infinite;
    }
    .fog-2 {
      background:
        radial-gradient(ellipse 55% 35% at 65% 30%, rgba(232, 200, 122, 0.14), transparent 55%),
        radial-gradient(ellipse 50% 35% at 25% 75%, rgba(160, 80, 255, 0.16), transparent 55%);
      animation: fogDrift2 52s ease-in-out infinite;
    }
    @keyframes fogDrift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(-2%, 1.5%) scale(1.06); }
      66%      { transform: translate(1.5%, -2%) scale(1.03); }
    }
    @keyframes fogDrift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      40%      { transform: translate(2%, 2%) scale(1.05); }
      80%      { transform: translate(-1.5%, -1.5%) scale(1.04); }
    }
    [data-theme="light"] .fog { opacity: 0.45; mix-blend-mode: multiply; }

    /* Candlelight flicker for accent elements */
    @keyframes candleFlicker {
      0%, 100% { opacity: 1; filter: brightness(1); }
      18% { opacity: 0.92; filter: brightness(0.94); }
      32% { opacity: 1; filter: brightness(1.05); }
      55% { opacity: 0.96; filter: brightness(0.99); }
      78% { opacity: 1; filter: brightness(1.03); }
    }

    html.theme-transition,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease !important;
    }

    /* ── Starfield ── */
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    [data-theme="dark"] #stars { opacity: 0.85; }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--tb);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 14px;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.4px;
    }
    .brand-mark {
      width: 26px; height: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, var(--gold-2), var(--gold) 50%, #5a3a08 90%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 0 18px rgba(232,200,122,0.55);
      display: grid; place-items: center;
      color: #221502;
      font-size: 12px;
      animation: candleFlicker 5s ease-in-out infinite;
    }
    .brand-mark::before { content: "✦"; }
    .brand-name {
      background: linear-gradient(110deg, var(--text), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .topbar-spacer { flex: 1; }
    .topbar-link {
      color: var(--text-2);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }
    .topbar-link:hover {
      color: var(--accent);
      background: var(--accent-3);
    }
    .theme-toggle {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line-2);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
      position: relative;
      flex-shrink: 0;
      color: var(--text);
    }
    .theme-toggle:hover { border-color: var(--accent); background: var(--accent-3); }
    .theme-toggle .icon-sun, .theme-toggle .icon-moon {
      position: absolute;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg); }
    .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg); }
    [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg); }
    [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg); }

    /* ── Scene (single-viewport) ── */
    .scene {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      z-index: 1;
    }

    .phase {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .phase.active {
      pointer-events: auto;
      opacity: 1;
    }

    /* ── PHASE 1: Intro ── */
    .phase-intro {
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      transform: translateY(0);
    }
    .scene[data-phase="shuffling"] .phase-intro,
    .scene[data-phase="picking"] .phase-intro,
    .scene[data-phase="revealed"] .phase-intro {
      transform: translateY(-30px);
    }

    .intro-title {
      font-size: clamp(2.2rem, 5.2vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -1.4px;
      line-height: 1;
      text-align: center;
      background: linear-gradient(110deg, var(--gold-2) 0%, var(--gold) 18%, var(--accent-2) 38%, var(--accent) 58%, var(--gold) 82%, var(--gold-2) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShimmer 9s ease-in-out infinite;
      filter: drop-shadow(0 0 22px rgba(232, 200, 122, 0.18));
    }
    @keyframes titleShimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .intro-eyebrow {
      font-size: 11px;
      letter-spacing: 4.5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      animation: candleFlicker 6s ease-in-out infinite;
    }
    .intro-eyebrow::before, .intro-eyebrow::after {
      content: "";
      width: 36px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .intro-deck {
      width: 156px;
      height: 250px;
      position: relative;
      perspective: 1200px;
    }
    .intro-deck .stack-card {
      position: absolute;
      inset: 0;
      transform: rotate(var(--r,0deg)) translate(var(--tx,0), var(--ty,0));
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      /* drop-shadow follows the actual rounded image silhouette, not the
         invisible chassis rectangle */
      filter:
        drop-shadow(0 22px 38px rgba(0, 0, 0, 0.55))
        drop-shadow(0 0 26px rgba(232, 200, 122, 0.22));
    }
    [data-theme="light"] .intro-deck .stack-card {
      filter:
        drop-shadow(0 22px 38px rgba(80, 30, 180, 0.18))
        drop-shadow(0 6px 12px rgba(0, 0, 0, 0.12));
    }
    .intro-deck:hover .stack-card:nth-child(1) { --r: -7deg; --tx: -10px; }
    .intro-deck:hover .stack-card:nth-child(3) { --r: 7deg; --tx: 10px; }
    .intro-deck::after {
      content: "";
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 18px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent 70%);
      filter: blur(8px);
      z-index: -1;
    }

    .intro-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 540px;
      align-items: center;
    }

    .question-input {
      width: 100%;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s ease;
      outline: none;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .question-input::placeholder { color: var(--text-3); font-style: italic; }
    .question-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-3);
    }

    .spread-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .spread-tab {
      background: transparent;
      border: none;
      color: var(--text-2);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .spread-tab:hover { color: var(--text); }
    .spread-tab[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--accent), #6930c3);
      color: #fff;
      box-shadow: 0 4px 14px rgba(123, 63, 228, 0.4);
    }
    .spread-tab .tab-count {
      opacity: 0.7;
      font-weight: 600;
      margin-left: 4px;
      font-size: 10px;
    }

    .begin-btn {
      margin-top: 6px;
      background:
        linear-gradient(135deg, #2e1660 0%, #6b2dd4 50%, #4d1f99 100%);
      color: var(--gold-2);
      border: 1px solid rgba(232, 200, 122, 0.45);
      padding: 16px 40px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow:
        0 14px 36px rgba(123, 63, 228, 0.45),
        0 0 28px rgba(232, 200, 122, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(0,0,0,0.45);
    }
    .begin-btn::before {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 999px;
      border: 1px solid rgba(232, 200, 122, 0.18);
      pointer-events: none;
    }
    .begin-btn::after {
      content: "";
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 230, 180, 0.5), transparent);
      transition: left 0.9s ease;
    }
    .begin-btn:hover {
      transform: translateY(-2px);
      color: #fff5d8;
      box-shadow:
        0 22px 48px rgba(123, 63, 228, 0.6),
        0 0 50px rgba(232, 200, 122, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25);
    }
    .begin-btn:hover::after { left: 130%; }
    .begin-btn:active { transform: translateY(0); }

    .intro-hint {
      font-size: 11px;
      color: var(--text-3);
      max-width: 420px;
      text-align: center;
      letter-spacing: 0.2px;
    }
    .intro-hint em { color: var(--text-2); font-style: normal; }

    /* ── PHASE 2-4: Stage with cards ── */
    .phase-stage {
      width: 100%;
      height: 100%;
    }

    .stage-table {
      position: absolute;
      inset: 0;
      transition: right 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  bottom 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* When reading panel opens, cards take only the left portion (desktop) */
    .scene[data-panel="open"] .stage-table {
      right: 420px;
    }
    @media (max-width: 900px) {
      .scene[data-panel="open"] .stage-table {
        right: 0;
        bottom: 55%;
      }
    }

    /* HUD top */
    .hud {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .hud.visible { opacity: 1; pointer-events: auto; }

    .hud-dots {
      display: flex;
      gap: 9px;
      padding: 11px 18px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    }
    .hud-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--line-2);
      transition: background 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
    }
    .hud-dot.filled {
      background: radial-gradient(circle at 35% 30%, var(--gold-2), var(--gold) 70%);
      box-shadow: 0 0 12px var(--gold), 0 0 0 1px rgba(232,200,122,0.5);
      transform: scale(1.18);
    }

    .hud-back {
      position: absolute;
      top: 18px;
      left: 18px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-2);
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.2s ease;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      font-family: inherit;
      font-weight: 700;
    }
    .hud-back.visible { opacity: 1; pointer-events: auto; }
    .hud-back:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Card (universal) ── */
    .card {
      position: absolute;
      width: var(--cw, 130px);
      height: var(--ch, 208px);
      transform-style: preserve-3d;
      transition:
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        left 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.4s ease;
      cursor: pointer;
      will-change: transform, left, top;
      filter: drop-shadow(0 16px 28px rgba(0,0,0,0.3));
    }
    .card.no-anim { transition: none; }
    .card.dim { opacity: 0.18; pointer-events: none; filter: grayscale(0.5) blur(1px); }

    .card-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
    }
    .card-face.front {
      transform: rotateY(180deg);
      /* Default (placeholder) styling: parchment frame, used only when no
         image art is loaded for this card. */
      background: linear-gradient(160deg, #fbf3df 0%, #efe1bd 100%);
      border: 1px solid rgba(201, 161, 74, 0.55);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }
    [data-theme="dark"] .card-face.front {
      background: linear-gradient(160deg, #fbf3df 0%, #e8d5a8 100%);
      border-color: rgba(232, 200, 122, 0.55);
    }
    /* When real art is loaded, kill the chassis border/bg — the user's art
       already has its own ornate frame baked in, and double-bordering looks
       cheap. The drop-shadow on .card still hugs the image silhouette. */
    .card-face.front.has-image {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .card-face.back.has-image {
      background: transparent;
      border: none;
    }
    .card-face.back.has-image .card-back-ornament {
      display: none;
    }

    /* Reversed cards flip ONLY the actual artwork — placeholder text stays readable.
       The override for has-image lives further down (it must compose with translate). */

    .card-face.back {
      background: var(--bg-1);
      border: 1px solid var(--line-2);
      display: grid;
      place-items: center;
    }

    /* Card-back ornate design (SVG-based) */
    .card-back-ornament {
      width: 100%;
      height: 100%;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, #2a1a55 0%, #14092e 50%, #07020f 100%);
    }
    .card-back-ornament::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(232, 200, 122, 0.55);
      border-radius: 6px;
      pointer-events: none;
    }
    .card-back-ornament::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(232, 200, 122, 0.25);
      border-radius: 4px;
      pointer-events: none;
    }
    .card-back-ornament svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .card-back-img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
    }

    /* Card front art / placeholder */
    .art-layer {
      position: absolute;
      inset: 0;
      transition: transform 0.3s ease;
    }
    /* Image auto-sizes to its native aspect, centered, with its OWN rounded
       corners. The .card has a drop-shadow filter that hugs this silhouette
       since the surrounding chassis is transparent when has-image. */
    .art-layer img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      transition: opacity 0.3s ease;
    }
    .art-layer img.broken { opacity: 0; }
    .card.reversed .card-face.front.has-image .art-layer img {
      transform: translate(-50%, -50%) scaleY(-1);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px 10px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(232,200,122,0.12) 0%, transparent 55%),
        radial-gradient(circle at 50% 80%, rgba(155,95,255,0.18) 0%, transparent 60%);
    }
    [data-theme="light"] .placeholder {
      background:
        radial-gradient(circle at 50% 25%, rgba(201,161,74,0.18) 0%, transparent 55%),
        radial-gradient(circle at 50% 80%, rgba(123,63,228,0.10) 0%, transparent 60%);
    }
    .placeholder::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(232, 200, 122, 0.32);
      border-radius: 6px;
      pointer-events: none;
    }
    [data-theme="light"] .placeholder::before { border-color: rgba(201, 161, 74, 0.45); }
    .placeholder .ph-num {
      font-size: 9px;
      letter-spacing: 3px;
      font-weight: 800;
      color: var(--gold);
      padding: 2px 8px;
      border: 1px solid rgba(232, 200, 122, 0.35);
      border-radius: 999px;
      line-height: 1;
      z-index: 1;
    }
    [data-theme="light"] .placeholder .ph-num { border-color: rgba(201, 161, 74, 0.5); }
    .placeholder .ph-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 1;
    }
    .placeholder .ph-glyph {
      font-size: clamp(34px, 22%, 88px);
      color: var(--accent-2);
      filter: drop-shadow(0 0 16px var(--accent-3));
      animation: floaty 4s ease-in-out infinite;
      line-height: 1;
    }
    [data-theme="light"] .placeholder .ph-glyph { color: var(--accent); }
    .placeholder .ph-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--text);
      max-width: 95%;
      line-height: 1.15;
      z-index: 1;
    }
    .placeholder .ph-hint {
      font-size: 7px;
      letter-spacing: 1.5px;
      color: var(--text-3);
      text-transform: uppercase;
      margin-top: 3px;
      z-index: 1;
    }
    @keyframes floaty {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Card name strip is shown ONLY for the placeholder fallback (no real art).
       When the real image loads, the user's card art already has the name
       baked in, so we hide this strip via .has-image. */
    .card-name-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 8px;
      background: linear-gradient(to top, rgba(0,0,0,0.55), transparent);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      transition: opacity 0.2s ease;
    }
    .card-face.front.has-image .card-name-strip { opacity: 0; }

    .reversed-tag {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(20,10,40,0.7);
      color: var(--gold-2);
      font-size: 8px;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
      z-index: 2;
      font-weight: 700;
    }

    /* Snappy hover transition that overrides the default slow flip transition
       on .card-inner — only while .hover-lift is on. Once a card is picked,
       .hover-lift is removed and .card-inner reverts to the flip easing. */
    .card.hover-lift .card-inner {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card.hover-lift {
      transition:
        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        left 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.4s ease,
        filter 0.32s ease;
    }
    .card.hover-lift:hover {
      /* Crucial: must beat the fan's z-index (100..121) so the hovered card
         sits on TOP of its neighbors; otherwise neighbors swallow the click. */
      z-index: 300 !important;
      filter:
        drop-shadow(0 0 36px rgba(232, 200, 122, 0.6))
        drop-shadow(0 28px 44px rgba(192, 132, 255, 0.55)) !important;
    }
    .card.hover-lift:hover .card-inner {
      transform: var(--hover-pop, translateY(-26px) scale(1.08));
    }

    /* Position label (faded slot text under each spread position when revealed) */
    .pos-label {
      position: absolute;
      pointer-events: none;
      transform: translate(-50%, 0);
      text-align: center;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-3);
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 1;
    }
    .pos-label.visible { opacity: 0.8; }

    /* ── Reading panel (drawer) ── */
    .reading-panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 420px;
      background:
        linear-gradient(180deg, rgba(28, 14, 56, 0.82) 0%, rgba(18, 8, 36, 0.86) 60%, rgba(10, 4, 24, 0.92) 100%);
      border-left: 1px solid var(--line-2);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      transform: translateX(100%);
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      z-index: 6;
      box-shadow:
        -20px 0 60px rgba(0,0,0,0.45),
        inset 1px 0 0 rgba(232, 200, 122, 0.18);
    }
    [data-theme="light"] .reading-panel {
      background: linear-gradient(180deg, rgba(255, 250, 236, 0.92) 0%, rgba(248, 240, 220, 0.95) 100%);
      box-shadow: -20px 0 60px rgba(80, 30, 180, 0.12), inset 1px 0 0 rgba(184, 138, 46, 0.25);
    }
    /* Decorative gold band at the top of the reading panel */
    .reading-panel::before {
      content: "";
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }
    .reading-panel.open { transform: translateX(0); }

    @media (max-width: 900px) {
      .reading-panel {
        top: auto;
        bottom: 0; left: 0; right: 0;
        width: 100%;
        height: 55%;
        border-left: none;
        border-top: 1px solid var(--line-2);
        transform: translateY(100%);
        box-shadow: 0 -20px 50px rgba(0,0,0,0.3);
      }
      .reading-panel.open { transform: translateY(0); }
    }

    .reading-head {
      flex-shrink: 0;
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .reading-head .eyebrow {
      font-size: 11px;
      letter-spacing: 3.2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 6px;
    }
    .reading-head .spread-name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .reading-head .question-echo {
      font-size: 14px;
      color: var(--text-2);
      font-style: italic;
      margin-top: 6px;
      line-height: 1.5;
    }

    .reading-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 26px 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
    .reading-body::-webkit-scrollbar { width: 6px; }
    .reading-body::-webkit-scrollbar-thumb { background: var(--accent-3); border-radius: 3px; }
    .reading-body::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    .read-card {
      padding: 14px 0;
      border-bottom: 1px dashed var(--line);
      animation: cardEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .read-card:last-of-type { border-bottom: none; }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .read-card .pos {
      font-size: 11px;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 4px;
    }
    .read-card .name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.2;
      color: var(--text);
    }
    .read-card .name .orient {
      font-size: 0.6em;
      color: var(--text-2);
      font-weight: 700;
      letter-spacing: 1.4px;
      margin-left: 8px;
      text-transform: uppercase;
    }
    .read-card .frame {
      font-size: 13.5px;
      color: var(--text-2);
      font-style: italic;
      margin-top: 6px;
      line-height: 1.55;
    }
    .read-card .keys {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin: 10px 0 12px;
    }
    .read-card .key {
      font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase;
      padding: 4px 10px;
      background: var(--accent-3);
      color: var(--accent);
      border-radius: 999px;
      font-weight: 700;
    }
    [data-theme="dark"] .read-card .key { color: var(--accent-2); }
    .read-card .meaning {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }

    .synthesis {
      margin-top: 18px;
      padding: 18px 20px;
      background:
        linear-gradient(160deg, rgba(232, 200, 122, 0.10), transparent 70%),
        radial-gradient(ellipse at 30% 0%, rgba(192, 132, 255, 0.18), transparent 60%);
      border: 1px solid rgba(232, 200, 122, 0.32);
      border-radius: 16px;
      animation: cardEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.15s;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 36px rgba(192, 132, 255, 0.12) inset;
    }
    .synthesis::before {
      content: "✦";
      position: absolute;
      top: 10px; right: 16px;
      color: var(--gold);
      font-size: 18px;
      opacity: 0.7;
      animation: candleFlicker 6s ease-in-out infinite;
    }
    .synthesis h3 {
      font-size: 11px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 8px;
    }
    .synthesis p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }
    .synthesis p + p { margin-top: 10px; }

    .reading-actions {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .ra-btn {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line-2);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ra-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-3); }
    .ra-btn.primary {
      background: linear-gradient(135deg, var(--accent), #6930c3);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(123, 63, 228, 0.35);
    }
    .ra-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(123, 63, 228, 0.5);
    }

    /* ── Card zoom modal ── */
    .card-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 2, 12, 0.86);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .card-modal.open { opacity: 1; pointer-events: auto; }
    .card-modal-content {
      display: flex;
      gap: 28px;
      max-width: min(900px, 95vw);
      max-height: 88vh;
      background:
        linear-gradient(165deg, rgba(28, 14, 56, 0.96), rgba(10, 4, 24, 0.98));
      border: 1px solid rgba(232, 200, 122, 0.35);
      border-radius: 22px;
      padding: 26px 28px;
      position: relative;
      box-shadow:
        0 36px 90px rgba(0, 0, 0, 0.72),
        0 0 80px rgba(192, 132, 255, 0.22),
        inset 0 0 0 1px rgba(232, 200, 122, 0.12);
      transform: scale(0.94);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    [data-theme="light"] .card-modal-content {
      background: linear-gradient(165deg, rgba(255, 250, 236, 0.98), rgba(248, 240, 220, 1));
      box-shadow: 0 30px 80px rgba(80, 30, 180, 0.25), inset 0 0 0 1px rgba(184, 138, 46, 0.25);
    }
    .card-modal.open .card-modal-content { transform: scale(1); }

    .card-modal-image {
      flex: 0 0 auto;
      width: min(340px, 38vw);
      align-self: center;
      position: relative;
    }
    .card-modal-image img {
      width: 100%;
      height: auto;
      max-height: 80vh;
      border-radius: 12px;
      display: block;
      filter: drop-shadow(0 22px 38px rgba(0, 0, 0, 0.6))
              drop-shadow(0 0 32px rgba(232, 200, 122, 0.18));
    }
    .card-modal-image.reversed img { transform: scaleY(-1); }
    .card-modal-image .rev-tag {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(20, 10, 40, 0.85);
      color: var(--gold-2);
      font-size: 9px;
      letter-spacing: 1.4px;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 800;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(232, 200, 122, 0.45);
    }

    .card-modal-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
    .card-modal-info::-webkit-scrollbar { width: 6px; }
    .card-modal-info::-webkit-scrollbar-thumb { background: var(--accent-3); border-radius: 3px; }

    .card-modal-pos {
      font-size: 11px;
      letter-spacing: 3.2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
    }
    .card-modal-name {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--gold-2), var(--accent-2) 50%, var(--text));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-modal-orient {
      font-size: 10px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--text-2);
      font-weight: 700;
      margin-top: 2px;
    }
    .card-modal-frame {
      font-style: italic;
      color: var(--text-2);
      font-size: 13.5px;
      margin-top: 8px;
      line-height: 1.55;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--line);
    }
    .card-modal-keys {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin: 10px 0 4px;
    }
    .card-modal-keys .k {
      font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase;
      padding: 4px 10px;
      background: var(--accent-3);
      color: var(--accent-2);
      border-radius: 999px;
      font-weight: 700;
    }
    [data-theme="light"] .card-modal-keys .k { color: var(--accent); }
    .card-modal-meaning {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--text);
      margin-top: 6px;
    }
    .card-modal-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line-2);
      background: rgba(20, 10, 40, 0.6);
      color: var(--text);
      font-family: inherit;
      font-size: 22px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s ease;
      z-index: 2;
    }
    [data-theme="light"] .card-modal-close { background: rgba(255, 255, 255, 0.7); }
    .card-modal-close:hover {
      color: var(--gold);
      border-color: var(--gold);
      transform: rotate(90deg);
    }

    @media (max-width: 700px) {
      .card-modal-content {
        flex-direction: column;
        align-items: center;
        padding: 22px;
        gap: 16px;
      }
      .card-modal-image { width: min(220px, 60vw); }
      .card-modal-info { width: 100%; padding-right: 0; }
      .card-modal-name { font-size: 1.4rem; text-align: center; }
      .card-modal-pos { text-align: center; }
      .card-modal-orient { text-align: center; }
    }

    /* ── Share modal ── */
    .share-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 2, 12, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .share-modal.open { opacity: 1; pointer-events: auto; }
    .share-card {
      background: var(--bg-1);
      border: 1px solid var(--line-2);
      border-radius: 24px;
      padding: 22px;
      max-width: min(560px, 92vw);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      transform: scale(0.94);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .share-modal.open .share-card { transform: scale(1); }
    .share-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line-2);
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
      font-size: 18px;
      display: grid; place-items: center;
      transition: all 0.2s ease;
    }
    .share-close:hover { color: var(--accent); border-color: var(--accent); }
    .share-head {
      text-align: center;
    }
    .share-head .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .share-head h3 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .share-preview {
      flex: 1;
      min-height: 200px;
      max-height: 56vh;
      border-radius: 14px;
      overflow: hidden;
      background: #0a0518;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid var(--line);
    }
    .share-preview canvas, .share-preview img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }
    .share-preview .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--line-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .share-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .share-actions .ra-btn { flex: 1; min-width: 100px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translate(-50%, 20px);
      background: var(--bg-1);
      color: var(--text);
      border: 1px solid var(--line-2);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 200;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    /* ── Responsive — full mobile pass ── */

    /* Cards have native touch behavior with no double-tap-zoom delay */
    .card { touch-action: manipulation; }

    @media (max-height: 760px) {
      .intro-deck { width: 130px; height: 208px; }
      .intro-title { font-size: 2rem; }
      .phase-intro { gap: 14px; }
    }

    @media (max-width: 900px) {
      /* Reading panel becomes a bottom sheet covering 60% of the screen so
         the cards stay clearly visible above. */
      .reading-panel {
        height: 60%;
      }
      /* On phone-width screens the topbar trims down */
      .topbar { height: 48px; padding: 0 14px; gap: 6px; }
      .scene { top: 48px; }
    }

    @media (max-width: 720px) {
      .topbar-link[data-hide-mobile] { display: none; }
      .stage { padding: 16px 12px; }

      /* Intro */
      .intro-eyebrow { font-size: 10px; letter-spacing: 3.5px; gap: 10px; }
      .intro-eyebrow::before, .intro-eyebrow::after { width: 32px; }
      .intro-title { font-size: 2rem; letter-spacing: -1px; }
      .intro-deck { width: 124px; height: 198px; }
      .spread-tabs {
        flex-wrap: wrap;
        justify-content: center;
        max-width: 100%;
      }
      .spread-tab {
        padding: 9px 13px;       /* min 36px touch height */
        font-size: 12px;
      }
      .spread-tab .tab-count { display: inline; }
      .begin-btn {
        padding: 14px 30px;       /* min 44px touch height */
        font-size: 13px;
        letter-spacing: 2.4px;
        width: auto;
      }

      /* HUD dots — tap targets aren't interactive but the pill itself can be
         wider for legibility */
      .hud { top: 12px; }
      .hud-dots { padding: 9px 14px; }
      .hud-back { top: 12px; left: 12px; padding: 7px 12px; font-size: 10px; }

      /* Reading panel bottom sheet */
      .reading-head { padding: 14px 18px 10px; }
      .reading-body { padding: 12px 18px 16px; }
      .reading-actions { padding: 10px 14px; gap: 6px; }
      .ra-btn { font-size: 11.5px; padding: 11px 10px; }   /* taller touch targets */

      .read-card { padding: 12px 0; }
      .read-card .name { font-size: 1.15rem; }
      .read-card .frame { font-size: 12.5px; }
      .read-card .meaning { font-size: 13.5px; line-height: 1.6; }
      .read-card .key { font-size: 10px; }

      .reading-head .spread-name { font-size: 1.15rem; }

      .synthesis { padding: 14px 16px; }
      .synthesis p { font-size: 13.5px; line-height: 1.6; }

      /* Topbar brand */
      .brand-name { display: inline; font-size: 12px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Card hover lift can't trigger on touch — give a quick :active feedback */
      .card.hover-lift:active {
        filter:
          drop-shadow(0 0 22px rgba(232, 200, 122, 0.55))
          drop-shadow(0 18px 28px rgba(192, 132, 255, 0.5)) !important;
        z-index: 300 !important;
      }
      .card.hover-lift:active .card-inner {
        transform: var(--hover-pop, translateY(-12px) scale(1.04));
      }

      /* Pos labels under revealed cards: tighter on mobile */
      .pos-label { font-size: 8px; letter-spacing: 1.2px; }

      /* Card modal */
      .card-modal { padding: 14px; }
      .card-modal-close { width: 32px; height: 32px; font-size: 20px; top: 10px; right: 10px; }
      .card-modal-content { padding: 18px 16px 16px; gap: 14px; max-height: 92vh; }
      .card-modal-image { width: min(180px, 50vw); }
      .card-modal-name { font-size: 1.3rem; }
      .card-modal-frame { font-size: 12.5px; }
      .card-modal-meaning { font-size: 13.5px; line-height: 1.6; }

      /* Share modal */
      .share-modal { padding: 12px; }
      .share-card { padding: 16px; gap: 10px; max-width: 100vw; max-height: 95vh; }
      .share-actions { flex-direction: column; }
      .share-actions .ra-btn { flex: none; width: 100%; }
    }

    @media (max-width: 420px) {
      .topbar { padding: 0 10px; gap: 6px; }
      .brand-name { display: none; }
      .topbar-link { padding: 5px 10px; font-size: 11px; }
      .theme-toggle { width: 28px; height: 28px; }
      .intro-title { font-size: 1.7rem; }
      .intro-deck { width: 110px; height: 176px; }
      .spread-tab { padding: 8px 10px; font-size: 11px; }
      .spread-tab .tab-count { font-size: 9px; }
      .begin-btn { padding: 13px 24px; font-size: 12px; letter-spacing: 2px; }
    }

    /* Very short mobile screens (landscape phone) */
    @media (max-height: 520px) and (max-width: 900px) {
      .phase-intro { gap: 8px; padding: 8px; }
      .intro-eyebrow { font-size: 9px; letter-spacing: 2.5px; }
      .intro-eyebrow::before, .intro-eyebrow::after { width: 22px; }
      .intro-title { font-size: 1.4rem; margin: 0; }
      .intro-deck { width: 78px; height: 124px; }
      .begin-btn { padding: 10px 22px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .card-inner, #stars, .placeholder .ph-glyph,
      .fog, .intro-title { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  </main>

  <!-- Card zoom modal -->

  <script>
  (() => {
    'use strict';

    // ─────────────────────────────────────────────────────────
    //  Major Arcana data
    // ─────────────────────────────────────────────────────────
    const CARDS = [
      { n:0,  slug:"00-the-fool",            name:"The Fool",            el:"air",
        keys:["beginnings","leap of faith","innocence","spontaneity"],
        upright:"A doorway opens and you walk through it without checking the weather. Innocent, brave, a little reckless — the universe rewards the leap when the heart is honest.",
        reversed:"Hesitation dressed up as wisdom. You're holding a ticket you won't punch. Either step off the cliff or stop pretending you're standing near it." },
      { n:1,  slug:"01-the-magician",        name:"The Magician",        el:"air",
        keys:["manifestation","willpower","skill","resourcefulness"],
        upright:"Every tool you need is on the table. Will, words, action — channel them through one clear intention and watch reality reshape itself around it.",
        reversed:"Power scattered across ten browser tabs. Talent is real but the focus isn't, or worse, the trick is being run on you. Audit your motives." },
      { n:2,  slug:"02-the-high-priestess",  name:"The High Priestess",  el:"water",
        keys:["intuition","subconscious","mystery","inner voice"],
        upright:"You already know. The answer is in the hum behind your thoughts, not in any feed. Sit with the silence — it's not empty, it's full.",

      { n:3,  slug:"03-the-empress",         name:"The Empress",         el:"earth",
        keys:["abundance","fertility","nurturing","sensuality"],
        upright:"Something is ripening. Tend it gently — the project, the bond, the body. Soft attention is the fertilizer here, not force.",
        reversed:"Creative current is dammed. Burnout, neglect, or self-rejection. Return to the senses — eat, walk, touch grass — before forcing more output." },
      { n:4,  slug:"04-the-emperor",         name:"The Emperor",         el:"fire",
        keys:["authority","structure","control","fatherhood"],
        upright:"Build the frame. Set the rules. The chaos doesn't need more freedom right now, it needs walls and a clear hand on the throne — yours.",
        reversed:"Either rigidity that's choking growth or weakness pretending to be authority. Soften the iron, or pick it up — but stop hovering between." },
      { n:5,  slug:"05-the-hierophant",      name:"The Hierophant",      el:"earth",
        keys:["tradition","conformity","institution","spiritual teaching"],
        upright:"There's a path others have walked here, and the map works. Mentorship, doctrine, ritual — borrow the form before you remix it.",
        reversed:"The old story doesn't fit anymore. Time to leave the temple, question the teacher, and find your own scripture — even if it scares the elders." },
      { n:6,  slug:"06-the-lovers",          name:"The Lovers",          el:"air",
        keys:["union","values","choice","partnership"],
        upright:"A choice that matters — between two paths, two people, two versions of you. Pick the one that aligns with what you actually love, not what looks good.",
        reversed:"Misalignment. Either with a partner, an idea, or your own values. The fracture is small now and growing — name it before it grows teeth." },
      { n:7,  slug:"07-the-chariot",         name:"The Chariot",         el:"water",
        keys:["willpower","determination","control","victory"],
        upright:"Two wild horses, one set of reins, your hands. Discipline turns conflict into momentum. Win this one by refusing to slow down.",

      { n:8,  slug:"08-strength",            name:"Strength",            el:"fire",

      { n:9,  slug:"09-the-hermit",          name:"The Hermit",          el:"earth",
        keys:["introspection","solitude","soul-searching","inner guidance"],
        upright:"The lantern is yours. Step back from the crowd — the noise was hiding the answer. Solitude isn't loneliness here, it's clarity.",

      { n:10, slug:"10-wheel-of-fortune",    name:"Wheel of Fortune",    el:"fire",
        keys:["cycles","turning point","fate","destiny"],
        upright:"The wheel turns and it's turning your way. A lucky break, a cycle closing, an opening that wasn't there last week. Move with the spin, not against it.",

      { n:11, slug:"11-justice",             name:"Justice",             el:"air",
        keys:["fairness","truth","cause-and-effect","accountability"],
        upright:"What you sent out is coming back. If it's good, receive it without flinching. If it isn't, take the lesson on the chin and adjust the math.",

      { n:12, slug:"12-the-hanged-man",      name:"The Hanged Man",      el:"water",
        keys:["surrender","new perspective","suspension","sacrifice"],
        upright:"The way forward is to stop forcing forward. Hang upside-down for a beat — the picture you've been staring at looks completely different from this angle.",
        reversed:"Stuck waiting for a sign that's already arrived. Stalling dressed as patience. Move — even one inch — and the energy unsticks." },
      { n:13, slug:"13-death",               name:"Death",               el:"water",
        keys:["endings","transformation","transition","release"],
        upright:"A version of something has to die so the next thing can live. A habit, a self-image, a relationship past its date. Let it go cleanly — what's coming is bigger. (This card is never literal.)",
        reversed:"You're white-knuckling something that ended already. Funeral postponed indefinitely. Closure is yours to give, not theirs." },
      { n:14, slug:"14-temperance",          name:"Temperance",          el:"fire",
        keys:["balance","moderation","patience","alchemy"],
        upright:"Two opposites becoming one thing. The art is in the slow pour — not too much, not too fast. Mix work and rest, ambition and ease, until something rare drops out.",
        reversed:"Extremes. Burnout swinging into binge swinging back. The middle path isn't boring — it's where the magic actually happens." },
      { n:15, slug:"15-the-devil",           name:"The Devil",           el:"earth",

      { n:19, slug:"19-the-sun",             name:"The Sun",             el:"fire",

      { n:21, slug:"21-the-world",           name:"The World",           el:"earth",
        keys:["completion","achievement","integration","fulfillment"],
        upright:"A circle closes. You've actually done the thing. Stand in it for a beat before the next chapter — the lap was long, the lap was real.",
        reversed:"So close you can taste it, but you're skipping the last step. Don't fumble the landing — finish, then leave." },
    ];

    const ELEMENT_FRIENDS = { fire:'air', air:'fire', water:'earth', earth:'water' };
    const ELEMENT_HOSTILES = { fire:'water', water:'fire', air:'earth', earth:'air' };
    const dignity = (a,b) => !a||!b ? 'neutral' : a===b ? 'compound' : ELEMENT_FRIENDS[a]===b ? 'friendly' : ELEMENT_HOSTILES[a]===b ? 'hostile' : 'neutral';

    // ── Named card pairings (researched from Biddy/Labyrinthos/Pollack) ──
    // Key = "lowN-highN" (sorted). Surfaces an established combo meaning when
    // both cards appear in a spread.
    const NAMED_PAIRS = {
      '0-1':   "pure potential meets focused will — manifestation hour",
      '1-21':  "mastery completed — the work has succeeded",
      '2-9':   "the answer wants silence and solitude — both cards point inward",
      '2-18':  "intuition and illusion — trust the inner voice, then verify",
      '3-4':   "nurture meets structure — balanced creation, often partnership",
      '3-13':  "fertility through loss — creation emerging from grief",
      '5-6':   "a committed bond, a vow worth making",
      '6-11':  "a choice that will be judged — decisions with consequences",

    // Look up a named pair by card numbers
    function pairKey(a, b) {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      return `${lo}-${hi}`;
    }
    function findNamedPair(picks) {
      for (let i = 0; i < picks.length; i++) {
        for (let j = i + 1; j < picks.length; j++) {
          const k = pairKey(picks[i].card.n, picks[j].card.n);
          if (NAMED_PAIRS[k]) return { meaning: NAMED_PAIRS[k], a: picks[i], b: picks[j] };
        }
      }
      return null;
    }
    function findSum21Axis(picks) {
      for (let i = 0; i < picks.length; i++) {
        for (let j = i + 1; j < picks.length; j++) {
          const a = picks[i].card.n, b = picks[j].card.n;
          if (a + b === 21) {
            const k = pairKey(a, b);
            if (SUM21_AXES[k]) return { meaning: SUM21_AXES[k], a: picks[i], b: picks[j] };
          }
        }
      }
      return null;
    }
    function theosophicSum(picks) {
      let sum = picks.reduce((s, p) => s + p.card.n, 0);
      while (sum > 21) sum = String(sum).split('').reduce((s, d) => s + +d, 0);
      return sum;
    }

    const themeToggle = document.getElementById('themeToggle');

    const starsCanvas = document.getElementById('stars');
    const sctx = starsCanvas.getContext('2d');
    let stars = [], embers = [];

    // Pre-render ember halo sprites once. Per-frame createRadialGradient was the
    // jank source; now each ember is a single drawImage with global alpha.
    function makeEmberSprite(warm) {
      const SZ = 64;
      const cv = document.createElement('canvas');
      cv.width = cv.height = SZ;
      const cx = cv.getContext('2d');
      const grad = cx.createRadialGradient(SZ/2, SZ/2, 0, SZ/2, SZ/2, SZ/2);
      if (warm) {
        grad.addColorStop(0,    'rgba(255, 230, 170, 0.95)');
        grad.addColorStop(0.18, 'rgba(255, 200, 120, 0.55)');
        grad.addColorStop(0.5,  'rgba(255, 150, 70, 0.18)');
        grad.addColorStop(1,    'rgba(255, 120, 40, 0)');
      } else {
        grad.addColorStop(0,    'rgba(240, 220, 255, 0.9)');
        grad.addColorStop(0.18, 'rgba(200, 160, 255, 0.5)');
        grad.addColorStop(0.5,  'rgba(160, 100, 255, 0.15)');
        grad.addColorStop(1,    'rgba(120, 60, 220, 0)');
      }
      cx.fillStyle = grad;
      cx.fillRect(0, 0, SZ, SZ);
      // bright core
      cx.fillStyle = warm ? '#fff0c8' : '#f0e0ff';
      cx.beginPath();
      cx.arc(SZ/2, SZ/2, 2.2, 0, Math.PI * 2);
      cx.fill();
      return cv;
    }
    const warmSprite = makeEmberSprite(true);
    const coolSprite = makeEmberSprite(false);

    function sizeStars() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      starsCanvas.width = window.innerWidth * dpr;
      starsCanvas.height = window.innerHeight * dpr;
      starsCanvas.style.width = window.innerWidth + 'px';
      starsCanvas.style.height = window.innerHeight + 'px';
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Scale particle counts to viewport area but cap conservatively to avoid
      // perf cliffs on lower-end devices.
      const starCount  = Math.min(180, Math.floor(window.innerWidth * window.innerHeight / 9000));
      const emberCount = Math.min(28,  Math.floor(window.innerWidth * window.innerHeight / 60000));
      stars = Array.from({ length: starCount }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.4 + 0.25,
        a: Math.random() * 0.65 + 0.2,
        p: Math.random() * Math.PI * 2,
        gold: Math.random() < 0.07,
      }));
      embers = Array.from({ length: emberCount }, () => spawnEmber(true));
    }
    function spawnEmber(initial) {
      return {
        x: Math.random() * window.innerWidth,
        y: initial ? Math.random() * window.innerHeight : window.innerHeight + 14,
        size: Math.random() * 26 + 14,           // sprite render size
        a: Math.random() * 0.55 + 0.32,
        vy: -(Math.random() * 0.22 + 0.10),       // gentle upward drift
        vx: (Math.random() - 0.5) * 0.10,
        p: Math.random() * Math.PI * 2,
        warm: Math.random() < 0.72,
        life: 1,
        decay: 0.00032 + Math.random() * 0.00032, // slow fade
      };
    }

    let lastFrame = performance.now();
    function drawStars(now) {
      sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (root.getAttribute('data-theme') !== 'dark') {
        lastFrame = now;
        return;
      }
      const dt = Math.min(50, now - lastFrame); // ms; clamp on tab refocus
      lastFrame = now;
      const t = now / 1000;

      // Stars
      for (const s of stars) {
        const tw = (Math.sin(t * 1.3 + s.p) + 1) * 0.5;
        sctx.globalAlpha = s.a * (0.45 + tw * 0.55);
        sctx.fillStyle = s.gold ? '#f3d27a' : '#cbb3ff';
        sctx.beginPath();
        sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sctx.fill();
      }

      // Embers — drift upward, gentle horizontal sway, fade as they rise.
      for (let i = 0; i < embers.length; i++) {
        const e = embers[i];
        // Time-based motion (so behavior is consistent regardless of fps)
        e.y += e.vy * (dt / 16);
        e.x += (e.vx + Math.sin(t * 0.7 + e.p) * 0.12) * (dt / 16);
        e.life -= e.decay * dt;
        if (e.life <= 0 || e.y < -e.size) {
          embers[i] = spawnEmber(false);
          continue;
        }
        const flick = (Math.sin(t * 2 + e.p) + 1) * 0.5;
        sctx.globalAlpha = Math.max(0, e.a * e.life * (0.6 + flick * 0.4));
        const sprite = e.warm ? warmSprite : coolSprite;
        sctx.drawImage(sprite, e.x - e.size / 2, e.y - e.size / 2, e.size, e.size);
      }
      sctx.globalAlpha = 1;
    }
    sizeStars();
    window.addEventListener('resize', sizeStars);
    function loop(ts) { drawStars(ts || performance.now()); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    function el(tag, cls, attrs = {}) {

      for (const k in attrs) {
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else e.setAttribute(k, attrs[k]);
      }
      return e;
    }
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function shuffleArr(a) { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function toRoman(n) { if (n===0) return '0'; const map=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let v=n,o=''; for(const[k,s] of map) while(v>=k){o+=s;v-=k;} return o; }
    function cardGlyph(n) { return ['☼','✦','☾','✿','♕','✶','♥','⚡','♌','✺','◯','⚖','☥','✝','✧','☠','⛤','★','☽','☀','♎','◉'][n] || '✦'; }

    // ─────────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────────
    function makeCardBack() {
      const back = el('div', 'card-face back');
      const orn = el('div', 'card-back-ornament');
      orn.innerHTML = '<svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMid meet"><use href="#cardBackArt" /></svg>';
      back.appendChild(orn);
      const img = el('img', 'card-back-img', { alt: '', loading: 'lazy' });
      img.onerror = () => img.remove();
      img.addEventListener('load', () => back.classList.add('has-image'));
      img.src = 'card-back.jpg';
      back.appendChild(img);
      return back;
    }
    function makeCardFront(card) {
      const front = el('div', 'card-face front');
      const art = el('div', 'art-layer');
      const img = el('img', '', { alt: card.name, loading: 'lazy' });
      const ph = el('div', 'placeholder');
      const phCenter = el('div', 'ph-center');
      phCenter.appendChild(el('div', 'ph-glyph', { text: cardGlyph(card.n) }));
      const phBottom = el('div', '');
      phBottom.style.zIndex = '1';
      phBottom.appendChild(el('div', 'ph-title', { text: card.name }));
      phBottom.appendChild(el('div', 'ph-hint', { text: 'art incoming' }));
      ph.append(
        el('div', 'ph-num', { text: toRoman(card.n) }),
        phCenter,
        phBottom,
      );
      art.append(ph, img);
      img.addEventListener('load', () => {
        ph.style.display = 'none';
        front.classList.add('has-image');
      });
      img.addEventListener('error', () => { img.classList.add('broken'); });
      img.src = `cards/${card.slug}.jpg`;
      front.appendChild(art);
      const strip = el('div', 'card-name-strip', { text: card.name });
      front.appendChild(strip);
      return front;
    }
    function makeCard(entry, opts = {}) {
      const wrap = el('div', 'card');
      if (opts.faceUp) wrap.classList.add('flipped');

      inner.appendChild(makeCardFront(entry.card));
      if (entry.reversed) {
        const tag = el('div', 'reversed-tag', { text: 'Rev' });
        wrap.appendChild(tag);
      }
      wrap.appendChild(inner);
      return wrap;
    }

    // ─────────────────────────────────────────────────────────

    const scene = document.getElementById('scene');

    function clearStage() {
