<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tarot OG Image Builder</title>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 400 800;
      font-display: block;
      src: url(../fonts/SpaceGrotesk-latin.woff2) format('woff2');
    }
    body {
      margin: 0;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(192, 132, 255, 0.18), transparent 60%),
        #07050d;
      color: #f4ecd7;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 1px;
      margin: 0 0 8px;
      background: linear-gradient(120deg, #ffe5a8, #c084ff, #ffe5a8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #b9a8d8; font-size: 13px; margin: 0 0 24px; }
    p code { background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 4px; color: #ffe5a8; font-family: ui-monospace, monospace; }
    canvas {
      box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(192, 132, 255, 0.15);
      border-radius: 8px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 22px;
    }
    .actions { display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button {
      background: linear-gradient(135deg, #c084ff, #6b2dd4);
      color: #fff;
      border: 1px solid rgba(232, 200, 122, 0.4);
      padding: 12px 24px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(192, 132, 255, 0.5); }
    button.outline {
      background: transparent;
      color: #f4ecd7;
      border-color: rgba(232, 200, 122, 0.5);
    }
    button.outline:hover { color: #ffe5a8; border-color: #ffe5a8; }
    .status { color: #b9a8d8; font-size: 12px; margin-top: 14px; min-height: 18px; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <h1>Tarot OG Image Builder</h1>
  <p>Render the 1200×630 social preview card. Save as <code>tarot/og.jpg</code> and commit.</p>
  <canvas id="cv" width="1200" height="630"></canvas>
  <div class="actions">
    <button id="download">⬇ Download og.jpg</button>
    <button id="png" class="outline">Download PNG</button>
    <button id="regen" class="outline">Re-generate</button>
  </div>
  <div class="status" id="status">Loading card art…</div>

  <script>
  (() => {
    'use strict';
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const W = 1200, H = 630;
    const status = document.getElementById('status');

    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('failed: ' + src));
        img.src = src;
      });
    }

    function rrPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    const rrFill = (c, x, y, w, h, r) => { rrPath(c, x, y, w, h, r); c.fill(); };
    const rrStroke = (c, x, y, w, h, r) => { rrPath(c, x, y, w, h, r); c.stroke(); };

    function spaced(ctx, text, x, y, sp) {
      ctx.save();
      let total = 0;
      for (const ch of text) total += ctx.measureText(ch).width;
      total += sp * (text.length - 1);
      let cur = x - total / 2;
      ctx.textAlign = 'left';
      for (const ch of text) {
        ctx.fillText(ch, cur, y);
        cur += ctx.measureText(ch).width + sp;
      }
      ctx.restore();
    }

    function divider(ctx, cx, cy, w) {
      const half = w / 2;
      ctx.save();
      const g = ctx.createLinearGradient(cx - half, cy, cx + half, cy);
      g.addColorStop(0, 'rgba(232, 200, 122, 0)');
      g.addColorStop(0.18, 'rgba(232, 200, 122, 0.55)');
      g.addColorStop(0.46, 'rgba(232, 200, 122, 0.55)');
      g.addColorStop(0.5, 'rgba(232, 200, 122, 0)');
      g.addColorStop(0.54, 'rgba(232, 200, 122, 0.55)');
      g.addColorStop(0.82, 'rgba(232, 200, 122, 0.55)');
      g.addColorStop(1, 'rgba(232, 200, 122, 0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - half, cy); ctx.lineTo(cx + half, cy); ctx.stroke();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = 'rgba(232, 200, 122, 0.85)';
      ctx.fillRect(-3.5, -3.5, 7, 7);
      ctx.restore();
    }

    function corners(ctx, x, y, w, h, len) {
      ctx.save();
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.7)';
      ctx.lineWidth = 1.4;
      const cs = [
        { x: x, y: y, dx: 1, dy: 1 },
        { x: x + w, y: y, dx: -1, dy: 1 },
        { x: x, y: y + h, dx: 1, dy: -1 },
        { x: x + w, y: y + h, dx: -1, dy: -1 },
      ];
      for (const c of cs) {
        ctx.beginPath();
        ctx.moveTo(c.x, c.y + c.dy * len);
        ctx.lineTo(c.x, c.y);
        ctx.lineTo(c.x + c.dx * len, c.y);
        ctx.stroke();
        ctx.fillStyle = 'rgba(232, 200, 122, 0.85)';
        ctx.beginPath(); ctx.arc(c.x, c.y, 2.4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    async function render() {
      status.textContent = 'Loading card art…';
      // Wait for the Space Grotesk font to load so canvas text matches the site
      try { await document.fonts.ready; } catch (_) {}

      // Hero cards: The Star (hope), The Sun (joy), The World (completion).
      // Use the canonical RWS reading-positive trio for the social preview.
      const slugs = ['17-the-star', '19-the-sun', '21-the-world'];
      let imgs;
      try {
        imgs = await Promise.all(slugs.map(s => loadImg(`cards/${s}.jpg`)));
      } catch (e) {
        status.textContent = 'Failed to load card art. Make sure tarot/cards/*.jpg exist.';
        return;
      }

      // Background — deep midnight + layered glows + stars + embers
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#1d1240');
      bg.addColorStop(0.55, '#0c0820');
      bg.addColorStop(1, '#04020c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      let glow = ctx.createRadialGradient(W/2, -120, 0, W/2, 240, 800);
      glow.addColorStop(0, 'rgba(176, 124, 255, 0.5)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      glow = ctx.createRadialGradient(W * 0.95, H * 0.5, 0, W * 0.95, H * 0.5, 540);
      glow.addColorStop(0, 'rgba(255, 154, 60, 0.20)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      glow = ctx.createRadialGradient(W * 0.05, H * 0.5, 0, W * 0.05, H * 0.5, 540);
      glow.addColorStop(0, 'rgba(120, 50, 230, 0.20)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      glow = ctx.createRadialGradient(W/2, H + 80, 0, W/2, H - 200, 600);
      glow.addColorStop(0, 'rgba(232, 200, 122, 0.18)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

      // Stars
      for (let i = 0; i < 240; i++) {
        const x = Math.random() * W, y = Math.random() * H;
        const r = Math.random() * 1.4 + 0.3;
        const a = Math.random() * 0.7 + 0.2;
        ctx.fillStyle = Math.random() < 0.08 ? `rgba(243,210,122,${a})` : `rgba(203,179,255,${a})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      // Embers
      for (let i = 0; i < 20; i++) {
        const x = Math.random() * W, y = Math.random() * H;
        const r = Math.random() * 2.5 + 1.4;
        const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
        halo.addColorStop(0, 'rgba(255, 200, 120, 0.6)');
        halo.addColorStop(1, 'rgba(255, 140, 60, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath(); ctx.arc(x, y, r * 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 220, 160, 0.85)';
        ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fill();
      }

      // Sealed-edge vignette
      const vig = ctx.createRadialGradient(W/2, H/2, H * 0.30, W/2, H/2, H * 0.95);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

      // Outer double gold frame + corner flourishes
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.62)';
      ctx.lineWidth = 1.4;
      rrStroke(ctx, 18, 18, W - 36, H - 36, 18);
      ctx.strokeStyle = 'rgba(232, 200, 122, 0.22)';
      ctx.lineWidth = 1;
      rrStroke(ctx, 28, 28, W - 56, H - 56, 14);
      corners(ctx, 18, 18, W - 36, H - 36, 32);

      // ── Title block ──
      ctx.textAlign = 'center';
      divider(ctx, W / 2, 78, 360);

      ctx.fillStyle = '#f3d27a';
      ctx.font = '800 19px "Space Grotesk", system-ui, sans-serif';
      spaced(ctx, 'A TAROT READING', W / 2, 110, 7);

      // Big shimmering title
      const titleGrad = ctx.createLinearGradient(W * 0.15, 0, W * 0.85, 0);
      titleGrad.addColorStop(0, '#ffe5a8');
      titleGrad.addColorStop(0.3, '#fff7e0');
      titleGrad.addColorStop(0.5, '#ffffff');
      titleGrad.addColorStop(0.7, '#fff7e0');
      titleGrad.addColorStop(1, '#ffe5a8');
      ctx.fillStyle = titleGrad;
      ctx.font = '800 96px "Space Grotesk", system-ui, sans-serif';
      spaced(ctx, 'EMO TAROT', W / 2, 196, 6);

      // Subtitle
      ctx.fillStyle = '#cfc1ec';
      ctx.font = 'italic 22px "Space Grotesk", system-ui, sans-serif';
      ctx.fillText('twenty-two arcana, drawn in your name', W / 2, 220);

      // ── Three hero cards (drawn back-to-front so center is on top) ──
      const cardW = 220, cardH = cardW * 8 / 5; // 220 × 352
      const centerX = W / 2;
      const centerY = 440;
      const positions = [
        { x: centerX - 220, y: centerY - 8, rot: -10 },
        { x: centerX,       y: centerY,     rot: 0   },
        { x: centerX + 220, y: centerY - 8, rot:  10 },
      ];

      const drawOrder = [0, 2, 1];
      for (const i of drawOrder) {
        const p = positions[i];
        const img = imgs[i];
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);

        // Drop shadow
        ctx.shadowColor = 'rgba(0,0,0,0.55)';
        ctx.shadowBlur = 28;
        ctx.shadowOffsetY = 14;
        rrPath(ctx, -cardW/2, -cardH/2, cardW, cardH, 12);
        ctx.fillStyle = '#0a0418';
        ctx.fill();
        ctx.shadowColor = 'transparent';

        // Image clipped to rounded card
        ctx.save();
        rrPath(ctx, -cardW/2, -cardH/2, cardW, cardH, 12);
        ctx.clip();
        // Cover-fit the source image
        const ar = img.naturalWidth / img.naturalHeight;
        const cardAr = cardW / cardH;
        let dw, dh;
        if (ar > cardAr) { dh = cardH; dw = cardH * ar; }
        else { dw = cardW; dh = cardW / ar; }
        ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
        ctx.restore();

        // Subtle gold bevel on top
        ctx.strokeStyle = 'rgba(232, 200, 122, 0.35)';
        ctx.lineWidth = 1.2;
        rrStroke(ctx, -cardW/2 + 0.5, -cardH/2 + 0.5, cardW - 1, cardH - 1, 12);

        ctx.restore();
      }

      // ── Footer flourish (decorative divider only — no text) ──
      divider(ctx, W / 2, H - 56, 280);

      status.textContent = 'Ready. Click ⬇ Download to save og.jpg into tarot/.';
    }

    function download(format) {
      const ext = format === 'image/png' ? 'png' : 'jpg';
      cv.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'og.' + ext;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        status.textContent = 'Saved og.' + ext + ' — move it into tarot/ folder.';
      }, format, 0.92);
    }

    document.getElementById('download').addEventListener('click', () => download('image/jpeg'));
    document.getElementById('png').addEventListener('click', () => download('image/png'));
    document.getElementById('regen').addEventListener('click', render);

    render();
  })();
  </script>
</body>
</html>
