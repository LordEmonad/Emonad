<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>EMO CRUSH — $EMO on Monad</title>
<meta property="og:title" content="EMO CRUSH — $EMO on Monad">
<meta property="og:description" content="crush your feelings — a match-3 game by $EMO">
<meta property="og:image" content="https://emonad.lol/emonad.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMO CRUSH">
<meta name="theme-color" content="#F8F5FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="emonad-200.webp">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none}
:root{
--bg:#F8F5FF;--accent:#FF5E94;--accent-h:#FF7DAE;--accent-g:rgba(255,94,148,.25);
--sf:rgba(0,0,0,.03);--sb:rgba(0,0,0,.08);
--tx:#1E1E2E;--tx2:#5E5E76;--tx3:#9898B0;
--board-bg:rgba(255,255,255,.2);--board-bdr:rgba(255,255,255,.4);
--board-shadow:0 20px 60px rgba(120,80,180,.14),0 8px 30px rgba(0,0,0,.08),0 0 40px rgba(255,94,148,.05),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.03);
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
body.dark{
--bg:#08080E;--accent:#FF5E94;--accent-h:#FF7DAE;--accent-g:rgba(255,94,148,.3);
--sf:rgba(255,255,255,.06);--sb:rgba(255,255,255,.1);
--tx:#f0f0f4;--tx2:#999;--tx3:#505050;
--board-bg:rgba(14,14,22,.32);--board-bdr:rgba(255,255,255,.07);
--board-shadow:inset 0 2px 30px rgba(0,0,0,.25),0 0 80px rgba(255,94,148,.1),0 0 40px rgba(140,80,220,.08),0 16px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);
font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--tx);
touch-action:manipulation;-webkit-tap-highlight-color:transparent;
user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
-webkit-text-size-adjust:100%;position:fixed;inset:0}

#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;z-index:1;
padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}

.back-link{position:fixed;top:calc(8px + var(--safe-t));left:calc(8px + var(--safe-l));z-index:60;display:inline-flex;align-items:center;gap:4px;
color:var(--tx2);text-decoration:none;font-size:11px;font-weight:700;padding:8px 16px;min-height:44px;
border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.35);
backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
box-shadow:0 2px 12px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5);transition:all .25s ease}
.back-link:active{transform:scale(.95);opacity:.8}
.home-btn{position:fixed;top:calc(8px + var(--safe-t));left:calc(86px + var(--safe-l));z-index:60;width:44px;height:44px;
border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.35);
backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
cursor:pointer;display:flex;align-items:center;justify-content:center;
box-shadow:0 2px 12px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5);
transition:all .25s ease;color:var(--tx2);padding:0;line-height:0;min-width:44px;
opacity:0;pointer-events:none;transform:translateY(-6px)}
body.in-game .home-btn{opacity:1;pointer-events:auto;transform:translateY(0)}
.home-btn:active{transform:scale(.9)}

#hud{width:100%;max-width:420px;padding:0;display:flex;justify-content:space-between;align-items:stretch;z-index:10;flex-shrink:0;
gap:6px;margin:58px 14px 0;opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .4s ease,transform .4s ease}
#hud.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.hc{display:flex;flex-direction:column;padding:10px 16px 8px;min-width:0;
background:rgba(255,255,255,.25);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);
border:1px solid rgba(255,255,255,.35);border-radius:16px;
box-shadow:0 4px 24px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.6);
transition:all .3s ease}
.hl{align-items:flex-start;min-width:72px}.hm{align-items:center;flex:1;padding:6px 12px 4px}.hr{align-items:flex-end;min-width:64px}
.hud-lbl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);opacity:.5;margin-bottom:2px}
.hud-val{font-size:clamp(20px,6vw,28px);font-weight:800;color:var(--tx);line-height:1;letter-spacing:-1px;
background:linear-gradient(180deg,#1E1E2E,#3E3E56);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:transform .2s ease}
.hud-val.accent{background:linear-gradient(180deg,var(--accent),#FF3070);-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 0 8px rgba(255,94,148,.15))}
.lvl-name{font-size:13px;font-weight:800;letter-spacing:.3px;
background:linear-gradient(135deg,var(--accent),var(--accent-h));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lvl-sub{font-size:9px;font-weight:600;color:var(--tx2);letter-spacing:.2px;margin-top:2px;max-width:130px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.55}

.obj-row{display:flex;gap:5px;margin-top:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.obj-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.3);
border-radius:999px;padding:3px 8px 3px 4px;font-size:10px;font-weight:700;transition:all .3s;
box-shadow:0 1px 6px rgba(0,0,0,.04)}
.obj-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.obj-pill .ct{color:var(--accent);font-weight:800}
.obj-pill.done{opacity:.2;transform:scale(.9)}

#pbar{width:100%;max-width:420px;padding:0 14px;margin-bottom:4px;flex-shrink:0;
opacity:0;transition:opacity .4s ease;pointer-events:none}
#pbar.visible{opacity:1;pointer-events:auto}
.pb-t{width:100%;height:4px;background:rgba(0,0,0,.06);border-radius:4px;overflow:hidden;position:relative}
.pb-f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-h),#FFB0D4);background-size:200% 100%;
border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1);position:relative;
box-shadow:0 0 8px rgba(255,94,148,.3),0 0 16px rgba(255,94,148,.08);animation:pbShimmer 3s ease-in-out infinite}
.pb-f::after{content:'';position:absolute;right:-1px;top:-2px;width:8px;height:8px;border-radius:50%;
background:#fff;box-shadow:0 0 6px rgba(255,94,148,.6),0 0 12px rgba(255,94,148,.3);opacity:.85}
@keyframes pbShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

#bwrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:440px;min-height:0;padding:0 8px;
opacity:0;transition:opacity .5s ease .1s}
#bwrap.visible{opacity:1}
#board{position:relative;border-radius:24px;overflow:hidden;
background:var(--board-bg);border:1px solid var(--board-bdr);
box-shadow:var(--board-shadow);
backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);
transition:box-shadow .4s ease,background .4s ease,border-color .4s ease}
#board::before{content:'';position:absolute;inset:0;border-radius:24px;padding:1.5px;
background:conic-gradient(from var(--board-glow-angle,0deg),rgba(255,94,148,.2),rgba(170,140,255,.15),rgba(100,220,255,.15),rgba(255,200,100,.15),rgba(255,94,148,.2));
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;
mask-composite:exclude;pointer-events:none;z-index:1;opacity:.5;animation:boardGlowSpin 10s linear infinite}
#board::after{content:'';position:absolute;inset:-18%;border-radius:30px;pointer-events:none;z-index:0;
background:
radial-gradient(40% 32% at 18% 24%,rgba(255,120,190,.26),rgba(255,120,190,0) 70%),
radial-gradient(36% 30% at 82% 78%,rgba(120,210,255,.22),rgba(120,210,255,0) 74%),
radial-gradient(34% 28% at 64% 20%,rgba(176,142,255,.2),rgba(176,142,255,0) 76%);
mix-blend-mode:screen;filter:blur(16px) saturate(1.2);opacity:.4;
animation:boardAuraDrift 12s ease-in-out infinite alternate}

@keyframes boardGlowSpin{0%{--board-glow-angle:0deg}100%{--board-glow-angle:360deg}}
@keyframes boardAuraDrift{0%{transform:translate3d(-3%,0,0) scale(1)}
50%{transform:translate3d(2%,-2%,0) scale(1.05)}
100%{transform:translate3d(4%,2%,0) scale(1)}}
@property --board-glow-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
#gc{display:block;position:relative;z-index:2;will-change:transform;touch-action:none}

/* ── OVERLAYS ── */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
z-index:50;background:rgba(255,255,255,.55);backdrop-filter:blur(40px) saturate(1.3);-webkit-backdrop-filter:blur(40px) saturate(1.3);
transition:opacity .5s ease;padding:var(--safe-t) max(24px,var(--safe-r)) var(--safe-b) max(24px,var(--safe-l))}
.ov.hidden{opacity:0;pointer-events:none}

/* ── START SCREEN ── */
#scrS{justify-content:center;background:rgba(255,255,255,.15)!important;backdrop-filter:blur(50px) saturate(1.5)!important;-webkit-backdrop-filter:blur(50px) saturate(1.5)!important}
.ss-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;max-width:380px;padding:0 16px}
.ss-mascot{width:140px;height:140px;border-radius:32px;
box-shadow:0 0 0 5px rgba(255,94,148,.12),0 0 50px rgba(255,94,148,.25),0 0 100px rgba(255,94,148,.1),0 16px 50px rgba(0,0,0,.15);
animation:mascotPulse 4s ease-in-out infinite alternate;
transition:transform .4s cubic-bezier(.16,1,.3,1);margin-bottom:24px;position:relative}
@keyframes mascotPulse{0%{box-shadow:0 0 0 5px rgba(255,94,148,.08),0 0 40px rgba(255,94,148,.2),0 0 80px rgba(255,94,148,.06),0 16px 50px rgba(0,0,0,.15)}
100%{box-shadow:0 0 0 8px rgba(255,94,148,.18),0 0 60px rgba(255,94,148,.35),0 0 120px rgba(255,94,148,.12),0 16px 50px rgba(0,0,0,.15)}}
.ss-mascot:active{transform:scale(.93)}
.ss-title{font-size:clamp(3rem,10vw,4.2rem);font-weight:800;letter-spacing:-2.5px;line-height:.9;margin-bottom:8px;text-align:center;width:100%;
background:linear-gradient(135deg,#FF5E94 0%,#FF3070 30%,#FF7DAE 60%,#FFB0D4 80%,#FF5E94 100%);background-size:300% 100%;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
animation:titleShimmer 6s ease-in-out infinite;
filter:drop-shadow(0 0 30px rgba(255,94,148,.25)) drop-shadow(0 0 60px rgba(255,94,148,.1))}
@keyframes titleShimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.ss-sub{font-size:clamp(12px,3.5vw,15px);font-weight:500;color:var(--tx2);font-style:italic;margin-bottom:24px;letter-spacing:.8px;
opacity:.7}
.ss-divider{width:60px;height:2px;border:none;border-radius:1px;margin:0 auto 24px;
background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.ss-card{background:rgba(255,255,255,.18);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);
border:1px solid rgba(255,255,255,.3);border-radius:24px;padding:24px 20px 20px;margin-bottom:28px;
box-shadow:0 16px 48px rgba(0,0,0,.06),0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.5);
animation:cardBorder 12s ease-in-out infinite;width:100%;max-width:300px;position:relative;overflow:hidden}
.ss-card::before{content:'';position:absolute;inset:-1px;border-radius:25px;padding:1px;
background:conic-gradient(from 0deg,rgba(255,94,148,.3),rgba(170,215,255,.3),rgba(255,242,180,.3),rgba(215,188,255,.3),rgba(175,242,222,.3),rgba(255,94,148,.3));
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;
mask-composite:exclude;animation:cardSpin 12s linear infinite;pointer-events:none;opacity:.6}
@keyframes cardSpin{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes cardBorder{0%,100%{border-color:rgba(255,176,208,.3)}25%{border-color:rgba(200,230,248,.3)}
50%{border-color:rgba(221,208,248,.3)}75%{border-color:rgba(192,240,224,.3)}}
.ss-faces{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;width:100%;justify-items:center}
.ss-face-wrap{display:flex;align-items:center;justify-content:center;position:relative}
.ss-face{width:clamp(60px,16vw,76px);height:clamp(60px,16vw,76px);border-radius:clamp(15px,4vw,20px);
box-shadow:0 6px 20px rgba(0,0,0,.08),0 0 0 1px rgba(255,255,255,.3);transition:transform .3s ease,box-shadow .3s ease}
.ss-face-wrap:nth-child(1){animation:faceFloat 3.2s ease-in-out infinite alternate}
.ss-face-wrap:nth-child(2){animation:faceFloat 3.6s ease-in-out -.7s infinite alternate}
.ss-face-wrap:nth-child(3){animation:faceFloat 2.9s ease-in-out -1.4s infinite alternate}
.ss-face-wrap:nth-child(4){animation:faceFloat 3.4s ease-in-out -2.1s infinite alternate}
.ss-face-wrap:nth-child(5){animation:faceFloat 3.8s ease-in-out -2.8s infinite alternate}
.ss-face-wrap:nth-child(6){animation:faceFloat 3.1s ease-in-out -3.5s infinite alternate}
@keyframes faceFloat{0%{transform:translateY(0) scale(1) rotate(0deg)}100%{transform:translateY(-9px) scale(1.04) rotate(1.5deg)}}
.ss-actions{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.ss-play,.ss-select{width:100%;height:56px;min-height:56px;padding:0 20px;border-radius:999px;display:flex;align-items:center;justify-content:center;line-height:1;text-transform:uppercase;white-space:nowrap;font-family:'Space Grotesk',sans-serif;font-size:clamp(15px,4vw,17px);font-weight:800;letter-spacing:1.5px}
.ss-play{max-width:100%;border:none;
color:#fff;cursor:pointer;position:relative;overflow:hidden;
background:linear-gradient(135deg,#FF5E94,#FF3070,#FF7DAE);background-size:200% 100%;
animation:playPulse 3s ease-in-out infinite;transition:all .25s cubic-bezier(.4,0,.2,1)}
.ss-play:active{transform:scale(.94)}
@keyframes playPulse{0%,100%{background-position:0% 50%;box-shadow:0 8px 32px rgba(255,94,148,.35),0 3px 12px rgba(255,94,148,.2),0 0 0 0 rgba(255,94,148,.15)}
50%{background-position:100% 50%;box-shadow:0 12px 44px rgba(255,94,148,.5),0 4px 16px rgba(255,94,148,.3),0 0 0 12px rgba(255,94,148,0)}}
.ss-play::before{content:'';position:absolute;inset:0;border-radius:999px;
background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,transparent 50%);pointer-events:none}
.ss-play::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
background-size:300% 100%;animation:playShine 3.5s ease-in-out infinite}
@keyframes playShine{0%,100%{background-position:200% 0}50%{background-position:-100% 0}}
.ss-select{border:1.5px solid rgba(255,255,255,.42);
color:var(--tx);cursor:pointer;position:relative;overflow:hidden;background:rgba(255,255,255,.24);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 22px rgba(0,0,0,.05);
transition:all .22s ease}
.ss-select:active{transform:scale(.96)}
.ls-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:65;
background:rgba(255,255,255,.5);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
opacity:1;transition:opacity .25s ease}
.ls-modal.hidden{opacity:0;pointer-events:none}
.ls-card{width:min(360px,92vw);max-height:min(70vh,520px);display:flex;flex-direction:column;
background:rgba(252,249,255,.9);border:1px solid rgba(255,255,255,.88);border-radius:20px;
backdrop-filter:blur(28px) saturate(1.25);-webkit-backdrop-filter:blur(28px) saturate(1.25);
box-shadow:0 20px 54px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.85);padding:14px}
.ls-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ls-title{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx2)}
.ls-close{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.3);
color:var(--tx2);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ls-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;overflow:auto;padding-right:2px}
.lv-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:7px 4px;
border-radius:14px;border:1px solid rgba(255,255,255,.66);background:rgba(255,255,255,.62);color:var(--tx);
cursor:pointer;transition:transform .2s ease,background .2s ease,border-color .2s ease;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lv-btn .n{font-size:14px;font-weight:800;line-height:1}
.lv-btn .s{font-size:9px;letter-spacing:.2px;opacity:.7;line-height:1.1}
.lv-btn.current{border-color:rgba(255,94,148,.5);background:rgba(255,94,148,.14)}
.lv-btn.endless{grid-column:span 2;background:linear-gradient(135deg,rgba(255,94,148,.2),rgba(154,122,255,.2));border-color:rgba(255,94,148,.45)}
.lv-btn.locked{opacity:.35;cursor:not-allowed;filter:saturate(.6)}
.lv-btn:active{transform:scale(.95)}
.ss-progress{margin-top:10px;font-size:11px;font-weight:500;color:var(--tx2);letter-spacing:.3px;opacity:.7}
.ss-progress span{color:var(--accent);font-weight:700}
.ss-brand{margin-top:22px;font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;opacity:.6}
.ss-brand span{color:var(--accent);font-weight:800}

/* ── WIN/LOSE ── */
.ov-card{background:rgba(255,255,255,.2);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);
border:1px solid rgba(255,255,255,.3);border-radius:28px;padding:36px 32px 28px;
box-shadow:0 20px 60px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.5);
display:flex;flex-direction:column;align-items:center;max-width:320px;width:100%}
.ov-mascot{width:80px;height:80px;border-radius:20px;margin-bottom:16px;
box-shadow:0 0 0 3px rgba(255,94,148,.08),0 8px 32px rgba(0,0,0,.1),0 0 24px rgba(255,94,148,.12);transition:transform .4s cubic-bezier(.16,1,.3,1)}
.ov-mascot:active{transform:scale(.93)}
.ov-title{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;letter-spacing:-1.5px;margin-bottom:4px;line-height:1;
background:linear-gradient(135deg,#FF5E94 0%,#FF3070 35%,#FF7DAE 70%,#FFB0D4 100%);background-size:200% 100%;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
animation:titleShimmer 6s ease-in-out infinite}
.ov-sub{font-size:clamp(12px,3.2vw,14px);font-weight:500;color:var(--tx2);margin-bottom:20px;font-style:italic;opacity:.7;letter-spacing:.3px}

.stars-row{display:flex;gap:12px;margin:12px 0 16px;justify-content:center}
#wTitle{margin:0 auto 12px;text-align:center;width:100%}
.star{width:40px;height:40px;opacity:.08;transition:all .7s cubic-bezier(.34,1.56,.64,1);transform:scale(.3) rotate(-15deg)}
.star.on{opacity:1;transform:scale(1) rotate(0deg);filter:drop-shadow(0 0 12px rgba(255,215,0,.7)) drop-shadow(0 0 24px rgba(255,215,0,.3))}
.star svg{width:100%;height:100%}
.stat-row{display:flex;gap:16px;margin:6px 0 4px}
.stat{font-size:12px;font-weight:600;color:var(--tx2);letter-spacing:.3px;

backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stat b{color:var(--accent);font-weight:800;font-size:14px}

.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{padding:14px 32px;border-radius:999px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;
cursor:pointer;border:none;transition:all .25s cubic-bezier(.4,0,.2,1);letter-spacing:.3px;min-height:48px}
.btn-primary{background:linear-gradient(135deg,#FF5E94,#FF3070,#FF7DAE);background-size:200% 100%;color:#fff;
box-shadow:0 6px 24px rgba(255,94,148,.35),0 2px 8px rgba(255,94,148,.2);animation:btnGrad 4s ease-in-out infinite}
@keyframes btnGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn-primary:active{transform:scale(.96);box-shadow:0 4px 16px rgba(255,94,148,.25)}
.btn-outline{background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border:1.5px solid rgba(255,255,255,.35);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn-outline:active{background:rgba(255,94,148,.08);transform:scale(.96)}

.cpop{position:absolute;left:50%;top:34%;transform:translateX(-50%);pointer-events:none;
font-size:26px;font-weight:800;z-index:20;white-space:nowrap;letter-spacing:1.5px;
background:linear-gradient(135deg,var(--accent),var(--accent-h),#FFD0E4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
filter:drop-shadow(0 0 20px var(--accent-g)) drop-shadow(0 0 40px rgba(255,94,148,.15)) drop-shadow(0 2px 4px rgba(0,0,0,.12));
animation:cpA 1s cubic-bezier(.16,1,.3,1) forwards}
.cpop.t2{font-size:32px;filter:drop-shadow(0 0 24px rgba(255,64,129,.5)) drop-shadow(0 0 48px rgba(255,64,129,.2)) drop-shadow(0 2px 4px rgba(0,0,0,.12))}
.cpop.t3{font-size:40px;background:linear-gradient(135deg,#ffd700,#ffaa00,#ffe066);-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 0 30px rgba(255,215,0,.6)) drop-shadow(0 0 60px rgba(255,215,0,.2)) drop-shadow(0 2px 4px rgba(0,0,0,.12))}
@keyframes cpA{0%{opacity:0;transform:translateX(-50%) scale(.3) translateY(15px) rotate(-3deg)}
12%{opacity:1;transform:translateX(-50%) scale(1.35) translateY(-10px) rotate(1deg)}
30%{transform:translateX(-50%) scale(.95) translateY(-20px) rotate(0deg)}
45%{transform:translateX(-50%) scale(1.05) translateY(-25px)}
100%{opacity:0;transform:translateX(-50%) scale(.85) translateY(-70px)}}
.pf{position:absolute;pointer-events:none;font-size:17px;font-weight:800;
background:linear-gradient(135deg,var(--accent),var(--accent-h),#FFD0E4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
filter:drop-shadow(0 0 12px var(--accent-g)) drop-shadow(0 0 24px rgba(255,94,148,.1));z-index:15;animation:pfA .8s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pfA{0%{opacity:1;transform:translateY(0) scale(1.3)}20%{opacity:1;transform:translateY(-12px) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(.75)}}

/* ── DARK MODE ── */
body.dark{background:#0a0812}
body.dark .back-link{background:rgba(20,20,30,.4);border-color:rgba(255,255,255,.06);box-shadow:0 2px 12px rgba(0,0,0,.25)}
body.dark .hc{background:rgba(14,14,22,.4);border-color:rgba(255,255,255,.06);
box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04)}
body.dark .hud-val{background:linear-gradient(180deg,#f0f0f4,rgba(240,240,244,.7));-webkit-background-clip:text;background-clip:text}
body.dark .hud-val.accent{background:linear-gradient(180deg,var(--accent),#FF3070);-webkit-background-clip:text;background-clip:text;
filter:drop-shadow(0 0 12px rgba(255,94,148,.25))}
body.dark .pb-t{background:rgba(255,255,255,.03)}
body.dark .pb-f{box-shadow:0 0 14px rgba(255,94,148,.5),0 0 30px rgba(255,94,148,.18)}
body.dark .pb-f::after{box-shadow:0 0 8px rgba(255,94,148,.8),0 0 16px rgba(255,94,148,.4)}
body.dark .obj-pill{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.05)}
body.dark #board::before{opacity:.5}
body.dark .ov{background:rgba(8,8,14,.5)}
body.dark .ov-card{background:rgba(14,14,22,.4);border-color:rgba(255,255,255,.06);
box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04)}
body.dark .btn-outline{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
body.dark .ov-mascot{box-shadow:0 0 0 3px rgba(255,94,148,.1),0 8px 32px rgba(0,0,0,.5),0 0 24px rgba(255,94,148,.15)}
body.dark .ss-mascot{box-shadow:0 0 0 5px rgba(255,94,148,.15),0 16px 50px rgba(0,0,0,.6),0 0 60px rgba(255,94,148,.25)}
body.dark .btn-outline:active{background:rgba(255,94,148,.08)}
body.dark .ss-face{box-shadow:0 6px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06)}
body.dark #scrS{background:rgba(8,8,14,.22)!important}
body.dark .ss-card{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06);
box-shadow:0 16px 48px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.03)}
body.dark .ss-card::before{opacity:.4}
body.dark .ss-divider{opacity:.15}
body.dark .stat{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06)}
body.dark .star.on{filter:drop-shadow(0 0 16px rgba(255,215,0,.8)) drop-shadow(0 0 32px rgba(255,215,0,.4))}
body.dark #board::after{opacity:.28}
body.dark .home-btn{background:rgba(20,20,30,.45);border-color:rgba(255,255,255,.08);box-shadow:0 2px 12px rgba(0,0,0,.2)}
body.dark .ss-select{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
body.dark .ls-modal{background:rgba(6,6,12,.5)}
body.dark .ls-card{background:rgba(14,14,22,.86);border-color:rgba(255,255,255,.16);box-shadow:0 22px 58px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
body.dark .ls-close{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09)}
body.dark .lv-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
body.dark .lv-btn.current{background:rgba(255,94,148,.16);border-color:rgba(255,94,148,.5)}

.sound-toggle{position:fixed;top:calc(8px + var(--safe-t));right:calc(54px + var(--safe-r));z-index:60;width:44px;height:44px;
border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(1.4);
-webkit-backdrop-filter:blur(20px) saturate(1.4);cursor:pointer;display:flex;align-items:center;justify-content:center;
box-shadow:0 2px 12px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5);
transition:all .25s ease;color:var(--tx2);padding:0;line-height:0;min-width:44px;font-size:15px}
body.dark .sound-toggle{background:rgba(20,20,30,.45);border-color:rgba(255,255,255,.08);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.sound-toggle:active{transform:scale(.9)}
.sound-toggle.muted{opacity:.5}
.mode-toggle{position:fixed;top:calc(8px + var(--safe-t));right:calc(8px + var(--safe-r));z-index:60;width:44px;height:44px;
border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(1.4);
-webkit-backdrop-filter:blur(20px) saturate(1.4);cursor:pointer;display:flex;align-items:center;justify-content:center;
box-shadow:0 2px 12px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.5);
transition:all .25s ease;color:var(--tx2);padding:0;line-height:0;min-width:44px}
body.dark .mode-toggle{background:rgba(20,20,30,.45);border-color:rgba(255,255,255,.08);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.mode-toggle:active{transform:scale(.9)}
.mode-toggle .ico-sun{display:none}
body.dark .mode-toggle .ico-moon{display:none}
body.dark .mode-toggle .ico-sun{display:block}

/* ── MOBILE RESPONSIVE ── */
@media(max-height:700px){
  #hud{gap:4px;margin:56px 10px 0}
  .hc{padding:7px 10px 5px;border-radius:12px}
  .hud-val{font-size:22px}
  .lvl-name{font-size:11px}
  .lvl-sub{font-size:8px}
  .obj-pill{font-size:9px;padding:2px 6px 2px 3px}

  #pbar{margin-bottom:2px}
  #bwrap{padding:0 4px}
  #board{border-radius:20px}
}
@media(max-height:600px){
  #hud{gap:3px;margin:54px 8px 0}
  .hc{padding:5px 8px 4px;border-radius:10px}
  .hud-val{font-size:20px}
  .hud-lbl{font-size:7px}
  .ss-mascot{width:95px;height:95px;margin-bottom:12px;border-radius:24px}
  .ss-title{margin-bottom:2px;font-size:clamp(2.2rem,8vw,2.8rem)}
  .ss-sub{margin-bottom:8px;font-size:11px}
  .ss-divider{margin-bottom:10px}
  .ss-card{padding:14px 14px 10px;margin-bottom:14px;border-radius:16px}
  .ss-faces{gap:10px 8px}
  .ss-face{width:clamp(44px,12vw,54px)!important;height:clamp(44px,12vw,54px)!important}

  .ss-play,.ss-select{height:44px;min-height:44px;padding:0 14px;font-size:12px;letter-spacing:1.1px}
  .ov-card{padding:24px 20px 20px;border-radius:22px}
  .ov-mascot{width:60px;height:60px;margin-bottom:10px}

/* ── SMALL PHONE (iPhone SE, 320px) ── */
@media(max-width:360px){
  #hud{gap:3px;margin:52px 6px 0}
  .hc{padding:6px 8px 4px;border-radius:10px}
  .hud-val{font-size:20px}
  .hud-lbl{font-size:7px;letter-spacing:1.5px}
  .lvl-name{font-size:10px}
  .lvl-sub{font-size:7px;max-width:100px}
  .obj-pill{font-size:8px;padding:2px 5px 2px 3px}
  .obj-dot{width:7px;height:7px}
  .ss-title{font-size:clamp(2rem,9vw,3rem)}

/* ── LANDSCAPE ORIENTATION ── */
@media(orientation:landscape) and (max-height:500px){

  .hc{padding:4px 8px 3px;border-radius:8px}

  .hud-lbl{font-size:6px}
  .lvl-name{font-size:9px}
  .lvl-sub{display:none}
  .obj-pill{font-size:8px;padding:1px 5px 1px 2px}

  #board{border-radius:16px}

  .ss-title{font-size:clamp(1.8rem,6vw,2.4rem);margin-bottom:4px}
  .ss-sub{font-size:10px;margin-bottom:4px}

  .ss-faces{gap:6px 4px}

  .ov-mascot{width:48px;height:48px;margin-bottom:6px;border-radius:12px}

/* ── VERY SHORT LANDSCAPE (ultra-compact) ── */
@media(orientation:landscape) and (max-height:380px){
  #hud{margin:52px 4px 0}
  .hc{padding:3px 6px 2px}
  .hud-val{font-size:16px}
  .ss-content{transform:scale(.85);transform-origin:center top}
}
/* ── URGENCY STATES ── */
.moves-warn .hud-val.accent{animation:warnPulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,94,148,.3))}
.moves-critical .hud-val.accent{animation:critPulse .6s ease-in-out infinite;font-size:38px!important;filter:drop-shadow(0 0 16px rgba(255,40,40,.5))}
.moves-critical .hc.hr{animation:cardShake .4s ease-in-out infinite;border-color:rgba(255,60,60,.3)!important;background:rgba(255,60,60,.06)!important}
@keyframes warnPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
@keyframes critPulse{0%,100%{transform:scale(1);color:var(--accent)}50%{transform:scale(1.18);filter:drop-shadow(0 0 20px rgba(255,30,30,.6))}}
@keyframes cardShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.score-bump{animation:scoreBump .3s cubic-bezier(.16,1,.3,1)}
@keyframes scoreBump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ── SCREEN FLASH ── */
#screenFlash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;transition:none;mix-blend-mode:screen}

/* ── CHAIN COUNTER ── */
#chainCounter{position:absolute;top:-8px;left:50%;transform:translateX(-50%) scale(0);z-index:25;
font-size:16px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:6px 18px;
border-radius:999px;white-space:nowrap;pointer-events:none;
background:linear-gradient(135deg,rgba(255,94,148,.9),rgba(255,48,112,.9));color:#fff;
box-shadow:0 4px 24px rgba(255,94,148,.5),0 0 40px rgba(255,94,148,.2),inset 0 1px 0 rgba(255,255,255,.3);
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s ease}
#chainCounter.show{transform:translateX(-50%) scale(1)}
#chainCounter.mega{font-size:20px;background:linear-gradient(135deg,rgba(255,215,0,.95),rgba(255,170,0,.95));
box-shadow:0 4px 32px rgba(255,215,0,.6),0 0 60px rgba(255,215,0,.25),inset 0 1px 0 rgba(255,255,255,.4);
animation:megaPulse .5s ease-in-out infinite alternate}
@keyframes megaPulse{0%{transform:translateX(-50%) scale(1)}100%{transform:translateX(-50%) scale(1.08);filter:brightness(1.15)}}

/* ── ENHANCED COMBO POPUPS ── */
.cpop{font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.cpop.t2{font-size:36px;animation:cpA2 1.1s cubic-bezier(.16,1,.3,1) forwards}
.cpop.t3{font-size:48px;animation:cpA3 1.3s cubic-bezier(.16,1,.3,1) forwards}
@keyframes cpA2{0%{opacity:0;transform:translateX(-50%) scale(.2) translateY(20px) rotate(-5deg)}
10%{opacity:1;transform:translateX(-50%) scale(1.5) translateY(-15px) rotate(2deg)}
25%{transform:translateX(-50%) scale(.9) translateY(-25px)}
40%{transform:translateX(-50%) scale(1.1) translateY(-30px)}
100%{opacity:0;transform:translateX(-50%) scale(.7) translateY(-90px)}}
@keyframes cpA3{0%{opacity:0;transform:translateX(-50%) scale(.1) translateY(30px)}
8%{opacity:1;transform:translateX(-50%) scale(1.8) translateY(-20px)}
18%{transform:translateX(-50%) scale(.85) translateY(-30px)}
28%{transform:translateX(-50%) scale(1.15) translateY(-35px)}
100%{opacity:0;transform:translateX(-50%) scale(.6) translateY(-110px)}}

/* ── CONFETTI ── */
.confetti-piece{position:fixed;width:10px;height:10px;pointer-events:none;z-index:55;will-change:transform}

/* ── INVALID SWAP FLASH ── */
@keyframes invalidFlash{0%{box-shadow:inset 0 0 0 3px rgba(255,60,60,.5)}50%{box-shadow:inset 0 0 30px rgba(255,60,60,.2)}100%{box-shadow:inset 0 0 0 0 transparent}}
.invalid-flash{animation:invalidFlash .35s ease-out}

/* Desktop hover states */
@media(hover:hover){
  .back-link:hover{border-color:rgba(255,94,148,.3);color:var(--accent);background:rgba(255,94,148,.06)}
  .btn-primary:hover{background:linear-gradient(135deg,#FF7DAE,#FF96C0);transform:translateY(-3px);
  box-shadow:0 12px 36px rgba(255,94,148,.45),0 4px 12px rgba(255,94,148,.2)}
  .btn-outline:hover{border-color:rgba(255,94,148,.3);color:var(--accent);background:rgba(255,94,148,.06)}
  .mode-toggle:hover{border-color:rgba(255,94,148,.3);color:var(--accent)}
  .sound-toggle:hover{border-color:rgba(255,94,148,.3);color:var(--accent)}
  .home-btn:hover{border-color:rgba(255,94,148,.3);color:var(--accent)}
  .ss-play:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 48px rgba(255,94,148,.55),0 0 0 6px rgba(255,94,148,.1)}
  .ss-select:hover{border-color:rgba(255,94,148,.3);color:var(--accent);background:rgba(255,94,148,.08)}
  .ss-mascot:hover{transform:translateY(-6px) scale(1.05) rotate(-2deg)}
  .ov-mascot:hover{transform:translateY(-4px) scale(1.05)}
  .ss-face-wrap:hover .ss-face{transform:scale(1.1);box-shadow:0 8px 28px rgba(0,0,0,.12),0 0 20px rgba(255,94,148,.1)}
}

/* ── OVERLAY ENTRANCE ANIMATIONS ── */
@keyframes cardEnter{0%{transform:translateY(50px) scale(.8);opacity:0}
55%{transform:translateY(-10px) scale(1.03);opacity:1}
80%{transform:translateY(3px) scale(.99)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes titleReveal{0%{transform:scale(.5);opacity:0;filter:blur(8px)}
40%{transform:scale(1.15);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
.ov:not(.hidden) .ov-card{animation:cardEnter .55s cubic-bezier(.16,1,.3,1) both}
.ov:not(.hidden) .ss-content{animation:cardEnter .55s cubic-bezier(.16,1,.3,1) both}
.ov:not(.hidden) .ov-title{animation:titleReveal .6s cubic-bezier(.16,1,.3,1) .15s both}
.ov:not(.hidden) .ov-mascot{animation:cardEnter .45s cubic-bezier(.34,1.56,.64,1) .05s both}
.ov:not(.hidden) .stars-row{animation:cardEnter .4s cubic-bezier(.16,1,.3,1) .35s both}
.ov:not(.hidden) .stat-row{animation:cardEnter .4s ease-out .45s both}
.ov:not(.hidden) .btn-row{animation:cardEnter .4s ease-out .55s both}

/* ── TILE PRESS SQUISH ── */
@keyframes tileSquish{0%{transform:scale(1)}50%{transform:scale(.88)}100%{transform:scale(1)}}

/* ── LOW MOVES BOARD EFFECTS ── */
.moves-critical #board{border-color:rgba(255,60,60,.2)!important}
.moves-critical #board::before{background:conic-gradient(from var(--board-glow-angle,0deg),rgba(255,50,50,.45),rgba(255,94,148,.3),rgba(255,50,50,.45),rgba(255,94,148,.3),rgba(255,50,50,.45))!important;
animation:boardGlowSpin 2s linear infinite!important;opacity:1!important}

/* ── SCREEN VIGNETTE FOR LOW MOVES ── */
#movesVignette{position:fixed;inset:0;pointer-events:none;z-index:44;opacity:0;transition:opacity .4s ease;
background:radial-gradient(ellipse at center,transparent 55%,rgba(255,30,30,.12) 100%)}
.moves-warn #movesVignette{opacity:.5}
.moves-critical #movesVignette{opacity:1;animation:vigPulse 1.2s ease-in-out infinite}
@keyframes vigPulse{0%,100%{opacity:.8}50%{opacity:1}}

/* ── ENHANCED SCORE BUMP ── */
.score-pop{animation:scorePop .35s cubic-bezier(.16,1,.3,1)}
@keyframes scorePop{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
</style>

<script>
// ─── PARTICLE GRID (desktop only) ───
(function(){
if(window.innerWidth<768||window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const cv=document.getElementById('pgrid'),cx=cv.getContext('2d');
let W,H,pts=[],mx=-1e3,my=-1e3;
const SP=50,PR=1.5,PUSH=150,STR=1.2,RET=.05,CONN=80;
function rz(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;pts=[];
for(let x=SP/2;x<W;x+=SP)for(let y=SP/2;y<H;y+=SP)pts.push({ox:x,oy:y,x,y,vx:0,vy:0})}
function draw(){cx.clearRect(0,0,W,H);const pc='255,107,157';
pts.forEach(p=>{const dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
if(d<PUSH&&d>0){const f=(PUSH-d)/PUSH;p.vx-=(dx/d)*f*STR;p.vy-=(dy/d)*f*STR}
p.vx+=(p.ox-p.x)*RET;p.vy+=(p.oy-p.y)*RET;p.vx*=.9;p.vy*=.9;p.x+=p.vx;p.y+=p.vy;
const disp=Math.sqrt((p.ox-p.x)**2+(p.oy-p.y)**2),a=Math.min(.1+disp*.015,.35);
cx.beginPath();cx.arc(p.x,p.y,PR,0,Math.PI*2);cx.fillStyle=`rgba(${pc},${a})`;cx.fill()});
cx.lineWidth=.5;
for(let i=0;i<pts.length;i++){const a=pts[i],da=Math.sqrt((mx-a.x)**2+(my-a.y)**2);if(da>PUSH*1.2)continue;
for(let j=i+1;j<pts.length;j++){const b=pts[j],d2=Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);
if(d2<CONN){cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.strokeStyle=`rgba(${pc},${(1-d2/CONN)*.12})`;cx.stroke()}}}
requestAnimationFrame(draw)}
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
document.addEventListener('mouseleave',()=>{mx=-1e3;my=-1e3});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(rz,150)});rz();draw()
})();

// ─── AMBIENT BACKGROUND — layered orbs + mesh gradient + light rays ───
(function(){
const cv=document.getElementById('ambientBg'),cx=cv.getContext('2d');
let W,H;
// 7 primary orbs — HSL-based with slow hue cycling
const orbs=[
  {x:.18,y:.12,r:.55, h:330,s:80,l:78, sx:.00007,sy:.00006, ph:0,   phy:0,   hr:.4},
  {x:.82,y:.88,r:.50, h:210,s:75,l:82, sx:.00006,sy:.00008, ph:2.1, phy:1.3, hr:.6},
  {x:.50,y:.40,r:.48, h:48, s:85,l:85, sx:.00009,sy:.00005, ph:4.2, phy:2.8, hr:.3},
  {x:.08,y:.72,r:.46, h:270,s:70,l:78, sx:.00005,sy:.00009, ph:1.1, phy:0.5, hr:.5},
  {x:.88,y:.22,r:.42, h:160,s:65,l:80, sx:.00007,sy:.00007, ph:3.3, phy:3.1, hr:.7},
  {x:.40,y:.92,r:.40, h:350,s:75,l:82, sx:.00008,sy:.00006, ph:5.5, phy:4.2, hr:.4},
  {x:.65,y:.15,r:.44, h:190,s:70,l:80, sx:.00006,sy:.00008, ph:2.5, phy:3.7, hr:.55},
];
// 5 small accent orbs — brighter, faster, punchier
const accents=[
  {x:.3, y:.2, r:.18, h:340,s:90,l:72, sx:.00018,sy:.00015, ph:0.5, phy:1.2, hr:1.2},
  {x:.7, y:.7, r:.16, h:200,s:85,l:75, sx:.00015,sy:.00019, ph:2.0, phy:0.8, hr:1.0},
  {x:.5, y:.6, r:.14, h:280,s:80,l:70, sx:.00020,sy:.00014, ph:3.7, phy:2.5, hr:1.5},
  {x:.15,y:.5, r:.15, h:30, s:90,l:78, sx:.00016,sy:.00017, ph:1.8, phy:3.3, hr:0.9},
  {x:.85,y:.4, r:.13, h:160,s:85,l:72, sx:.00019,sy:.00013, ph:4.1, phy:1.7, hr:1.3},
];
// 4 rotating light rays
const rays=[
  {a:0,    w:.08,  sp:.00008, c:'340,80%'},
  {a:1.57, w:.06,  sp:.00006, c:'220,70%'},
  {a:3.14, w:.07,  sp:.00007, c:'270,65%'},
  {a:4.71, w:.05,  sp:.00009, c:'50,75%'},
];
function rz(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function hsl(h,s,l,a){return'hsla('+((h%360+360)%360)+','+s+'%,'+l+'%,'+a+')'}
function drawOrb(o,t,dk,isAccent){
  const bx=W*(o.x+Math.sin(t*o.sx+o.ph)*.22+Math.sin(t*o.sx*.37+o.ph*2.7)*.09+Math.cos(t*o.sx*.19+o.ph*1.3)*.05);
  const by=H*(o.y+Math.cos(t*o.sy*.57+o.phy)*.18+Math.sin(t*o.sy*.31+o.phy*1.9)*.08+Math.cos(t*o.sy*.15+o.phy*2.1)*.04);
  const wobble=1+Math.sin(t*o.sx*1.4+o.ph*3)*.12+Math.sin(t*o.sx*2.3+o.ph)*.06;
  const br=Math.min(W,H)*o.r*wobble;
  const hue=o.h+t*o.hr*.003; // slow hue drift
  const sat=dk?o.s*.7:o.s;
  const lit=dk?o.l*.35:o.l;
  const a0=isAccent?(dk?.3:.55):(dk?.22:.45);
  const a1=isAccent?(dk?.15:.3):(dk?.10:.2);
  const a2=isAccent?(dk?.04:.08):(dk?.03:.06);
  const g=cx.createRadialGradient(bx,by,0,bx,by,br);
  g.addColorStop(0,hsl(hue,sat,lit+8,a0));
  g.addColorStop(.25,hsl(hue,sat,lit,a1));
  g.addColorStop(.6,hsl(hue+10,sat*.8,lit-5,a2));
  g.addColorStop(1,hsl(hue,sat,lit,0));
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
}
function draw(t){
  requestAnimationFrame(draw);
  const dk=document.body.classList.contains('dark');
  // Base fill
  cx.globalCompositeOperation='source-over';
  cx.fillStyle=dk?'#0a0812':'#f9f4ff';
  cx.fillRect(0,0,W,H);
  // Primary orbs — additive in dark mode for aurora
  cx.globalCompositeOperation=dk?'screen':'source-over';
  for(let i=0;i<orbs.length;i++) drawOrb(orbs[i],t,dk,false);
  // Accent orbs — same blending
  for(let i=0;i<accents.length;i++) drawOrb(accents[i],t,dk,true);
  // Light rays — overlay blend for subtle streaks
  cx.globalCompositeOperation='overlay';
  const diag=Math.sqrt(W*W+H*H);
  for(let i=0;i<rays.length;i++){
    const r=rays[i];
    const angle=r.a+t*r.sp+Math.sin(t*.00003+i*2)*.4;
    const rw=diag*r.w;
    cx.save();cx.translate(W/2,H/2);cx.rotate(angle);
    const lg=cx.createLinearGradient(-rw,0,rw,0);
    const ra=dk?.06:.04;
    lg.addColorStop(0,'hsla('+r.c+',90%,0)');
    lg.addColorStop(.3,'hsla('+r.c+',90%,'+ra+')');
    lg.addColorStop(.5,'hsla('+r.c+',95%,'+(ra*1.8)+')');
    lg.addColorStop(.7,'hsla('+r.c+',90%,'+ra+')');
    lg.addColorStop(1,'hsla('+r.c+',90%,0)');
    cx.fillStyle=lg;
    cx.fillRect(-rw,-diag,rw*2,diag*2);
    cx.restore();
  }
  // Mesh noise layer — subtle perlin-like color variation
  cx.globalCompositeOperation=dk?'screen':'overlay';
  const meshT=t*.0001;
  for(let i=0;i<3;i++){
    const mx=W*(.3+Math.sin(meshT*1.3+i*2.09)*.35);
    const my=H*(.3+Math.cos(meshT*1.7+i*2.09)*.35);
    const mr=Math.min(W,H)*(.25+Math.sin(meshT*2.1+i)*.08);
    const mh=(120*i+t*.005)%360;
    const mg=cx.createRadialGradient(mx,my,0,mx,my,mr);
    mg.addColorStop(0,hsl(mh,60,dk?30:85,dk?.08:.06));
    mg.addColorStop(1,hsl(mh,60,dk?30:85,0));
    cx.fillStyle=mg;cx.fillRect(0,0,W,H);
  }
  cx.globalCompositeOperation='source-over';
}
let rt2;window.addEventListener('resize',()=>{clearTimeout(rt2);rt2=setTimeout(rz,150)});
rz();requestAnimationFrame(draw);
})();

// ─── AUDIO ENGINE (Web Audio API synth) ───
const SFX=(()=>{
let ac=null,muted=localStorage.getItem('emocrush-mute')==='1';
const ctx=()=>{if(muted)return null;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
function tone(f,dur,type='sine',vol=.12,dl=0){
  try{const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,c.currentTime+dl);
  g.gain.setValueAtTime(vol,c.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dl+dur);
  o.connect(g);g.connect(c.destination);o.start(c.currentTime+dl);o.stop(c.currentTime+dl+dur)}catch(e){}}
function noise(dur,vol=.05,dl=0){
  try{const c=ctx();if(!c)return;const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
  s.buffer=b;f.type='bandpass';f.frequency.value=3000;f.Q.value=.5;
  g.gain.setValueAtTime(vol,c.currentTime+dl);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dl+dur);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+dl);s.stop(c.currentTime+dl+dur)}catch(e){}}
return{
  select(){tone(1200,.04,'sine',.06);noise(.03,.02)},
  swap(){tone(500,.08,'sine',.09);tone(700,.08,'sine',.07,.04)},
  invalid(){tone(220,.12,'square',.05);tone(180,.12,'square',.05,.07)},
  match(combo=1){const b=500+Math.min(combo,8)*70;
    tone(b,.1,'sine',.1);tone(b*1.25,.1,'sine',.07,.03);tone(b*1.5,.12,'sine',.05,.06);
    if(combo>=3)noise(.06,.03,.04)},
  combo(lv){const b=600+Math.min(lv,10)*50;
    for(let i=0;i<Math.min(lv+2,7);i++)tone(b+i*90,.14,'sine',Math.max(.02,.09-i*.01),i*.05);
    if(lv>=4){noise(.08,.04,.1);tone(b*2,.2,'sine',.04,.15)}},
  special(){[0,.04,.08,.12,.16].forEach((d,i)=>tone(900+i*180,.18,'sine',.07,d));noise(.05,.03,.1)},
  win(){const n=[523,659,784,1047,784,1047,1319,1568];
    n.forEach((f,i)=>tone(f,.3,'sine',.11,i*.1));
    tone(1568,.6,'sine',.06,n.length*.1);noise(.08,.03,.2)},
  lose(){[380,320,270,220].forEach((f,i)=>tone(f,.35,'triangle',.08,i*.14));tone(180,.5,'sine',.04,.6)},
  click(){tone(800,.03,'sine',.05);noise(.02,.015)},
  levelStart(){tone(440,.12,'sine',.08);tone(554,.12,'sine',.06,.08);tone(659,.15,'sine',.08,.16);noise(.04,.02,.2)},
  toggle(){muted=!muted;localStorage.setItem('emocrush-mute',muted?'1':'0');return muted},
  get muted(){return muted},
}})();
function haptic(ms=12){try{navigator.vibrate(ms)}catch(e){}}

function gLv(n){if(n<LVS.length)return LVS[n];
  const d=n-LVS.length,mv=Math.max(10,15-Math.floor(d/5)),m=n%3;
  if(m===0){const s=10000+d*1200;return{mv,goal:{t:'score',n:s},st:[s,Math.round(s*1.5),Math.round(s*2.2)]}}
  if(m===1){const e=n%NT,c=40+d*2;return{mv,goal:{t:'clear',e,n:c},st:[Math.round(c*80),Math.round(c*140),Math.round(c*210)]}}
  const e1=n%NT,e2=(n+2)%NT,ct=28+d*2;return{mv,goal:{t:'multi',ts:[{e:e1,n:ct},{e:e2,n:ct}]},st:[Math.round(ct*120),Math.round(ct*200),Math.round(ct*300)]}}

// PROGRESS PERSISTENCE
// ═══════════════════════════════════════════════════════
function loadProgress(){
  try{const d=JSON.parse(localStorage.getItem('emocrush-progress'));
    return d&&typeof d.maxLevel==='number'?d:{maxLevel:0,stars:{}}
  }catch(e){return{maxLevel:0,stars:{}}}}
function saveProgress(lvl,stars){
  const p=loadProgress();
  p.maxLevel=Math.max(p.maxLevel,lvl+1);
  if(!p.stars[lvl]||stars>p.stars[lvl])p.stars[lvl]=stars;
  localStorage.setItem('emocrush-progress',JSON.stringify(p))}
function getTotalStars(){const p=loadProgress();let t=0;for(const k in p.stars)t+=p.stars[k];return t}

// Each takes (ctx, radius, time, gridRow, gridCol)

function drawHeart(c,cx,cy,s){
  c.save();c.translate(cx,cy);
  const w=s*.5,h=s*.5;
  c.beginPath();c.moveTo(0,h);
  c.bezierCurveTo(-w*.3,h*.55,-w,h*.15,-w,-h*.25);
  c.bezierCurveTo(-w,-h*.7,0,-h*.75,0,-h*.2);
  c.bezierCurveTo(0,-h*.75,w,-h*.7,w,-h*.25);
  c.bezierCurveTo(w,h*.15,w*.3,h*.55,0,h);
  c.closePath();c.restore();
}

// Utility: smooth 0→1→0 pulse within a repeating cycle
function aPulse(t,period,onset,dur){
  const cy=t%period;if(cy<onset||cy>onset+dur)return 0;
  const p=(cy-onset)/dur;return p<.3?p/.3:p>.7?(1-p)/.3:1;
}

// ── HAPPY: joyful squinty eyes, rosy cheeks, beaming smile, occasional sparkle ──
function animHappy(c,r,t,row,col){
  const dk='rgba(70,40,0,.8)',ph=row*7+col*13;
  c.lineCap='round';c.lineJoin='round';
  // Blink open periodically
  const eo=aPulse((t+ph*97)%4200,4200,3800,350);
  if(eo>.5){
    // Eyes wide open — bright, excited
    c.fillStyle='#fff';
    c.beginPath();c.arc(-r*.3,-r*.1,r*.14,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(r*.3,-r*.1,r*.14,0,Math.PI*2);c.fill();
    c.strokeStyle=dk;c.lineWidth=r*.045;
    c.beginPath();c.arc(-r*.3,-r*.1,r*.14,0,Math.PI*2);c.stroke();
    c.beginPath();c.arc(r*.3,-r*.1,r*.14,0,Math.PI*2);c.stroke();
    // Pupils look slightly up (excited)
    c.fillStyle=dk;
    c.beginPath();c.arc(-r*.3,-r*.13,r*.06,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(r*.3,-r*.13,r*.06,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(255,255,255,.65)';
    c.beginPath();c.arc(-r*.27,-r*.16,r*.025,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(r*.33,-r*.16,r*.025,0,Math.PI*2);c.fill();
  } else {
    // Squinty happy eyes — upward arcs
    const sq=Math.sin(t*.003+ph)*.015;
    c.strokeStyle=dk;c.lineWidth=r*.12;
    c.beginPath();c.arc(-r*.3,-r*.1,r*(.15+sq),Math.PI*.85,Math.PI*.15,true);c.stroke();
    c.beginPath();c.arc(r*.3,-r*.1,r*(.15+sq),Math.PI*.85,Math.PI*.15,true);c.stroke();
  }
  // Rosy cheeks — warm pulse
  const ca=.2+Math.sin(t*.003+ph)*.08;
  c.fillStyle=`rgba(255,110,70,${ca})`;
  c.beginPath();c.arc(-r*.5,r*.12,r*.15,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(r*.5,r*.12,r*.15,0,Math.PI*2);c.fill();
  // Big beaming smile with thickness
  const sw=r*(.34+Math.sin(t*.002+ph*.7)*.02);
  c.strokeStyle=dk;c.lineWidth=r*.1;
  c.beginPath();c.moveTo(-sw,r*.25);c.quadraticCurveTo(0,r*.58,sw,r*.25);c.stroke();
  // Tongue peek
  c.fillStyle='rgba(255,120,130,.6)';
  c.beginPath();c.arc(0,r*.4,r*.08,0,Math.PI);c.fill();
  // Occasional sparkle near eye
  const spk=aPulse((t+ph*61)%5000,5000,4200,600);
  if(spk>.1){
    c.save();c.globalAlpha=spk*.7;c.strokeStyle='#fff';c.lineWidth=r*.04;
    const sx2=r*.5,sy2=-r*.3;
    c.beginPath();c.moveTo(sx2,sy2-r*.08);c.lineTo(sx2,sy2+r*.08);c.moveTo(sx2-r*.08,sy2);c.lineTo(sx2+r*.08,sy2);c.stroke();
    c.restore();
  }
}

// ── SAD: worried brows, dewy eyes, quivering frown, rolling tear ──
function animSad(c,r,t,row,col){
  const dk='rgba(15,35,75,.85)',ph=row*7+col*13;
  c.lineCap='round';c.lineJoin='round';
  // Worried brows — angled inward-up
  const bl=Math.sin(t*.002+ph)*.015;
  c.strokeStyle=dk;c.lineWidth=r*.08;
  c.beginPath();c.moveTo(-r*.48,-r*(.3+bl));c.lineTo(-r*.2,-r*(.42+bl));c.stroke();
  c.beginPath();c.moveTo(r*.48,-r*(.3+bl));c.lineTo(r*.2,-r*(.42+bl));c.stroke();
  // Blink
  const bk=aPulse((t+ph*83)%3500,3500,3200,250);
  if(bk>.5){
    c.strokeStyle=dk;c.lineWidth=r*.1;
    c.beginPath();c.moveTo(-r*.42,-r*.06);c.lineTo(-r*.14,-r*.06);c.stroke();
    c.beginPath();c.moveTo(r*.14,-r*.06);c.lineTo(r*.42,-r*.06);c.stroke();
  } else {
    // Dewy round eyes
    c.fillStyle='#fff';
    c.beginPath();c.arc(-r*.28,-r*.06,r*.14,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(r*.28,-r*.06,r*.14,0,Math.PI*2);c.fill();
    c.strokeStyle=dk;c.lineWidth=r*.04;
    c.beginPath();c.arc(-r*.28,-r*.06,r*.14,0,Math.PI*2);c.stroke();
    c.beginPath();c.arc(r*.28,-r*.06,r*.14,0,Math.PI*2);c.stroke();
    // Pupils — looking down-left (sad)
    const pd=Math.sin(t*.001+ph*.5)*r*.02;
    c.fillStyle=dk;
    c.beginPath();c.arc(-r*.3+pd,r*.0,r*.06,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(r*.26+pd,r*.0,r*.06,0,Math.PI*2);c.fill();
    // Dewy shine (bigger, more watery)
    c.fillStyle='rgba(255,255,255,.7)';
    c.beginPath();c.arc(-r*.24,-r*.12,r*.04,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(r*.32,-r*.12,r*.04,0,Math.PI*2);c.fill();
    // Extra wet shimmer at bottom of eyes
    c.fillStyle='rgba(150,210,255,.25)';
    c.beginPath();c.arc(-r*.28,r*.04,r*.1,0,Math.PI);c.fill();
    c.beginPath();c.arc(r*.28,r*.04,r*.1,0,Math.PI);c.fill();
  }
  // Quivering frown
  const fw=Math.sin(t*.004+ph)*.02;
  const fq=Math.sin(t*.012+ph)*r*.005; // tiny quiver
  c.strokeStyle=dk;c.lineWidth=r*.09;
  c.beginPath();c.moveTo(-r*.2+fq,r*(.36+fw));c.quadraticCurveTo(0,r*(.2-fw),r*.2-fq,r*(.36+fw));c.stroke();

  // ── Tear from right eye — smooth 3.5s cycle ──
  const tCyc=3500,tPh=(t+ph*137)%tCyc,tP=tPh/tCyc;
  const eyeX=r*.28,eyeBot=r*.08; // bottom of right eye
  if(tP<.12){
    // Phase 1: bead forms
    const g=tP/.12;
    c.fillStyle=`rgba(120,190,255,${.3+g*.55})`;
    c.beginPath();c.arc(eyeX,eyeBot+r*.02*g,r*.035*g,0,Math.PI*2);c.fill();
  } else if(tP<.5){
    // Phase 2: teardrop falls
    const g=(tP-.12)/.38;
    const dropY=eyeBot+r*.03+g*r*.5;
    const sz=r*(.045+g*.015);
    const alpha=.75-g*.3;
    // Thin glistening trail
    const trLen=Math.min(r*.15,g*r*.3);
    c.save();
    const tg=c.createLinearGradient(eyeX,dropY-trLen,eyeX,dropY);
    tg.addColorStop(0,`rgba(120,190,255,0)`);tg.addColorStop(1,`rgba(120,190,255,${alpha*.35})`);
    c.strokeStyle=tg;c.lineWidth=r*.02;
    c.beginPath();c.moveTo(eyeX,dropY-trLen);c.lineTo(eyeX,dropY);c.stroke();
    c.restore();
    // Teardrop
    c.fillStyle=`rgba(120,190,255,${alpha})`;
    c.beginPath();
    c.moveTo(eyeX,dropY-sz*2.2);
    c.quadraticCurveTo(eyeX+sz*1.4,dropY+sz*.2,eyeX,dropY+sz*1.6);
    c.quadraticCurveTo(eyeX-sz*1.4,dropY+sz*.2,eyeX,dropY-sz*2.2);
    c.closePath();c.fill();
    // Specular on tear
    c.fillStyle=`rgba(255,255,255,${alpha*.6})`;
    c.beginPath();c.arc(eyeX-sz*.3,dropY-sz*.8,sz*.22,0,Math.PI*2);c.fill();
  } else if(tP<.62){
    // Phase 3: fades away
    const g=(tP-.5)/.12;
    const alpha=.45*(1-g);
    c.fillStyle=`rgba(120,190,255,${alpha})`;
    c.beginPath();c.arc(eyeX,eyeBot+r*.55,r*.03*(1-g*.5),0,Math.PI*2);c.fill();
  }
}

// ── ANGRY: fierce V-brows, glaring slit eyes, gnashing teeth, rage shake ──
function animAngry(c,r,t,row,col){
  const dk='rgba(70,15,5,.9)',ph=row*7+col*13;
  c.lineCap='round';c.lineJoin='round';
  // Rage bursts every ~2.5s
  const shkCyc=2500,shkOn=aPulse((t+ph*53)%shkCyc,shkCyc,0,400);
  const shk=shkOn*Math.sin(t*.07+ph)*r*.05;
  c.save();c.translate(shk,shk*.3);
  // Red flush during rage
  if(shkOn>.05){
    c.fillStyle=`rgba(255,30,0,${shkOn*.08})`;
    c.beginPath();c.arc(0,0,r*.8,0,Math.PI*2);c.fill();
  }
  // V-brows — thick, angry, tighter during shake
  const bDip=shkOn*.06;
  c.strokeStyle=dk;c.lineWidth=r*.14;
  c.beginPath();c.moveTo(-r*.56,-r*.28);c.lineTo(-r*.16,-r*(.1-bDip));c.stroke();
  c.beginPath();c.moveTo(r*.56,-r*.28);c.lineTo(r*.16,-r*(.1-bDip));c.stroke();
  // Slit eyes — narrower during shake
  const slitH=r*(.06-shkOn*.015),slitW=r*.17;
  c.fillStyle='#fff';
  c.beginPath();c.ellipse(-r*.3,-r*.02,slitW,slitH,-.05,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(r*.3,-r*.02,slitW,slitH,.05,0,Math.PI*2);c.fill();
  c.strokeStyle=dk;c.lineWidth=r*.035;
  c.beginPath();c.ellipse(-r*.3,-r*.02,slitW,slitH,-.05,0,Math.PI*2);c.stroke();
  c.beginPath();c.ellipse(r*.3,-r*.02,slitW,slitH,.05,0,Math.PI*2);c.stroke();
  // Intense pupils — tiny, glaring
  c.fillStyle=dk;
  c.beginPath();c.arc(-r*.3,-r*.02,r*.045,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(r*.3,-r*.02,r*.045,0,Math.PI*2);c.fill();
  // Red glint in eyes
  c.fillStyle=`rgba(255,60,30,${.2+shkOn*.25})`;
  c.beginPath();c.arc(-r*.27,-r*.04,r*.02,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(r*.33,-r*.04,r*.02,0,Math.PI*2);c.fill();
  // Mouth — gritted teeth, opens during shake
  const mOpen=r*(.18+shkOn*.12);
  c.fillStyle='rgba(50,10,5,.7)';
  c.beginPath();
  c.moveTo(-r*.32,r*.2);c.lineTo(r*.32,r*.2);
  c.lineTo(r*.28,r*.2+mOpen);c.lineTo(-r*.28,r*.2+mOpen);
  c.closePath();c.fill();
  // Top teeth — jagged
  c.fillStyle='rgba(255,255,255,.92)';
  const tw2=r*.11;
  for(let i=-1;i<=1;i++){
    const tx2=-tw2*.5+i*tw2,tH=r*(.07+Math.abs(i)*.02);
    c.beginPath();c.moveTo(tx2,r*.2);c.lineTo(tx2+tw2*.85,r*.2);c.lineTo(tx2+tw2*.42,r*.2+tH);c.closePath();c.fill();
  }
  // Bottom teeth during rage
  if(shkOn>.2){
    const bth=r*.05*shkOn;
    for(let i=-1;i<=1;i++){
      const tx2=-tw2*.5+i*tw2;
      c.beginPath();c.moveTo(tx2,r*.2+mOpen);c.lineTo(tx2+tw2*.85,r*.2+mOpen);c.lineTo(tx2+tw2*.42,r*.2+mOpen-bth);c.closePath();c.fill();
    }
  }
  // Forehead vein during shake
  if(shkOn>.3){
    c.strokeStyle=`rgba(200,40,30,${shkOn*.35})`;c.lineWidth=r*.025;
    c.beginPath();c.moveTo(-r*.15,-r*.42);c.lineTo(-r*.08,-r*.5);c.lineTo(-r*.02,-r*.44);c.stroke();
  }
  c.restore();
}

// ── LOVE: heart eyes with lub-dub heartbeat, dreamy sway, blush, floating hearts ──
function animLove(c,r,t,row,col){
  const dk='rgba(80,10,40,.8)',ph=row*7+col*13;
  c.lineCap='round';c.lineJoin='round';
  // Heartbeat: lub-dub pattern
  const hbT=(t*.001*Math.PI*2/1.2+ph)%(Math.PI*2);
  const thump1=Math.pow(Math.max(0,Math.sin(hbT)),8);
  const thump2=Math.pow(Math.max(0,Math.sin(hbT+.8)),10)*.6;
  const beat=1+(thump1+thump2)*.3;
  // Dreamy sway
  const sway=Math.sin(t*.0015+ph)*.025;
  c.save();c.rotate(sway);
  // Heart eyes — vibrant, pulsing
  const hFill=`rgba(230,35,85,${.75+thump1*.15})`;
  c.fillStyle=hFill;
  drawHeart(c,-r*.3,-r*.13,r*.6*beat);c.fill();
  drawHeart(c,r*.3,-r*.13,r*.6*beat);c.fill();

  // Floating mini heart — rises from top

    c.restore();
  }
  c.restore();
}

function drawSp(c,sp,r,d,pad){
  c.save();c.lineCap='round';
  if(sp===1){ // Line blast: cross lines with layered glow (no shadowBlur)
    const e=pad*.9;
    // Wide soft glow
    c.globalAlpha=.15;c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=7*d;
    c.beginPath();c.moveTo(-e,0);c.lineTo(e,0);c.moveTo(0,-e);c.lineTo(0,e);c.stroke();
    // Mid glow
    c.globalAlpha=.35;c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=3.5*d;
    c.beginPath();c.moveTo(-e,0);c.lineTo(e,0);c.moveTo(0,-e);c.lineTo(0,e);c.stroke();
    // Core crisp line
    c.globalAlpha=.7;c.strokeStyle='#fff';c.lineWidth=1.5*d;
    c.beginPath();c.moveTo(-e,0);c.lineTo(e,0);c.moveTo(0,-e);c.lineTo(0,e);c.stroke();
    // Diamond center accent
    c.globalAlpha=.8;c.fillStyle='#fff';
    c.beginPath();c.moveTo(0,-pad*.12);c.lineTo(pad*.12,0);c.lineTo(0,pad*.12);c.lineTo(-pad*.12,0);c.closePath();c.fill()}
  else if(sp===2){ // Bomb: concentric rings with layered glow
    // Wide outer glow
    c.globalAlpha=.1;c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=5*d;
    c.beginPath();c.arc(0,0,pad*.8,0,Math.PI*2);c.stroke();
    // Primary ring
    c.globalAlpha=.4;c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=1.5*d;
    c.beginPath();c.arc(0,0,pad*.55,0,Math.PI*2);c.stroke();
    // Secondary ring
    c.globalAlpha=.25;c.lineWidth=1*d;
    c.beginPath();c.arc(0,0,pad*.8,0,Math.PI*2);c.stroke();
    // Center dot with soft halo
    c.globalAlpha=.25;c.fillStyle='#fff';
    c.beginPath();c.arc(0,0,r*.12,0,Math.PI*2);c.fill();
    c.globalAlpha=.8;c.fillStyle='#fff';
    c.beginPath();c.arc(0,0,r*.05,0,Math.PI*2);c.fill()}
  else if(sp===3){ // Color bomb: rainbow border with shimmer
    const rg=c.createConicGradient(0,0,0);
    rg.addColorStop(0,'#FF6B9D');rg.addColorStop(.17,'#ffd700');rg.addColorStop(.33,'#4AABEF');
    rg.addColorStop(.5,'#FF60A0');rg.addColorStop(.67,'#3CC49E');rg.addColorStop(.83,'#9A7AFF');rg.addColorStop(1,'#FF6B9D');
    const br=pad*.05;
    // Outer rainbow glow
    c.lineWidth=5*d;c.globalAlpha=.15;c.strokeStyle=rg;
    rr(c,-pad+br,-pad+br,pad*2-br*2,pad*2-br*2,pad*.22);c.stroke();
    // Core rainbow border
    c.lineWidth=2*d;c.globalAlpha=.65;
    rr(c,-pad+br,-pad+br,pad*2-br*2,pad*2-br*2,pad*.22);c.stroke();
    // Inner white shimmer
    c.lineWidth=.7*d;c.globalAlpha=.3;c.strokeStyle='rgba(255,255,255,.6)';
    const br2=pad*.1;rr(c,-pad+br2,-pad+br2,pad*2-br2*2,pad*2-br2*2,pad*.2);c.stroke()}
  c.restore();
}

let gemCvs=[],gemSz=48,gemPad=0,dpr=1,boardBg;

function rr(c,x,y,w,h,rd){c.beginPath();c.moveTo(x+rd,y);c.arcTo(x+w,y,x+w,y+h,rd);c.arcTo(x+w,y+h,x,y+h,rd);c.arcTo(x,y+h,x,y,rd);c.arcTo(x,y,x+w,y,rd);c.closePath()}

function prerenderGems(logSz){
  gemSz=logSz;gemCvs=[];
  const pad=Math.round(logSz*dpr*.22); // extra padding for richer shadow/glow bleed
  const sz=Math.round(logSz*dpr)+pad*2;
  gemPad=pad;
  const tileArea=Math.round(logSz*dpr);
  const margin=Math.round(tileArea*.07);
  const ts=tileArea-margin*2;
  const cr=ts*.26; // slightly rounder corners for premium candy feel

  for(let t=0;t<NT;t++){gemCvs[t]={};
    for(const sp of[0,1,2,3]){
      const cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
      const c=cv.getContext('2d'),g=GEMS[t];
      const tx=pad+margin,ty=pad+margin;
      const cx=tx+ts/2,cy=ty+ts/2;

      // ── L0: Colored ambient halo — warm glow surrounding the tile ──
      c.save();c.globalAlpha=.28;
      const ah=c.createRadialGradient(cx,cy+2*dpr,ts*.15,cx,cy+2*dpr,ts*.75);
      ah.addColorStop(0,g.bg2);ah.addColorStop(.35,g.bg2);ah.addColorStop(.65,g.bg3);ah.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=ah;c.fillRect(tx-ts*.25,ty-ts*.2,ts*1.5,ts*1.5);c.restore();

      // ── L1: Drop shadow — soft dark with color hint ──
      c.save();c.globalAlpha=.2;
      const ds=c.createRadialGradient(cx,cy+3*dpr,ts*.2,cx,cy+4*dpr,ts*.62);
      ds.addColorStop(0,'rgba(0,0,0,.5)');ds.addColorStop(.4,'rgba(0,0,0,.2)');
      ds.addColorStop(.75,'rgba(0,0,0,.06)');ds.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=ds;c.fillRect(tx-ts*.15,ty-ts*.05,ts*1.3,ts*1.3);
      // Color tint in shadow
      c.globalAlpha=.06;
      const dsc=c.createRadialGradient(cx,cy+3*dpr,0,cx,cy+3*dpr,ts*.5);
      dsc.addColorStop(0,g.bg3);dsc.addColorStop(.6,g.bg3);dsc.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=dsc;c.fillRect(tx-ts*.1,ty,ts*1.2,ts*1.2);c.restore();

      // ── L2: Tile body — rich 7-stop diagonal gradient ──
      c.save();rr(c,tx,ty,ts,ts,cr);
      const gr=c.createLinearGradient(tx+ts*.08,ty,tx+ts*.22,ty+ts);
      gr.addColorStop(0,g.bg1);gr.addColorStop(.1,g.bg1);gr.addColorStop(.28,g.bg2);
      gr.addColorStop(.5,g.bg2);gr.addColorStop(.72,g.bg3);
      gr.addColorStop(.9,g.bg4||g.bg3);gr.addColorStop(1,g.bg4||g.bg3);
      c.fillStyle=gr;c.fill();c.restore();

      // ── L3: Subsurface scattering — warm translucent inner glow ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();c.globalAlpha=.22;
      const sss=c.createRadialGradient(cx-ts*.06,cy-ts*.1,0,cx,cy,ts*.58);
      sss.addColorStop(0,g.bg1);sss.addColorStop(.3,g.bg1);
      sss.addColorStop(.6,'rgba(255,255,255,.04)');sss.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=sss;c.fillRect(tx,ty,ts,ts);c.restore();

      // ── L4: Ambient occlusion — darkened edges for 3D pillow effect ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();
      const ao=c.createRadialGradient(cx-ts*.05,cy-ts*.08,ts*.25,cx,cy,ts*.56);
      ao.addColorStop(0,'rgba(0,0,0,0)');ao.addColorStop(.6,'rgba(0,0,0,0)');
      ao.addColorStop(.82,'rgba(0,0,0,.06)');ao.addColorStop(1,'rgba(0,0,0,.14)');
      c.fillStyle=ao;c.fillRect(tx,ty,ts,ts);c.restore();

      // ── L5: Central radiance — bright inner area ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();
      const ir=c.createRadialGradient(cx-ts*.08,cy-ts*.12,0,cx,cy,ts*.55);
      ir.addColorStop(0,'rgba(255,255,255,.3)');ir.addColorStop(.12,'rgba(255,255,255,.2)');
      ir.addColorStop(.35,'rgba(255,255,255,.08)');ir.addColorStop(.65,'rgba(255,255,255,.02)');
      ir.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=ir;c.fillRect(tx,ty,ts,ts);c.restore();

      // ── L6: Glass sheen — frosted top highlight with curved falloff ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();
      const gh=c.createLinearGradient(tx,ty,tx,ty+ts*.52);
      gh.addColorStop(0,'rgba(255,255,255,.72)');gh.addColorStop(.03,'rgba(255,255,255,.58)');
      gh.addColorStop(.1,'rgba(255,255,255,.35)');gh.addColorStop(.2,'rgba(255,255,255,.18)');
      gh.addColorStop(.38,'rgba(255,255,255,.06)');gh.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=gh;c.fillRect(tx,ty,ts,ts*.52);
      // Curved glass edge — soft elliptical highlight at sheen boundary
      const ge=c.createRadialGradient(cx,ty+ts*.35,ts*.08,cx,ty+ts*.35,ts*.42);
      ge.addColorStop(0,'rgba(255,255,255,.08)');ge.addColorStop(.5,'rgba(255,255,255,.03)');
      ge.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=ge;c.fillRect(tx,ty+ts*.15,ts,ts*.35);c.restore();

      // ── L7: Specular crescent — sharp arc highlight near top ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();c.globalAlpha=.5;
      c.beginPath();c.ellipse(cx-ts*.04,ty+ts*.13,ts*.28,ts*.07,-.08,0,Math.PI,true);
      const scg=c.createLinearGradient(cx-ts*.32,ty+ts*.06,cx+ts*.24,ty+ts*.2);
      scg.addColorStop(0,'rgba(255,255,255,0)');scg.addColorStop(.2,'rgba(255,255,255,.45)');
      scg.addColorStop(.5,'rgba(255,255,255,.85)');scg.addColorStop(.8,'rgba(255,255,255,.45)');
      scg.addColorStop(1,'rgba(255,255,255,0)');
      c.strokeStyle=scg;c.lineWidth=ts*.03;c.stroke();c.restore();

      // ── L8: Primary specular hotspot — sun reflection ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();
      const sp1=c.createRadialGradient(tx+ts*.22,ty+ts*.15,0,tx+ts*.24,ty+ts*.18,ts*.22);
      sp1.addColorStop(0,'rgba(255,255,255,.72)');sp1.addColorStop(.12,'rgba(255,255,255,.4)');
      sp1.addColorStop(.3,'rgba(255,255,255,.14)');sp1.addColorStop(.55,'rgba(255,255,255,.04)');
      sp1.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=sp1;c.fillRect(tx,ty,ts,ts);c.restore();

      // ── L9: Secondary specular — fill light (bottom-right) ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();c.globalAlpha=.12;
      const sp2=c.createRadialGradient(tx+ts*.74,ty+ts*.72,0,tx+ts*.74,ty+ts*.72,ts*.18);
      sp2.addColorStop(0,'rgba(255,255,255,.55)');sp2.addColorStop(.35,'rgba(255,255,255,.2)');
      sp2.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=sp2;c.fillRect(tx,ty,ts,ts);c.restore();

      // ── L10: Bottom depth shadow — enhanced falloff ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();
      const bsh=c.createLinearGradient(tx,ty+ts*.42,tx,ty+ts);
      bsh.addColorStop(0,'rgba(0,0,0,0)');bsh.addColorStop(.25,'rgba(0,0,0,.02)');
      bsh.addColorStop(.55,'rgba(0,0,0,.06)');bsh.addColorStop(.8,'rgba(0,0,0,.13)');
      bsh.addColorStop(1,'rgba(0,0,0,.2)');
      c.fillStyle=bsh;c.fillRect(tx,ty+ts*.42,ts,ts*.58);c.restore();

      // ── L11: Rim light — bright top-left edge highlight ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();c.globalAlpha=.14;
      const rl=c.createLinearGradient(tx,ty,tx+ts*.45,ty+ts*.45);
      rl.addColorStop(0,'rgba(255,255,255,.85)');rl.addColorStop(.06,'rgba(255,255,255,.4)');
      rl.addColorStop(.16,'rgba(255,255,255,.1)');rl.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=rl;c.fillRect(tx,ty,ts*.45,ts*.45);c.restore();

      // ── L12: Candy texture — subtle concentric shimmer rings ──
      c.save();rr(c,tx,ty,ts,ts,cr);c.clip();c.globalAlpha=.035;
      c.lineWidth=ts*.012;
      for(let ring=3;ring<=5;ring++){
        const rRad=ts*ring*.1;
        c.beginPath();c.arc(cx-ts*.05,cy-ts*.08,rRad,0,Math.PI*2);
        c.strokeStyle=ring%2?'rgba(255,255,255,.6)':'rgba(0,0,0,.3)';c.stroke();
      }
      c.restore();

      // ── L13: Border with directional bevel ──
      c.save();
      // Outer border — gem-tinted
      rr(c,tx+.5,ty+.5,ts-1,ts-1,cr);
      c.strokeStyle=g.bdr;c.lineWidth=1.2*dpr;c.stroke();
      // Inner bevel — light top-left, shadow bottom-right
      rr(c,tx+1.5*dpr,ty+1*dpr,ts-3*dpr,ts-2.5*dpr,cr-1);
      const bvl=c.createLinearGradient(tx,ty,tx+ts,ty+ts);
      bvl.addColorStop(0,'rgba(255,255,255,.55)');bvl.addColorStop(.25,'rgba(255,255,255,.35)');
      bvl.addColorStop(.55,'rgba(255,255,255,.1)');bvl.addColorStop(1,'rgba(0,0,0,.06)');
      c.strokeStyle=bvl;c.lineWidth=.7*dpr;c.stroke();c.restore();

      // ── L14: Multi-point specular pin highlights ──
      c.save();
      // Primary (brightest)
      c.globalAlpha=.72;c.fillStyle='#fff';
      c.beginPath();c.arc(tx+ts*.19,ty+ts*.14,ts*.042,0,Math.PI*2);c.fill();
      // Secondary (nearby, smaller)
      c.globalAlpha=.3;
      c.beginPath();c.arc(tx+ts*.31,ty+ts*.1,ts*.022,0,Math.PI*2);c.fill();
      // Tertiary (lower, dimmer)
      c.globalAlpha=.14;
      c.beginPath();c.arc(tx+ts*.14,ty+ts*.26,ts*.016,0,Math.PI*2);c.fill();
      c.restore();

      // ── Special indicator ──
      if(sp>0){c.save();c.translate(cx,cy);drawSp(c,sp,ts*.42,dpr,ts/2);c.restore()}

      gemCvs[t][sp]=cv;
  }}

function prerenderBoard(){
  boardBg=document.createElement('canvas');
  boardBg.width=Math.round(CW*dpr);boardBg.height=Math.round(CH*dpr);
  const c=boardBg.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const dk=document.body.classList.contains('dark');

  // Base surface — very subtle tinted glass
  if(dk){
    const vig=c.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,Math.max(CW,CH)*.72);
    vig.addColorStop(0,'rgba(18,16,30,.45)');vig.addColorStop(.6,'rgba(12,12,22,.5)');vig.addColorStop(1,'rgba(6,6,12,.55)');c.fillStyle=vig;
  } else {
    const bg=c.createRadialGradient(CW/2,CH*.35,0,CW/2,CH/2,Math.max(CW,CH)*.7);
    bg.addColorStop(0,'rgba(255,255,255,.22)');bg.addColorStop(.5,'rgba(250,248,255,.14)');bg.addColorStop(1,'rgba(245,240,255,.08)');c.fillStyle=bg;
  }
  c.fillRect(0,0,CW,CH);

  // Subtle color wash — warm pink top-left, cool purple bottom-right
  c.save();c.globalAlpha=dk?.035:.025;
  const w1=c.createRadialGradient(CW*.15,CH*.15,0,CW*.15,CH*.15,Math.max(CW,CH)*.6);
  w1.addColorStop(0,'#FF5E94');w1.addColorStop(.6,'rgba(255,94,148,.3)');w1.addColorStop(1,'transparent');c.fillStyle=w1;c.fillRect(0,0,CW,CH);
  const w2=c.createRadialGradient(CW*.85,CH*.85,0,CW*.85,CH*.85,Math.max(CW,CH)*.6);
  w2.addColorStop(0,'#8E6EFF');w2.addColorStop(.6,'rgba(142,110,255,.3)');w2.addColorStop(1,'transparent');c.fillStyle=w2;c.fillRect(0,0,CW,CH);
  c.restore();

  // Cell sockets — soft frosted-glass dimples
  const sm=CELL*.05,sr=CELL*.22;
  for(let r=0;r<ROWS;r++)for(let co=0;co<COLS;co++){
    const sx=co*CELL+sm,sy=r*CELL+sm,sw=CELL-sm*2,sh=CELL-sm*2;
    const cx2=sx+sw/2,cy2=sy+sh/2;

    // Soft radial dimple — glass-like indent
    c.save();rr(c,sx,sy,sw,sh,sr);c.clip();
    const dg=c.createRadialGradient(cx2,cy2-sh*.1,0,cx2,cy2,sw*.55);
    if(dk){
      dg.addColorStop(0,'rgba(255,255,255,.012)');
      dg.addColorStop(.4,'rgba(0,0,0,.06)');
      dg.addColorStop(.8,'rgba(0,0,0,.12)');
      dg.addColorStop(1,'rgba(0,0,0,.15)');
    }else{
      dg.addColorStop(0,'rgba(255,255,255,.06)');
      dg.addColorStop(.4,'rgba(0,0,0,.008)');
      dg.addColorStop(.8,'rgba(0,0,0,.018)');
      dg.addColorStop(1,'rgba(0,0,0,.025)');
    }
    c.fillStyle=dg;c.fillRect(sx,sy,sw,sh);

    // Top-edge inner highlight — frosted rim
    const th=c.createLinearGradient(sx,sy,sx,sy+sh*.25);
    th.addColorStop(0,dk?'rgba(255,255,255,.04)':'rgba(255,255,255,.12)');
    th.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=th;c.fillRect(sx,sy,sw,sh*.25);

    // Bottom-edge shadow — subtle depth
    const bs=c.createLinearGradient(sx,sy+sh*.75,sx,sy+sh);
    bs.addColorStop(0,'rgba(0,0,0,0)');
    bs.addColorStop(1,dk?'rgba(0,0,0,.06)':'rgba(0,0,0,.015)');
    c.fillStyle=bs;c.fillRect(sx,sy+sh*.75,sw,sh*.25);
    c.restore();

    // Thin glass border — barely visible
    rr(c,sx+.5,sy+.5,sw-1,sh-1,sr-.5);
    c.strokeStyle=dk?'rgba(255,255,255,.03)':'rgba(255,255,255,.2)';c.lineWidth=.5;c.stroke();
  }

  // Subtle grid lines — faint separators for structure
  c.save();c.globalAlpha=dk?.03:.04;c.strokeStyle=dk?'rgba(255,255,255,1)':'rgba(0,0,0,1)';c.lineWidth=.5;
  for(let co=1;co<COLS;co++){c.beginPath();c.moveTo(co*CELL,CELL*.15);c.lineTo(co*CELL,CH-CELL*.15);c.stroke()}
  for(let r=1;r<ROWS;r++){c.beginPath();c.moveTo(CELL*.15,r*CELL);c.lineTo(CW-CELL*.15,r*CELL);c.stroke()}
  c.restore();

  // Vignette — softer, refined
  const vig2=c.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*.3,CW/2,CH/2,Math.max(CW,CH)*.7);
  vig2.addColorStop(0,'rgba(0,0,0,0)');vig2.addColorStop(.75,'rgba(0,0,0,0)');
  vig2.addColorStop(1,dk?'rgba(0,0,0,.18)':'rgba(0,0,0,.04)');
  c.fillStyle=vig2;c.fillRect(0,0,CW,CH);

  // Inner top highlight — gentle frosted sheen
  c.save();const thl=c.createLinearGradient(0,0,0,CH*.1);
  thl.addColorStop(0,dk?'rgba(255,255,255,.03)':'rgba(255,255,255,.12)');
  thl.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=thl;c.fillRect(0,0,CW,CH*.1);c.restore();
}

const E={out:t=>1-Math.pow(1-t,3),inQ:t=>t*t*t,
oB:t=>{const c=1.7;return 1+c*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
oBn:t=>{if(t<1/2.75)return 7.5625*t*t;if(t<2/2.75)return 7.5625*(t-=1.5/2.75)*t+.75;if(t<2.5/2.75)return 7.5625*(t-=2.25/2.75)*t+.9375;return 7.5625*(t-=2.625/2.75)*t+.984375}};

function tw(o,p,d,ef=E.out,dl=0){return new Promise(r=>{const s={};for(const k in p)s[k]=o[k]??0;tweens.push({o,s,e:p,d,ef,dl,el:-dl,r})})}
function updTw(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.el+=dt;if(w.el<0)continue;const t=Math.min(w.el/w.d,1),v=w.ef(t);for(const k in w.e)w.o[k]=w.s[k]+(w.e[k]-w.s[k])*v;if(t>=1){tweens.splice(i,1);w.r()}}}

function burst(x,y,col,n=30){
  // Main radial burst
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.5,sp=Math.random()*6+3;
  const r=Math.random();const pc=r>.75?'#fff':r>.3?col:GEMS[Math.floor(Math.random()*NT)].bg2;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,sz:Math.random()*4+1.5,col:pc,life:1,dec:Math.random()*.012+.008})}
  // Sparkle halo — white accents
  for(let i=0;i<8;i++){const a=Math.PI*2*i/8+Math.random()*.4;
  particles.push({x,y,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8-1.2,sz:Math.random()*2.5+2,col:'#fff',life:.85,dec:.018})}
  // Core burst — tiny fast specks
  for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*2.5+1;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.5,sz:Math.random()*1.5+.5,col:'rgba(255,255,255,.9)',life:.5,dec:.028})}}
function updPt(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.97;p.life-=p.dec;p.sz*=.96;if(p.life<=0)particles.splice(i,1)}}

// ── SHOCKWAVE RINGS ──
let shockwaves=[];
function addShockwave(x,y,col,maxR=80,dur=350){shockwaves.push({x,y,col,maxR,dur,age:0})}
function updShockwaves(dt){for(let i=shockwaves.length-1;i>=0;i--){shockwaves[i].age+=dt;if(shockwaves[i].age>=shockwaves[i].dur)shockwaves.splice(i,1)}}
function drawShockwaves(c){for(const s of shockwaves){const p=s.age/s.dur,r=s.maxR*E.out(p),a=(1-p)*.55;
c.save();
// Outer soft glow ring (replaces shadowBlur)
c.globalAlpha=a*.25;c.strokeStyle=s.col;c.lineWidth=8*(1-p)+2;
c.beginPath();c.arc(s.x,s.y,r,0,Math.PI*2);c.stroke();
// Primary ring — crisp
c.globalAlpha=a;c.lineWidth=2.5*(1-p)+.5;
c.beginPath();c.arc(s.x,s.y,r,0,Math.PI*2);c.stroke();
// Inner secondary ring
if(p<.5){c.globalAlpha=a*.25;c.lineWidth=1;c.beginPath();c.arc(s.x,s.y,r*.6,0,Math.PI*2);c.stroke()}
c.restore()}}

function launchConfetti(n=120){const colors=['#FF5E94','#FF3070','#FFD700','#4AABEF','#9A7AFF','#3CC49E','#FFB0D4','#FF80B8','#A488F0','#fff'];
for(let i=0;i<n;i++){confetti.push({x:Math.random()*CW,y:-15-Math.random()*60,
vx:(Math.random()-.5)*7,vy:Math.random()*-3.5-1.5,

function updConfetti(){for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.x+=c.vx+Math.sin(c.wobble)*.8;c.y+=c.vy;
c.vy+=.12;c.vx*=.99;c.rot+=c.rSpd;c.wobble+=.05;c.life-=c.dec;if(c.life<=0||c.y>CH+20)confetti.splice(i,1)}}
function drawConfetti(c){c.save();for(const p of confetti){c.globalAlpha=Math.min(p.life,1);c.fillStyle=p.col;
c.save();c.translate(p.x,p.y);c.rotate(p.rot);
const hw=p.w/2,hh=p.h/2,cr2=Math.min(hw,hh)*.3;
c.beginPath();c.moveTo(-hw+cr2,-hh);c.lineTo(hw-cr2,-hh);c.arcTo(hw,-hh,hw,-hh+cr2,cr2);
c.lineTo(hw,hh-cr2);c.arcTo(hw,hh,hw-cr2,hh,cr2);c.lineTo(-hw+cr2,hh);c.arcTo(-hw,hh,-hw,hh-cr2,cr2);
c.lineTo(-hw,-hh+cr2);c.arcTo(-hw,-hh,-hw+cr2,-hh,cr2);c.closePath();c.fill();
c.restore()}c.restore()}

// Pre-render tile backgrounds for start screen (no faces — faces drawn live)
const SS_FSZ=78,SS_FPAD=5;
let ssFaceBgs=[];
function prerenderSSBgs(){
  ssFaceBgs=[];
  const fsz=SS_FSZ,fpad=SS_FPAD,fts=fsz-fpad*2,fcr=fts*.28;
  for(let i=0;i<NT;i++){
    const bg=document.createElement('canvas');bg.width=fsz*2;bg.height=fsz*2;
    const c=bg.getContext('2d');c.scale(2,2);
    const g=GEMS[i];
    // Colored ambient glow
    c.save();c.shadowColor=g.bg2;c.shadowBlur=10;c.shadowOffsetY=3;c.globalAlpha=.45;
    rr(c,fpad+2,fpad+2,fts-4,fts-4,fcr);c.fillStyle=g.bg2;c.fill();c.restore();
    // Outer shadow
    c.save();c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=8;c.shadowOffsetY=4;
    rr(c,fpad,fpad,fts,fts,fcr);c.fillStyle=g.bg3||g.bg2;c.fill();c.restore();
    // Body gradient
    c.save();rr(c,fpad,fpad,fts,fts,fcr);
    const gr=c.createLinearGradient(fpad,fpad,fpad+fts*.15,fpad+fts);
    gr.addColorStop(0,g.bg1);gr.addColorStop(.2,g.bg1);gr.addColorStop(.45,g.bg2);
    gr.addColorStop(.8,g.bg3||g.bg2);gr.addColorStop(1,g.bg3||g.bg2);
    c.fillStyle=gr;c.fill();c.restore();
    // Glass highlight
    c.save();rr(c,fpad,fpad,fts,fts,fcr);c.clip();
    const gh=c.createLinearGradient(fpad,fpad,fpad,fpad+fts*.5);
    gh.addColorStop(0,'rgba(255,255,255,.8)');gh.addColorStop(.08,'rgba(255,255,255,.6)');
    gh.addColorStop(.3,'rgba(255,255,255,.15)');gh.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=gh;c.fillRect(fpad,fpad,fts,fts*.5);c.restore();
    // Bottom shadow
    c.save();rr(c,fpad,fpad,fts,fts,fcr);c.clip();
    const bh=c.createLinearGradient(fpad,fpad+fts*.6,fpad,fpad+fts);
    bh.addColorStop(0,'rgba(0,0,0,0)');bh.addColorStop(.5,'rgba(0,0,0,.08)');bh.addColorStop(1,'rgba(0,0,0,.2)');
    c.fillStyle=bh;c.fillRect(fpad,fpad+fts*.6,fts,fts*.4);c.restore();
    // Border + inner bevel
    rr(c,fpad+.5,fpad+.5,fts-1,fts-1,fcr);c.strokeStyle=g.bdr;c.lineWidth=1.2;c.stroke();
    rr(c,fpad+1.5,fpad+1,fts-3,fts-2.5,fcr-1);c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=.6;c.stroke();
    // Specular dot
    c.save();c.globalAlpha=.55;c.fillStyle='#fff';c.beginPath();
    c.arc(fpad+fts*.18,fpad+fts*.14,fts*.045,0,Math.PI*2);c.fill();c.restore();
    ssFaceBgs.push(bg);
  }
}

let ssBgAnim=0;
function initSSBg(){
  if(ssBgAnim){cancelAnimationFrame(ssBgAnim);ssBgAnim=0}
  const cv=document.getElementById('ssBg');if(!cv)return;
  const W=window.innerWidth,H=window.innerHeight;
  cv.width=W;cv.height=H;
  const cx=cv.getContext('2d');
  const tiles=[];const N=12;
  for(let i=0;i<N;i++){
    tiles.push({
      x:Math.random()*W,y:Math.random()*H,
      sz:Math.random()*20+16,spd:Math.random()*.3+.15,
      rot:Math.random()*Math.PI*2,rSpd:(Math.random()-.5)*.01,
      type:Math.floor(Math.random()*NT),alpha:Math.random()*.12+.04,
      drift:Math.random()*Math.PI*2
    });
  }
  function drawSS(ts){
    if(document.getElementById('scrS').classList.contains('hidden')){ssBgAnim=0;return}
    ssBgAnim=requestAnimationFrame(drawSS);
    cx.clearRect(0,0,W,H);
    tiles.forEach(t=>{
      t.y+=t.spd;t.x+=Math.sin(ts*.0005+t.drift)*.2;t.rot+=t.rSpd;
      if(t.y>H+t.sz*2){t.y=-t.sz*2;t.x=Math.random()*W}
      const g=GEMS[t.type];
      cx.save();cx.translate(t.x,t.y);cx.rotate(t.rot);cx.globalAlpha=t.alpha;
      const hs=t.sz/2,cr2=t.sz*.22;
      rr(cx,-hs,-hs,t.sz,t.sz,cr2);
      const gr=cx.createLinearGradient(-hs,-hs,-hs,hs);
      gr.addColorStop(0,g.bg1);gr.addColorStop(1,g.bg2);
      cx.fillStyle=gr;cx.fill();
      cx.restore();
    });
  }
  ssBgAnim=requestAnimationFrame(drawSS);
}

function resize(){

  ctx.setTransform(dpr,0,0,dpr,0,0);
  document.getElementById('board').style.width=bw+'px';document.getElementById('board').style.height=bh+'px';
  prerenderGems(CELL);prerenderBoard();updObj();

  document.getElementById('hSc').textContent='0';

    const cell=mkC(t);cell.offY=-(ROWS+r+3)*CELL;cell.scale=.35;cell.alpha=.2;grid[r][c]=cell;
    const dl=c*40+r*65;

function updObj(){
  const l=gLv(level),g=l.goal,r=document.getElementById('objR');r.innerHTML='';
  if(g.t==='score'){const d=score>=g.n;r.innerHTML=`<div class="obj-pill ${d?'done':''}"><span style="font-size:12px">&#127919;</span><span class="ct">${Math.min(score,g.n)}/${g.n}</span></div>`}
  else if(g.t==='clear')mkPill(r,g.e,g.n);else if(g.t==='multi')g.ts.forEach(t=>mkPill(r,t.e,t.n));

function mkPill(r,e,n){const d=clr[e]>=n,p=document.createElement('div');p.className='obj-pill'+(d?' done':'');
  const dot=document.createElement('span');dot.className='obj-dot';dot.style.background=GEMS[e].dot;dot.style.boxShadow='0 0 6px '+GEMS[e].g;
