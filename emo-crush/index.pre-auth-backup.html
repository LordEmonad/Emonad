function chkWin(){const g=gLv(level).goal;if(g.t==='score')return score>=g.n;if(g.t==='clear')return clr[g.e]>=g.n;if(g.t==='multi')return g.ts.every(t=>clr[t.e]>=t.n);return false}
function gSt(){const s=gLv(level).st;if(score>=s[2])return 3;if(score>=s[1])return 2;if(score>=s[0])return 1;return 0}

// ═══════════════════════════════════════════════════════
// MATCHING + RESOLVE + GRAVITY
// ═══════════════════════════════════════════════════════
function findM(){
  const m=[];
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){if(!grid[r]||!grid[r][c]){c++;continue}let n=1;while(c+n<COLS&&grid[r][c+n]&&grid[r][c].type===grid[r][c+n].type)n++;if(n>=3){const cs=[];for(let i=0;i<n;i++)cs.push({r,c:c+i});m.push({cs,d:'h'})}c+=Math.max(n,1)}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){if(!grid[r]||!grid[r][c]){r++;continue}let n=1;while(r+n<ROWS&&grid[r+n]&&grid[r+n][c]&&grid[r][c].type===grid[r+n][c].type)n++;if(n>=3){const cs=[];for(let i=0;i<n;i++)cs.push({r:r+i,c});m.push({cs,d:'v'})}r+=Math.max(n,1)}}
  return m;
}
function resolve(){
  const ms=findM();if(!ms.length)return false;combo++;if(combo>bstCo)bstCo=combo;
  if(combo>=2)showChain(combo);
  let tc=new Set(),sp=[];
  ms.forEach(m=>{m.cs.forEach(({r,c})=>tc.add(`${r},${c}`));
    if(m.cs.length===4){const p=m.cs[1];sp.push({r:p.r,c:p.c,type:grid[p.r][p.c].type,sp:1})}
    else if(m.cs.length>=5){const p=m.cs[2];sp.push({r:p.r,c:p.c,type:grid[p.r][p.c].type,sp:3})}});
  for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){if(ms[i].d!==ms[j].d){const sh=ms[i].cs.find(a=>ms[j].cs.some(b=>a.r===b.r&&a.c===b.c));if(sh)sp.push({r:sh.r,c:sh.c,type:grid[sh.r][sh.c].type,sp:2})}}
  let ex=new Set();
  tc.forEach(k=>{const[r,c]=k.split(',').map(Number);const cl=grid[r]?grid[r][c]:null;if(!cl)return;
    if(cl.sp===1){for(let i=0;i<COLS;i++)ex.add(`${r},${i}`);for(let i=0;i<ROWS;i++)ex.add(`${i},${c}`)}
    else if(cl.sp===2){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)ex.add(`${nr},${nc}`)}}
    else if(cl.sp===3){for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++){if(grid[rr]&&grid[rr][cc]&&grid[rr][cc].type===cl.type)ex.add(`${rr},${cc}`)}}
  });ex.forEach(k=>tc.add(k));
  const pts=tc.size*(10+combo*5);score+=pts;
  if(combo>=2)shakeAmt=Math.max(shakeAmt,3+combo*2.5);
  // Sound + haptics
  SFX.match(combo);haptic(8+combo*5);
  if(combo>=2){SFX.combo(combo);boardGlow=Math.min(1,boardGlow+.15+combo*.1)}
  if(combo>=3)screenFlash('rgba(255,94,148,.3)',.15+combo*.05);
  if(combo>=5)screenFlash('rgba(255,215,0,.35)',.25);
  // Score bump animation
  const scEl=document.getElementById('hSc');scEl.classList.remove('score-pop');void scEl.offsetWidth;scEl.classList.add('score-pop');
  // Shockwaves at match centers
  ms.forEach(m=>{const mid=m.cs[Math.floor(m.cs.length/2)];
    const sx=mid.c*CELL+CELL/2,sy=mid.r*CELL+CELL/2;
    addShockwave(sx,sy,GEMS[grid[mid.r][mid.c].type].bg2,CELL*1.5+m.cs.length*8,300+m.cs.length*30)});
  // Special gem sound
  sp.forEach(s=>{if(s.sp>=2)SFX.special()});
  tc.forEach(k=>{const[r,c]=k.split(',').map(Number);if(grid[r]&&grid[r][c]){clr[grid[r][c].type]++;
    const px=c*CELL+CELL/2,py=r*CELL+CELL/2;burst(px,py,GEMS[grid[r][c].type].bg2,20+combo*5);
    grid[r][c].flash=1;tw(grid[r][c],{flash:0,scale:0,alpha:0},220,E.inQ)}});
  const fk=[...tc][0];if(fk){const[fr,fc]=fk.split(',').map(Number);shPt(fc*CELL+CELL/2,fr*CELL,`+${pts}`)}
  if(combo>=2){const ti=Math.min(combo-2,COMBO_TXT.length-1);shCo(COMBO_TXT[ti]+` x${combo}`,ti>=4?'t3':ti>=2?'t2':'')}
  setTimeout(()=>{tc.forEach(k=>{const[r,c]=k.split(',').map(Number);if(grid[r])grid[r][c]=null});
    sp.forEach(s=>{if(grid[s.r]&&!grid[s.r][s.c]){grid[s.r][s.c]=mkC(s.type,s.sp);grid[s.r][s.c].scale=0;tw(grid[s.r][s.c],{scale:1},280,E.oB)}})},200);
  return true;
}
function grav(){
  let mv=false;const pr=[];
  for(let c=0;c<COLS;c++){let em=0;for(let r=ROWS-1;r>=0;r--){if(!grid[r]||!grid[r][c])em++;else if(em>0){const cell=grid[r+em][c]=grid[r][c];grid[r][c]=null;cell.offY=-em*CELL;
    pr.push(tw(cell,{offY:0},250+em*40,E.oBn));mv=true}}
    for(let r=0;r<em;r++){const cl=mkC(Math.floor(Math.random()*NT));cl.offY=-(em-r)*CELL-CELL;cl.scale=.8;if(!grid[r])grid[r]=[];grid[r][c]=cl;
    pr.push(tw(cl,{offY:0},280+(em-r)*40,E.oBn));tw(cl,{scale:1},200,E.oB,280+(em-r)*40-40);mv=true}}
  return{mv,pr};
}
async function proc(){
  anim=true;combo=0;let had=true;
  while(had){await slp(220);had=resolve();if(had){updHUD();await slp(260);const g=grav();if(g.pr.length)await Promise.all(g.pr);await slp(100)}}
  combo=0;anim=false;hintTimer=0;hintCells=null;hideChain();checkShuffle();
  if(!active)return;
  if(chkWin()){active=false;await slp(450);shWin()}else if(moves<=0){active=false;await slp(450);shLose()}
}
function slp(ms){return new Promise(r=>setTimeout(r,ms))}

// SWAP + INPUT
// ═══════════════════════════════════════════════════════
function tryS(r1,c1,r2,c2){
  if(anim||!active||Math.abs(r1-r2)+Math.abs(c1-c2)!==1)return;
  if(!grid[r1]||!grid[r2]||!grid[r1][c1]||!grid[r2][c2])return;
  hintTimer=0;hintCells=null;
  const a=grid[r1][c1],b=grid[r2][c2],dx=(c2-c1)*CELL,dy=(r2-r1)*CELL;anim=true;
  SFX.swap();haptic(6);
  Promise.all([tw(a,{offX:dx,offY:dy},185,E.oB),tw(b,{offX:-dx,offY:-dy},185,E.oB)]).then(()=>{
    a.offX=0;a.offY=0;b.offX=0;b.offY=0;[grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
    if(findM().length>0){moves--;updHUD();proc()}else{
      SFX.invalid();haptic(20);
      const a2=grid[r1][c1],b2=grid[r2][c2];
      document.getElementById('board').classList.add('invalid-flash');
      setTimeout(()=>document.getElementById('board').classList.remove('invalid-flash'),350);
      Promise.all([tw(a2,{offX:dx,offY:dy},140,E.out),tw(b2,{offX:-dx,offY:-dy},140,E.out)]).then(()=>{
        a2.offX=0;a2.offY=0;b2.offX=0;b2.offY=0;[grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];anim=false;
        shakeAmt=Math.max(shakeAmt,3);
      })}});sel=null;
}

function gCA(cx,cy){const rc=cvs.getBoundingClientRect();const x=cx-rc.left-BPAD,y=cy-rc.top-BPAD;const c=Math.floor(x/CELL),r=Math.floor(y/CELL);if(r>=0&&r<ROWS&&c>=0&&c<COLS)return{r,c};return null}
function hD(x,y){hintTimer=0;hintCells=null;const cl=gCA(x,y);if(!cl)return;swS={...cl,x,y};
  if(sel&&Math.abs(cl.r-sel.r)+Math.abs(cl.c-sel.c)===1){tryS(sel.r,sel.c,cl.r,cl.c);swS=null;return}
  sel=cl;if(grid[cl.r]&&grid[cl.r][cl.c]){SFX.select();haptic(4);tw(grid[cl.r][cl.c],{glow:1},120);
    grid[cl.r][cl.c].scale=.85;tw(grid[cl.r][cl.c],{scale:1},200,E.oB)}}
function hM(x,y){if(!swS)return;const dx=x-swS.x,dy=y-swS.y,th=CELL*.3;if(Math.abs(dx)>th||Math.abs(dy)>th){let dr=0,dc=0;Math.abs(dx)>Math.abs(dy)?dc=dx>0?1:-1:dr=dy>0?1:-1;const nr=swS.r+dr,nc=swS.c+dc;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)tryS(swS.r,swS.c,nr,nc);swS=null;sel=null}}
function hU(){swS=null}

// ═══════════════════════════════════════════════════════
// UI POPUPS + WIN/LOSE + SHARE
// ═══════════════════════════════════════════════════════
function shCo(t,cls=''){const el=document.createElement('div');el.className='cpop '+cls;el.textContent=t;document.getElementById('bwrap').appendChild(el);setTimeout(()=>el.remove(),850)}
function shPt(x,y,t){const el=document.createElement('div');el.className='pf';el.textContent=t;el.style.left=(x+BPAD)+'px';el.style.top=(y+BPAD)+'px';document.getElementById('board').appendChild(el);setTimeout(()=>el.remove(),650)}
function shWin(){const st=gSt();

  // Animated score count-up

    scEl.textContent=cScore;requestAnimationFrame(countUp)};
  setTimeout(countUp,300);
  document.getElementById('wCo').textContent=bstCo;

  for(let i=0;i<3;i++){const s=document.createElement('div');s.className='star';
    s.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01z" fill="#FFD700" stroke="#E6A800" stroke-width=".5"/></svg>';
    c.appendChild(s);if(i<st)setTimeout(()=>s.classList.add('on'),400+i*400)}
  document.getElementById('scrW').classList.remove('hidden')}
function shLose(){SFX.lose();haptic([50,30,80]);

  document.getElementById('lSub').textContent=LSUB_T[Math.floor(Math.random()*LSUB_T.length)];
  document.getElementById('scrL').classList.remove('hidden')}
function share(){const st=gSt(),hearts='\u{1F49C}'.repeat(st)+'\u{1F5A4}'.repeat(3-st),name=lvlName(level);
  const t=`\u{1F494} EMO CRUSH \u{1F494}\n\n${name} (Level ${level+1})\n${hearts} \u2014 ${score} pts\nBest combo: x${bstCo}\n\ncrush your feelings\n\n$EMO on Monad\nemonad.lol`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>shCo('copied'))}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render(){
  let sx=0,sy=0;
  if(shakeAmt>.3){sx=(Math.random()-.5)*shakeAmt;sy=(Math.random()-.5)*shakeAmt;shakeAmt*=.85}else shakeAmt=0;

  // Clear canvas
  ctx.clearRect(0,0,CW+BPAD*2,CH+BPAD*2);
  const camAmp=active?1:.35;
  const camX=Math.sin(lt*.0008)*.8*camAmp;
  const camY=Math.cos(lt*.00062)*.55*camAmp;
  const camRot=Math.sin(lt*.00045)*.003*camAmp;
  ctx.save();
  ctx.translate(sx+BPAD+camX,sy+BPAD+camY);
  ctx.translate(CW/2,CH/2);ctx.rotate(camRot);ctx.translate(-CW/2,-CH/2);
  ctx.drawImage(boardBg,0,0,CW,CH);
  const boardPulse=.5+Math.sin(lt*.00065)*.5;
  ctx.save();
  const bgPulse=ctx.createRadialGradient(CW*.28,CH*.22,0,CW*.28,CH*.22,Math.max(CW,CH)*.65);
  bgPulse.addColorStop(0,'rgba(255,255,255,.12)');bgPulse.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalAlpha=.05+boardPulse*.07;ctx.fillStyle=bgPulse;ctx.fillRect(0,0,CW,CH);
  const bgPulse2=ctx.createRadialGradient(CW*.8,CH*.82,0,CW*.8,CH*.82,Math.max(CW,CH)*.6);
  bgPulse2.addColorStop(0,'rgba(255,120,190,.08)');bgPulse2.addColorStop(1,'rgba(255,120,190,0)');
  ctx.globalAlpha=.04+boardPulse*.05;ctx.fillStyle=bgPulse2;ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // Shine sweep — periodic highlight wave across the board
  const sweepCyc=12000,sweepT=(lt%sweepCyc)/sweepCyc;
  const sweepX=-CW*.32+sweepT*CW*1.64;const sweepOn=sweepT<.2&&!hintCells;

  for(let r=0;r<ROWS;r++){if(!grid[r])continue;for(let c=0;c<COLS;c++){
    const cl=grid[r][c];if(!cl||cl.alpha<=0)continue;
    const cx2=c*CELL+CELL/2+cl.offX,cy2=r*CELL+CELL/2+cl.offY;
    const isMoving=Math.abs(cl.offX)>.5||Math.abs(cl.offY)>.5;
    const isSel=sel&&sel.r===r&&sel.c===c;
    // Per-tile breathing wave — unique phase per tile
    const tPh=r*.8+c*.5;
    const bScale=isMoving?1:1+Math.sin(lt*.003+tPh)*.008;
    // Subtle idle rotation wobble
    const wRot=isMoving?0:Math.sin(lt*.002+tPh*1.3)*.006;
    ctx.save();ctx.globalAlpha=cl.alpha;ctx.translate(cx2,cy2);ctx.rotate(wRot);ctx.scale(cl.scale*bScale,cl.scale*bScale);

    // Glow effect (drawn as soft circle behind tile instead of shadowBlur)
    if(cl.glow>0||isSel){
      const gv=Math.max(cl.glow,isSel?.6:0);
      ctx.save();ctx.globalAlpha=gv*.3;ctx.fillStyle=GEMS[cl.type].bg2;
      ctx.beginPath();ctx.arc(0,0,gemSz*.6,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    const gc=gemCvs[cl.type]?gemCvs[cl.type][cl.sp]:null;
    if(gc){const gp=gemPad/dpr;ctx.drawImage(gc,-(gemSz/2+gp),-(gemSz/2+gp),gemSz+gp*2,gemSz+gp*2)}
    // Shine sweep with rounded clipping to avoid boxy idle flashes
    if(sweepOn){const dist=Math.abs(c*CELL+CELL/2-sweepX);if(dist<CELL*2){
      const inten=1-dist/(CELL*2);const smoothInten=inten*inten*(3-2*inten);
      ctx.globalAlpha=smoothInten*.09;
      const sg=ctx.createLinearGradient(-gemSz*.5,-gemSz*.3,gemSz*.5,gemSz*.3);
      sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.24,'rgba(255,225,235,.18)');
      sg.addColorStop(.42,'rgba(255,255,255,.42)');sg.addColorStop(.5,'rgba(255,255,255,.55)');
      sg.addColorStop(.58,'rgba(245,255,255,.42)');sg.addColorStop(.78,'rgba(215,230,255,.15)');
      sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.save();rr(ctx,-gemSz*.46,-gemSz*.46,gemSz*.92,gemSz*.92,gemSz*.2);ctx.clip();
      ctx.fillStyle=sg;ctx.fillRect(-gemSz*.5,-gemSz*.5,gemSz,gemSz);ctx.restore();}}
    ctx.globalAlpha=cl.alpha;const _fr=CELL*.38;
    if(isMoving)animMoving(ctx,_fr,lt);
    else ANIM_FACES[cl.type](ctx,_fr,lt,r,c);

    // Flash — radial burst + expanding ring
    if(cl.flash>0){
      ctx.globalAlpha=cl.flash*.7;
      const fRad=gemSz*.42;
      const fg=ctx.createRadialGradient(0,0,0,0,0,fRad);
      fg.addColorStop(0,'rgba(255,255,255,.9)');fg.addColorStop(.3,GEMS[cl.type].g);fg.addColorStop(.7,'rgba(255,255,255,.15)');fg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,fRad,0,Math.PI*2);ctx.fill();
      // Expanding ring
      const ringR=gemSz*(.12+(1-cl.flash)*.35);ctx.strokeStyle='rgba(255,255,255,'+(cl.flash*.4)+')';
      ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,ringR,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();if(cl.glow>0)cl.glow=Math.max(0,cl.glow-.02);
  }}

  // Selection — clean pulsing ring
  if(sel&&grid[sel.r]&&grid[sel.r][sel.c]){
    const cl=grid[sel.r][sel.c],pad=CELL*.06,ts=CELL-pad*2;
    const sx2=sel.c*CELL+pad+cl.offX,sy2=sel.r*CELL+pad+cl.offY;
    const sp=.65+Math.sin(lt*.006)*.25;
    const col=GEMS[cl.type].bg2;
    ctx.save();
    // Soft outer glow (no shadowBlur, manual)
    ctx.globalAlpha=sp*.2;ctx.strokeStyle=col;ctx.lineWidth=8;
    rr(ctx,sx2-3,sy2-3,ts+6,ts+6,ts*.24);ctx.stroke();
    // Primary ring
    ctx.globalAlpha=sp*.7;ctx.strokeStyle=col;ctx.lineWidth=2.5;
    rr(ctx,sx2,sy2,ts,ts,ts*.22);ctx.stroke();
    // Inner bright highlight
    ctx.globalAlpha=sp*.3;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;
    rr(ctx,sx2+1,sy2+1,ts-2,ts-2,ts*.21);ctx.stroke();
    ctx.restore();
  }
  // Hint - subtle idle assist glow
  if(hintCells){
    const hp=.11+Math.sin(hintPulse)*.05,pad=CELL*.065,ts=CELL-pad*2;
    ctx.save();
    for(const h of hintCells){
      const hcl=grid[h.r]&&grid[h.r][h.c];
      const hCol=hcl?GEMS[hcl.type].bg2:'rgba(255,107,157,.5)';
      ctx.globalAlpha=hp*.22;ctx.strokeStyle=hCol;ctx.lineWidth=3.2;
      rr(ctx,h.c*CELL+pad-1.6,h.r*CELL+pad-1.6,ts+3.2,ts+3.2,ts*.24);ctx.stroke();
      ctx.globalAlpha=hp*.14;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;
      rr(ctx,h.c*CELL+pad+.6,h.r*CELL+pad+.6,ts-1.2,ts-1.2,ts*.22);ctx.stroke();
    }
    ctx.restore();
  }

  // Particles — motion trails + glow
  ctx.save();ctx.shadowBlur=0;
  for(const p of particles){
    // Motion trail
    if(Math.abs(p.vx)>.5||Math.abs(p.vy)>.5){
      ctx.globalAlpha=p.life*.2;ctx.strokeStyle=p.col;ctx.lineWidth=p.sz*.5;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2);ctx.stroke()}
    // Outer glow (larger, softer)
    ctx.globalAlpha=p.life*.35;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*2,0,Math.PI*2);ctx.fill();
    // Core
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
    // Bright center
    ctx.globalAlpha=p.life*.5;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();

  // Shockwaves
  drawShockwaves(ctx);

  // Confetti
  if(confetti.length)drawConfetti(ctx);

  ctx.globalAlpha=1;ctx.restore();
}

// ═══════════════════════════════════════════════════════

// MAIN LOOP
// ═══════════════════════════════════════════════════════
let lt=0;
function loop(ts){const dt=Math.min(ts-lt,33);lt=ts;updTw(dt);updPt();updShockwaves(dt);updConfetti();updDisplayScore();updBoardGlow();updFlash();
  if(active&&!anim){hintTimer+=dt;if(hintTimer>=8000&&!hintCells){hintCells=findHint();hintPulse=0}if(hintCells)hintPulse+=dt*.0024}
  render();requestAnimationFrame(loop)}
if(localStorage.getItem('emocrush-dark')==='1')document.body.classList.add('dark');
init();
</script>
