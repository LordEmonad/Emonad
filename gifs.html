  <script>
    (function() {
      var html = document.documentElement;
      var saved = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      html.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').addEventListener('click', function() {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });

      function safeGifAsset(p) {
        if (typeof p !== 'string' || p.length > 220) return '';
        if (p.indexOf('..') !== -1 || p.indexOf('\\') !== -1 || p.indexOf(':') !== -1) return '';
        if (p.indexOf('templates/gifs/') !== 0) return '';
        if (!/\.(gif|png|jpe?g|webp)$/i.test(p)) return '';
        return p;
      }
      function safeDownloadName(name) {
        var base = String(name || 'emonad.gif').split(/[/\\]/).pop();
        return /^[A-Za-z0-9._-]+$/.test(base) ? base : 'emonad.gif';
      }

      var list = ((window.EMOTEMPLATES || {}).templates || []).filter(function(t) {
        return t.category === 'gifs' && safeGifAsset(t.src);
      });
      document.getElementById('gifCount').textContent = list.length + ' gif' + (list.length === 1 ? '' : 's');
      var grid = document.getElementById('gifGrid');
      if (!list.length) {
        var empty = document.createElement('p');
        empty.style.cssText = 'grid-column:1/-1;text-align:center;color:var(--text-secondary);padding:40px 0';
        empty.textContent = 'No GIFs loaded.';
        grid.appendChild(empty);
      }
      var box = document.getElementById('lightbox');
      var img = document.getElementById('lightboxImg');
      var dl = document.getElementById('lightboxDl');

      list.forEach(function(t) {
        var src = safeGifAsset(t.src);
        var thumbSrc = safeGifAsset(t.thumb) || src;
        if (!src) return;
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gif-card';
        btn.setAttribute('aria-label', t.name || 'GIF');
        var thumb = document.createElement('img');
        thumb.src = thumbSrc;
        thumb.alt = t.name || '';
        thumb.loading = 'lazy';
        btn.appendChild(thumb);
        btn.addEventListener('click', function() {
          img.src = src;
          img.alt = t.name || '';
          dl.href = src;
          dl.setAttribute('download', safeDownloadName(t.file));
          box.classList.add('open');
        });
        grid.appendChild(btn);
      });

      function close() {
        box.classList.remove('open');
        img.src = '';
      }
      document.getElementById('lightboxClose').addEventListener('click', close);
      box.addEventListener('click', function(e) { if (e.target === box) close(); });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });
    })();
  </script>
