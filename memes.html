    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Page Transition ── */
    /* ── Page Transition ── */
    .page-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-transition .pt-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(155, 95, 255, 0.15) 0%, transparent 60%),
        var(--bg-color);
      transform: scaleY(1);
      transform-origin: top;
      animation: ptOverlayOut 0.8s 0.15s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    .page-transition .pt-logo {
      position: relative;
      z-index: 1;
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: ptLogoOut 0.6s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    .page-transition .pt-logo svg {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 0 30px rgba(155, 95, 255, 0.6));
    }

    .page-transition .pt-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(155, 95, 255, 0.3) 0%, transparent 70%);
      opacity: 0.6;
      animation: ptGlowOut 0.7s ease forwards;
    }

    @keyframes ptOverlayOut {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(0); }
    }

    @keyframes ptLogoOut {
      0% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.3) rotate(15deg); }
    }

    @keyframes ptGlowOut {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 0; transform: scale(2); }
    }

    .page-enter {
      animation: ptPageEnter 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes ptPageEnter {
      0% { opacity: 0; transform: translateY(25px); filter: blur(3px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ── Exit transition (back to emo) ── */
    .page-transition.exit-active {
      pointer-events: all;
    }

    .page-transition.exit-active .pt-overlay {
      transform: scaleY(0);
      transform-origin: bottom;
      animation: ptOverlayIn 0.75s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    .page-transition.exit-active .pt-logo {
      opacity: 0;
      transform: scale(0.5) rotate(-30deg);
      animation: ptLogoIn 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .page-transition.exit-active .pt-glow {
      opacity: 0;
      animation: ptGlowPulse 0.7s 0.35s ease forwards;
    }

    @keyframes ptOverlayIn {
      0% { transform: scaleY(0); transform-origin: bottom; }
      100% { transform: scaleY(1); transform-origin: bottom; }
    }

    @keyframes ptLogoIn {
      0% { opacity: 0; transform: scale(0.5) rotate(-30deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes ptGlowPulse {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.6; transform: scale(1); }
    }

    .page-transition.exit-active ~ .top-bar,
    .page-transition.exit-active ~ .container {
      animation: ptContentOut 0.65s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    @keyframes ptContentOut {
      0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-40px) scale(0.97); filter: blur(4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .page-transition { display: none; }
      .page-enter { animation: none; opacity: 1; }
    }

    /* ── Theme Transition ── */
    html.theme-transition,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease !important;
    }

    /* ── Top Bar ── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;

    .back-btn {

    .theme-toggle {
      width: 32px; height: 32px;

    .theme-toggle:hover { border-color: var(--accent); background: var(--accent-glow); }
    .theme-toggle .icon-sun, .theme-toggle .icon-moon {
      position: absolute; width: 15px; height: 15px;

    }
    .theme-toggle:hover .icon-sun, .theme-toggle:hover .icon-moon { color: var(--accent); }
    .theme-toggle .icon-sun { opacity: 0; transform: rotate(-90deg); }
    .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg); }
    [data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg); }
    [data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg); }

    /* ── Header ── */

    /* ── Search & Filter Bar ── */

    [data-theme="light"] .filter-bar { background: rgba(255, 255, 255, 0.75); border-color: rgba(0,0,0,0.06); box-shadow: 0 12px 30px rgba(60, 30, 120, 0.08); }

    .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .search-wrap { flex: 1; position: relative; min-width: 0; }
    .search-input {
      width: 100%;
      padding: 10px 36px 10px 38px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-color);
      font-family: inherit;
      font-size: 14px;

      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .search-input::-webkit-search-cancel-button { display: none; }
    .search-input:focus { border-color: var(--accent); background: var(--bg-color); }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 24px; height: 24px; border-radius: 50%; border: none;
      background: var(--surface-border); color: var(--text-color);
      cursor: pointer; font-size: 14px; line-height: 1;
      display: none; align-items: center; justify-content: center;
    }
    .search-clear.visible { display: flex; }
    .search-clear:hover { background: var(--accent); color: white; }

    .sort-btn {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-color);
      font: 600 13px/1 inherit;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sort-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: white; }
    .sort-btn svg { width: 15px; height: 15px; }

    /* One scrollable row so the sticky bar stays short; the wheel scrolls it sideways. */
    .category-pills {
      display: flex; flex-wrap: nowrap; gap: 7px;
      overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
      margin: 0 -14px; padding: 2px 14px 4px;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 32px), transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 32px), transparent);
    }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.055);
      color: var(--text-color);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: capitalize;
      white-space: nowrap;
    }
    [data-theme="light"] .pill { border-color: rgba(0,0,0,0.08); background: rgba(255,255,255,0.7); }
    .pill:hover { border-color: rgba(176,128,255,0.5); background: rgba(155,95,255,0.16); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: white; }
    .pill-count { font-size: 11px; font-weight: 700; opacity: 0.65; font-variant-numeric: tabular-nums; }
    .pill.active .pill-count { opacity: 0.9; }

    /* ── Meme Grid (masonry: JS deals tiles into the shortest column) ── */
    .meme-grid { display: flex; align-items: flex-start; gap: var(--gap); }
    .meme-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }

    .tile {
      position: relative;
      display: block;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: var(--c, var(--surface));
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18), 0 0 0 1px var(--tile-border);
      cursor: zoom-in;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
      contain: layout paint;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.26), 0 0 0 2px var(--accent); }
    .tile img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .tile img.in { opacity: 1; }
    .tile.broken { display: none; }
    .dur-badge {
      position: absolute; top: 8px; left: 8px;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px 4px 7px; border-radius: 999px;
      background: rgba(0,0,0,0.6); color: #fff;
      font-family: inherit; font-size: 11px; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
      pointer-events: none; z-index: 1;
    }
    .dur-badge svg { width: 9px; height: 9px; }
    .tile .preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Memes / Videos tabs ── */
    .tabs {
      display: inline-flex; gap: 4px; padding: 4px; margin-top: 14px;
      border-radius: 999px;
      background: var(--surface); border: 1px solid var(--surface-border);
    }
    .tab {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 20px; border: 0; border-radius: 999px;
      background: none; color: var(--text-secondary);
      font-family: inherit; font-size: 14px; font-weight: 700; line-height: 1;
      cursor: pointer; transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .tab:hover { color: var(--text-color); }
    .tab .n { font-size: 11.5px; opacity: 0.7; font-variant-numeric: tabular-nums; }
    .tab[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 6px 18px var(--accent-glow); }

    .tile-actions {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; gap: 6px; padding: 8px;
      justify-content: flex-end; align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.45), rgba(0,0,0,0));
    }
    .tile-action {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-family: inherit; font-size: 11px; font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .tile-action:hover { background: var(--accent); border-color: var(--accent); }
    .tile-action svg { width: 13px; height: 13px; flex-shrink: 0; }
    .tile-action.copied { background: #2ecc71; border-color: #2ecc71; }
    @media (hover: hover) and (pointer: fine) {
      .tile-actions { opacity: 0; transition: opacity 0.18s ease; }
      .tile:hover .tile-actions, .tile:focus-within .tile-actions { opacity: 1; }
    }

    .grid-sentinel { height: 1px; }
    .grid-end { text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 28px 0 4px; display: none; }
    .grid-end.visible { display: block; }
    .grid-end a { color: var(--accent); text-decoration: none; }
    .grid-end a:hover { text-decoration: underline; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); display: none; }
    .empty-state.visible { display: block; }
    .empty-state svg { width: 48px; height: 48px; margin: 0 auto 14px; opacity: 0.4; }
    .empty-state h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; color: var(--text-color); }
    .empty-state p { font-size: 0.9rem; }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed; inset: 0;
      z-index: 1000;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: rgba(6, 5, 9, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0; visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      color: #fff;
    }
    .lightbox.active { opacity: 1; visibility: visible; }
    .lb-stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 56px 76px 12px; }
    .lb-frame {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: var(--c, #111);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      transform: scale(0.97);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lightbox.active .lb-frame { transform: scale(1); }
    .lb-frame img, .lb-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
    .lb-frame .lb-full { opacity: 0; transition: opacity 0.3s ease; }
    .lb-frame .lb-full.in { opacity: 1; }

    .lb-btn {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .lb-btn:hover { background: var(--accent); border-color: var(--accent); }
    .lb-btn svg { width: 20px; height: 20px; }
    .lb-close { top: 12px; right: 14px; width: 42px; height: 42px; }
    .lb-nav { top: 50%; width: 48px; height: 48px; transform: translateY(-50%); }
    .lb-nav:hover { transform: translateY(-50%) scale(1.06); }
    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }

    .lb-panel { padding: 6px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .lb-title { font-size: 15px; font-weight: 700; line-height: 1.3; max-width: 760px; }
    .lb-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 760px; }
    .lb-tag {
      font: 600 11.5px/1 inherit; font-family: inherit;
      padding: 5px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.88);
      border: 1px solid transparent; cursor: pointer;
      transition: background 0.15s ease;
    }
    .lb-tag:hover { background: var(--accent); color: #fff; }
    .lb-tag.cat { border-color: rgba(176,128,255,0.45); background: rgba(155,95,255,0.18); text-transform: capitalize; }
    .lb-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
    .lb-counter { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.7); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .lb-action {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 15px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      color: rgba(255,255,255,0.92);
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
    }
    .lb-action:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lb-action svg { width: 15px; height: 15px; }
    .lb-action.copied { background: #2ecc71; border-color: #2ecc71; color: #fff; }
    .lb-action[hidden] { display: none; }

    /* ── Back to Top ── */
    .back-to-top {
      position: fixed; bottom: 24px; right: 24px;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px var(--accent-glow);
      opacity: 0; visibility: hidden; transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 50;
    }
    .back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
    .back-to-top:hover { background: var(--accent-hover); transform: translateY(-2px); }

    @media (prefers-reduced-motion: reduce) {
      .tile, .tile img, .lb-frame, .lb-frame .lb-full, .lightbox, .back-to-top { transition: none; }
      .tile:hover { transform: none; }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      :root { --gap: 8px; }
      .top-bar { height: 46px; padding: 0 12px; }
      .back-btn { font-size: 12px; padding: 8px 14px; }

      .tile { border-radius: 10px; }
      .tile-actions { padding: 6px; gap: 5px; }
      .tile-action { padding: 8px; min-width: 34px; min-height: 34px; font-size: 0; gap: 0; }
      .tile-action svg { width: 15px; height: 15px; }

      .lb-stage { padding: 56px 10px 8px; }

      .lb-counter { top: 16px; left: 14px; }
      .back-to-top { bottom: 16px; right: 16px; width: 40px; height: 40px; }
    }

  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <script src="meme_data.js?v=202610170910"></script>

  <script>
    // ── Theme ──
    const html = document.documentElement;
    document.getElementById('themeToggle').addEventListener('click', () => {
      html.classList.add('theme-transition');
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      setTimeout(() => html.classList.remove('theme-transition'), 350);
    });

    const $ = id => document.getElementById(id);
    const ICONS = {
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
    };

    // ── Data ──
    // Each entry: { file, path?, name, categories[], text, description, tags[], w, h, color, thumb, added }.
    // w/h/color/thumb/added come from scripts/update-memes.py.
    const norm = s => String(s || '').trim().toLowerCase();
    const fmtDur = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
    const ALL = MEMES.map((m, i) => {
      const cats = (Array.isArray(m.categories) ? m.categories : [m.categories || m.category]).map(norm).filter(Boolean);
      const tags = (m.tags || []).map(norm).filter(Boolean);
      const src = m.path || ('memes/' + m.file);
      return Object.assign({}, m, {
        i, cats, tags, src,
        thumbSrc: m.thumb || src,
        video: /\.(mp4|webm|mov)$/i.test(m.file),
        ratio: m.w && m.h ? m.h / m.w : 1,
        title: m.name || (m.text ? m.text.slice(0, 80) : '') || tags.slice(0, 4).join(' · ') || 'Emonad meme',
        strong: (norm(m.name) + ' ' + tags.join(' ') + ' ' + cats.join(' ')),
        weak: norm((m.text || '') + ' ' + (m.description || '')),
        tagSet: new Set(tags),
      });
    });
    // Newest additions first; entries added the same day keep their file order.
    const BY_NEW = ALL.slice().sort((a, b) => (b.added || '').localeCompare(a.added || '') || a.i - b.i);
    let shuffled = null;

    // ── State ──
    let tab = 'images';     // 'images' | 'videos'
    const inTab = m => (tab === 'videos') === m.video;
    const HOVER = matchMedia('(hover: hover) and (pointer: fine)').matches;
    let activeCat = 'all';
    let query = '';
    let list = [];          // the filtered, ordered memes currently in the grid
    const grid = $('memeGrid');
    const BATCH = 36;
    let cols = [], colH = [], rendered = 0, colCountNow = 0;

    function colCount() {
      const w = grid.clientWidth || window.innerWidth;
      return w < 560 ? 2 : w < 900 ? 3 : w < 1180 ? 4 : 5;
    }

    function termRegex(term) {
      const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('\\b' + esc, 'i');
    }

    function computeList() {
      const base = (shuffled || BY_NEW).filter(inTab);
      const inCat = activeCat === 'all' ? base : base.filter(m => m.cats.includes(activeCat));
      const q = norm(query);
      if (!q) return inCat;
      const words = q.split(/\s+/).filter(Boolean);
      const scored = [];
      for (const m of inCat) {
        let score = 0, ok = true;
        for (const w of words) {
          const re = termRegex(w);
          let s = 0;
          if (m.tagSet.has(w)) s += 10;
          if (re.test(m.strong)) s += 5;
          if (re.test(m.weak)) s += 2;
          if (!s && (m.strong.includes(w) || m.weak.includes(w))) s = 1;
          if (!s) { ok = false; break; }
          score += s;
        }
        if (ok) scored.push([m, score]);
      }
      scored.sort((a, b) => b[1] - a[1]);
      return scored.map(x => x[0]);
    }

    // ── Grid ──
    function layout() {
      colCountNow = colCount();
      grid.replaceChildren();
      cols = []; colH = [];
      for (let c = 0; c < colCountNow; c++) {
        const col = document.createElement('div');
        col.className = 'meme-col';
        grid.appendChild(col);
        cols.push(col);
        colH.push(0);
      }
      rendered = 0;
      renderMore(BATCH);
      fill();
    }

    function renderMore(n) {
      const end = Math.min(list.length, rendered + n);
      for (; rendered < end; rendered++) {
        const m = list[rendered];
        let k = 0;
        for (let c = 1; c < colH.length; c++) if (colH[c] < colH[k] - 0.01) k = c;
        cols[k].appendChild(tile(m, rendered));
        colH[k] += m.ratio + 0.06;
      }
      $('gridEnd').classList.toggle('visible', list.length > BATCH && rendered >= list.length);
    }

    function tile(m, idx) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', 'Open meme: ' + m.title);
      el.dataset.idx = idx;
      el.style.aspectRatio = (m.w || 1) + ' / ' + (m.h || 1);
      if (m.color) el.style.setProperty('--c', m.color);

      const img = document.createElement('img');
      img.alt = m.title;
      img.decoding = 'async';
      if (idx < 10) { img.loading = 'eager'; if (idx < 4) img.fetchPriority = 'high'; }
      else img.loading = 'lazy';
      if (m.w) { img.width = m.w; img.height = m.h; }
      img.addEventListener('load', () => img.classList.add('in'), { once: true });
      img.addEventListener('error', () => {
        if (img.src.indexOf(m.src) === -1 && !m.video) img.src = m.src;   // thumb missing → full image
        else el.classList.add('broken');
      });
      img.src = m.thumbSrc;
      if (img.complete && img.naturalWidth) img.classList.add('in');
      el.appendChild(img);

      if (m.video) {
        const b = document.createElement('span');
        b.className = 'dur-badge';
        b.innerHTML = ICONS.play + (m.dur ? fmtDur(m.dur) : '');
        el.appendChild(b);
        if (HOVER) {
          let t;
          el.addEventListener('mouseenter', () => {
            t = setTimeout(() => {
              if (el.querySelector('video')) return;
              const v = document.createElement('video');
              Object.assign(v, { muted: true, loop: true, playsInline: true, autoplay: true, preload: 'auto', src: m.src });
              v.className = 'preview';
              el.insertBefore(v, b);
            }, 250);
          });
          el.addEventListener('mouseleave', () => {
            clearTimeout(t);
            const v = el.querySelector('video.preview');
            if (v) { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }
          });
        }
      }

      const actions = document.createElement('div');
      actions.className = 'tile-actions';
      const dl = document.createElement('a');
      dl.className = 'tile-action';
      dl.href = m.src;
      dl.download = m.file;
      dl.title = 'Download';
      dl.innerHTML = ICONS.download + '<span>Download</span>';
      actions.appendChild(dl);
      if (!m.video) {
        const cp = document.createElement('button');
        cp.type = 'button';
        cp.className = 'tile-action';
        cp.title = 'Copy image';
        cp.dataset.act = 'copy';
        cp.innerHTML = ICONS.copy + '<span>Copy</span>';
        actions.appendChild(cp);
        const ed = document.createElement('a');
        ed.className = 'tile-action';
        ed.href = 'meme-maker.html?img=' + encodeURIComponent(m.src);
        ed.title = 'Edit in Meme Maker';
        ed.innerHTML = ICONS.edit + '<span>Edit</span>';
        actions.appendChild(ed);
      }
      el.appendChild(actions);
      return el;
    }

    grid.addEventListener('click', e => {
      const t = e.target.closest('.tile');
      if (!t) return;
      const m = list[+t.dataset.idx];
      if (e.target.closest('[data-act="copy"]')) {
        e.stopPropagation();
        copyImage(m.src, e.target.closest('button'));
        return;
      }
      if (e.target.closest('a')) return;   // download / edit links do their own thing
      openLightbox(+t.dataset.idx);
    });
    grid.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('tile')) {
        e.preventDefault();
        openLightbox(+e.target.dataset.idx);
      }
    });

    // Render more as the bottom of the grid gets close. The observer only fires when the
    // sentinel enters range, so keep adding batches until it's pushed back out of range.
    const AHEAD = 1600;
    function fill() {
      const s = $('gridSentinel');
      for (let n = 0; n < 30 && rendered < list.length && s.getBoundingClientRect().top < innerHeight + AHEAD; n++) renderMore(BATCH);
    }
    new IntersectionObserver(entries => {
      if (entries.some(en => en.isIntersecting)) fill();
    }, { rootMargin: AHEAD + 'px 0px' }).observe($('gridSentinel'));

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (colCount() === colCountNow) return;
        const keep = rendered;
        layout();
        if (keep > rendered) renderMore(keep - rendered);
      }, 150);
    });

    // ── Filters ──
    const pillsEl = $('categoryPills');
    function buildPills() {
      const counts = {};
      const here = ALL.filter(inTab);
      here.forEach(m => m.cats.forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
      const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
      pillsEl.innerHTML = ['all', ...cats].map(c => {
        const on = c === activeCat;
        const label = c === 'all' ? 'All' : c;
        return '<button class="pill' + (on ? ' active' : '') + '" role="tab" aria-selected="' + on + '" data-cat="' + c.replace(/"/g, '&quot;') + '">'
          + label.replace(/</g, '&lt;') + ' <span class="pill-count">' + (c === 'all' ? here.length : counts[c]) + '</span></button>';
      }).join('');
      if (activeCat !== 'all' && !counts[activeCat]) activeCat = 'all';
    }

    function apply({ scroll = false } = {}) {
      list = computeList();
      layout();
      const total = ALL.filter(inTab).length;
      $('memeCount').textContent = (list.length === total ? '' : list.length + ' / ') + total + (tab === 'videos' ? ' video' : ' meme') + (total === 1 ? '' : 's');
      $('emptyState').classList.toggle('visible', list.length === 0);
      $('gridEnd').innerHTML = 'That’s all ' + list.length + '. <a href="meme-maker.html">Make your own in the Meme Maker →</a>';
      syncURL();
      if (scroll) {
        const top = $('memeGrid').getBoundingClientRect().top + window.scrollY - 150;
        if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
      }
    }

    function setCategory(cat) {
      activeCat = cat;
      pillsEl.querySelectorAll('.pill').forEach(p => {
        const on = p.dataset.cat === cat;
        p.classList.toggle('active', on);
        p.setAttribute('aria-selected', on);
        if (on) p.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
      apply({ scroll: true });
    }

    function setQuery(q) {
      query = q;
      searchInput.value = q;
      $('searchClear').classList.toggle('visible', !!q);
    }

    pillsEl.addEventListener('click', e => {
      const b = e.target.closest('.pill');
      if (b) setCategory(b.dataset.cat);
    });
    function setTab(t, { scroll = true } = {}) {
      tab = t === 'videos' ? 'videos' : 'images';
      document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
      searchInput.placeholder = tab === 'videos' ? 'Search videos — skate, crying, gm, compilation…' : 'Search memes — pepe, crying, chart, gm…';
      buildPills();
      apply({ scroll });
    }
    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { if (b.dataset.tab !== tab) setTab(b.dataset.tab); }));
    $('nImages').textContent = ALL.filter(m => !m.video).length;
    $('nVideos').textContent = ALL.filter(m => m.video).length;

    pillsEl.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || pillsEl.scrollWidth <= pillsEl.clientWidth) return;
      e.preventDefault();
      pillsEl.scrollLeft += e.deltaY;
    }, { passive: false });

    const searchInput = $('searchInput');
    let qTimer;
    searchInput.addEventListener('input', () => {
      $('searchClear').classList.toggle('visible', !!searchInput.value);
      clearTimeout(qTimer);
      qTimer = setTimeout(() => { query = searchInput.value; apply(); }, 120);
    });
    $('searchClear').addEventListener('click', () => {
      setQuery('');
      apply();
      searchInput.focus();
    });

    $('shuffleBtn').addEventListener('click', () => {
      const b = $('shuffleBtn');
      // First click shuffles; each further click reshuffles. Long-press-free way back: clear via the X below.
      shuffled = ALL.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      b.setAttribute('aria-pressed', 'true');
      b.title = 'Shuffle again';
      apply({ scroll: true });
    });

    function syncURL() {
      const p = new URLSearchParams();
      if (query.trim()) p.set('q', query.trim());
      if (activeCat !== 'all') p.set('cat', activeCat);
      if (tab === 'videos') p.set('tab', 'videos');
      const s = p.toString();
      history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
    }

    // ── Copy to clipboard ──
    // Accepts an <img> that's already loaded (keeps the user gesture on iOS Safari — no fetch)
    // or a URL. The PNG is built inside a promise handed to ClipboardItem in the same tick.
    async function copyImage(imgOrSrc, btn) {
      const span = btn && btn.querySelector('span');
      if (btn && span && btn._label === undefined) btn._label = span.textContent;
      const flash = (text, ok = true) => {
        if (!btn) return;
        if (span) span.textContent = text;
        btn.classList.toggle('copied', ok);
        setTimeout(() => { if (span) span.textContent = btn._label; btn.classList.remove('copied'); }, 1400);
      };
      const isImg = imgOrSrc instanceof HTMLImageElement;
      const src = isImg ? (imgOrSrc.currentSrc || imgOrSrc.src) : imgOrSrc;
      const absolute = new URL(src, location.href).href;
      const toPng = img => new Promise((resolve, reject) => {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
      });
      if (!navigator.clipboard || !window.ClipboardItem) {
        try { await navigator.clipboard.writeText(absolute); flash('Link copied'); }
        catch (_) { flash('Copy failed', false); }
        return;
      }
      const png = (async () => {
        if (isImg && imgOrSrc.complete && imgOrSrc.naturalWidth) return toPng(imgOrSrc);
        const resp = await fetch(src, { credentials: 'omit' });
        if (!resp.ok) throw new Error('fetch ' + resp.status);
        const blob = await resp.blob();
        if (blob.type === 'image/png') return blob;
        const img = new Image();
        img.src = URL.createObjectURL(blob);
        await img.decode();
        return toPng(img);
      })();
      png.catch(() => {});
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
        flash('Copied!');
      } catch (err) {
        try { await navigator.clipboard.writeText(absolute); flash('Link copied'); }
        catch (_) { flash('Copy failed', false); }
      }
    }

    // ── Lightbox ──
    const lb = $('lightbox'), frame = $('lbFrame'), stage = $('lbStage');
    let lbIndex = -1, lbFull = null, lastFocus = null;

    function fitFrame(m) {
      const cs = getComputedStyle(stage);
      const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const w = m.w || 1000, h = m.h || 1000;
      const s = Math.min(W / w, H / h, 2);
      frame.style.width = Math.round(w * s) + 'px';
      frame.style.height = Math.round(h * s) + 'px';
    }

    function showLightbox(idx) {
      const m = list[idx];
      if (!m) return;
      lbIndex = idx;
      frame.style.setProperty('--c', m.color || '#111');
      fitFrame(m);
      frame.replaceChildren();
      if (m.video) {
        const v = document.createElement('video');
        Object.assign(v, { src: m.src, controls: true, autoplay: true, loop: true, playsInline: true, preload: 'auto', poster: m.thumbSrc });
        frame.appendChild(v);
        lbFull = null;
      } else {
        const thumb = document.createElement('img');
        thumb.src = m.thumbSrc;
        thumb.alt = '';
        const full = document.createElement('img');
        full.className = 'lb-full';
        full.alt = m.title;
        full.decoding = 'async';
        full.addEventListener('load', () => full.classList.add('in'), { once: true });
        full.src = m.src;
        if (full.complete && full.naturalWidth) full.classList.add('in');
        frame.append(thumb, full);
        lbFull = full;
      }
      $('lbTitle').textContent = m.name || m.text || '';
      $('lbTags').innerHTML = '';
      m.cats.forEach(c => $('lbTags').appendChild(chip(c, true)));
      m.tags.slice(0, 14).forEach(t => $('lbTags').appendChild(chip(t, false)));
      $('lbCounter').textContent = (idx + 1) + ' / ' + list.length;
      $('lbDownload').href = m.src;
      $('lbDownload').setAttribute('download', m.file);
      $('lbCopy').hidden = m.video;
      $('lbEdit').hidden = m.video;
      $('lbEdit').href = 'meme-maker.html?img=' + encodeURIComponent(m.src);
      history.replaceState(null, '', location.pathname + location.search + '#m=' + encodeURIComponent(m.file));
      // Warm up the neighbours so arrowing through is instant.
      [idx + 1, idx - 1].forEach(j => { const n = list[j]; if (n && !n.video) new Image().src = n.src; });
    }

    function chip(label, isCat) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lb-tag' + (isCat ? ' cat' : '');
      b.textContent = label;
      b.addEventListener('click', () => {
        closeLightbox();
        if (isCat) { setQuery(''); setCategory(label); }
        else { setQuery(label); activeCat = 'all'; buildPills(); apply({ scroll: true }); }
      });
      return b;
    }

    function openLightbox(idx) {
      lastFocus = document.activeElement;
      lb.classList.add('active');
      lb.setAttribute('aria-hidden', 'false');
      document.body.classList.add('lb-open');
      showLightbox(idx);
      $('lbClose').focus({ preventScroll: true });
    }

    function closeLightbox() {
      if (!lb.classList.contains('active')) return;
      lb.classList.remove('active');
      lb.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('lb-open');
      const v = frame.querySelector('video');
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
      history.replaceState(null, '', location.pathname + location.search);
      // Make sure the tile we end on is in the grid, then return focus to it.
      if (lbIndex >= rendered) renderMore(lbIndex - rendered + BATCH);
      const t = grid.querySelector('.tile[data-idx="' + lbIndex + '"]');
      if (t) { t.focus({ preventScroll: true }); t.scrollIntoView({ block: 'nearest' }); }
      else if (lastFocus) lastFocus.focus({ preventScroll: true });
    }

    function step(d) {
      if (!list.length) return;
      showLightbox((lbIndex + d + list.length) % list.length);
    }

    $('lbClose').addEventListener('click', closeLightbox);
    $('lbPrev').addEventListener('click', () => step(-1));
    $('lbNext').addEventListener('click', () => step(1));
    stage.addEventListener('click', e => { if (e.target === stage) closeLightbox(); });
    $('lbCopy').addEventListener('click', () => {
      const m = list[lbIndex];
      copyImage(lbFull && lbFull.complete && lbFull.naturalWidth ? lbFull : m.src, $('lbCopy'));
    });
    $('lbShare').addEventListener('click', async () => {
      const m = list[lbIndex];
      const url = location.origin + location.pathname + '#m=' + encodeURIComponent(m.file);
      const btn = $('lbShare'), span = btn.querySelector('span');
      if (navigator.share && matchMedia('(pointer: coarse)').matches) {
        try { await navigator.share({ title: m.name || '$EMO meme', url }); } catch (_) {}
        return;
      }
      try {
        await navigator.clipboard.writeText(url);
        span.textContent = 'Link copied';
        btn.classList.add('copied');
        setTimeout(() => { span.textContent = 'Link'; btn.classList.remove('copied'); }, 1400);
      } catch (_) {}
    });
    window.addEventListener('resize', () => { if (lb.classList.contains('active')) fitFrame(list[lbIndex]); });

    document.addEventListener('keydown', e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (!lb.classList.contains('active')) {
        if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); }
        else if (e.key === 'Escape' && typing && searchInput.value) { setQuery(''); apply(); }
        return;
      }
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'Tab') {
        const f = [...lb.querySelectorAll('button:not([hidden]), a:not([hidden])')];
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    });

    // Swipe left/right in the viewer.
    (() => {
      let x0 = 0, y0 = 0, on = false;
      stage.addEventListener('touchstart', e => {
        if (e.target.closest('button, a, video')) return;
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; on = true;
      }, { passive: true });
      stage.addEventListener('touchend', e => {
        if (!on) return;
        on = false;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) {
          if (Math.abs(dy) > 90 && dy > 0 && Math.abs(dx) < 60) closeLightbox();   // swipe down closes
          return;
        }
        step(dx > 0 ? -1 : 1);
      }, { passive: true });
    })();

    // ── Back to top ──
    const backToTop = $('backToTop');
    window.addEventListener('scroll', () => backToTop.classList.toggle('visible', window.scrollY > 600), { passive: true });
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ── Start ──
    (() => {
      const p = new URLSearchParams(location.search);
      if (p.get('q')) setQuery(p.get('q'));
      if (p.get('cat')) activeCat = norm(p.get('cat'));
      const hm = location.hash.match(/^#m=(.+)$/);
      const linked = hm && ALL.find(m => m.file === decodeURIComponent(hm[1]));
      setTab(linked ? (linked.video ? 'videos' : 'images') : p.get('tab'), { scroll: false });
      if (hm) {
        const file = decodeURIComponent(hm[1]);
        let idx = list.findIndex(m => m.file === file);
        if (idx < 0 && (query || activeCat !== 'all')) {
          setQuery(''); activeCat = 'all'; buildPills(); apply();
          idx = list.findIndex(m => m.file === file);
        }
        if (idx >= 0) openLightbox(idx);
      }
    })();
  </script>

  <script>
    // ── Page Transition ──
    (function() {
      const pt = document.getElementById('pageTransition');
      if (!pt) return;
      const overlay = pt.querySelector('.pt-overlay');
      const logo = pt.querySelector('.pt-logo');
      const glow = pt.querySelector('.pt-glow');
      let navigating = false;
      let hideTimeout;

      function showTransition() {
        overlay.style.display = '';
        logo.style.display = '';
        glow.style.display = '';
      }

      function hideTransitionAfterDelay() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          overlay.style.display = 'none';
          logo.style.display = 'none';
          glow.style.display = 'none';
        }, 1100);
      }

      function resetTransitionState() {
        clearTimeout(hideTimeout);
        pt.classList.remove('exit-active');
        navigating = false;
        hideTransitionAfterDelay();
      }

      hideTransitionAfterDelay();

      window.addEventListener('pageshow', (event) => {
        if (!event.persisted) return;
        showTransition();
        resetTransitionState();
      });

      document.addEventListener('click', (e) => {
        const link = e.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        if (href !== 'emo.html' && !href.endsWith('/emo.html')) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        e.preventDefault();
        if (navigating) return;
        navigating = true;
        clearTimeout(hideTimeout);
        showTransition();
        pt.classList.add('exit-active');
        sessionStorage.setItem('pt-entering', '1');

        setTimeout(() => {
          window.location.href = href;
        }, 820);
      });
    })();
  </script>

</body>
