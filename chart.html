<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Leaderboard · emonad</title>
  <meta name="description" content="emonad.lol XP leaderboard — ranks, levels, and every user as a bubble.">
  <meta property="og:title" content="emonad leaderboard">
  <meta property="og:description" content="XP leaderboard for $EMO. Click anyone to open their profile.">
  <meta property="og:image" content="https://emonad.lol/og-image.jpg">
  <meta property="og:url" content="https://emonad.lol/chart.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="emonad leaderboard">
  <meta name="twitter:description" content="XP leaderboard for $EMO. Click anyone to open their profile.">
  <meta name="twitter:image" content="https://emonad.lol/og-image.jpg">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>
    try {
      var t = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/emo-skin.css">

  <style>
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 500 800;
      font-display: swap;
      src: url(fonts/SpaceGrotesk-latin.woff2) format('woff2');
    }
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #aaaaaa;
      --accent: #7B3FE4;
      --accent-2: #ec4899;
      --accent-glow: rgba(123, 63, 228, 0.25);
      --surface: #f5f3ff;
      --surface-border: #e4d8f8;
      --ticker-bg: rgba(255, 255, 255, 0.92);
      --ticker-border: #e9e0f5;
    }
    [data-theme="dark"] {
      --bg-color: #08070b;
      --text-color: #ffffff;
      --text-secondary: #b8a3e8;
      --text-muted: #8a8496;
      --accent: #9B5FFF;
      --accent-glow: rgba(155, 95, 255, 0.3);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-border: rgba(255, 255, 255, 0.1);
      --ticker-bg: rgba(15, 15, 15, 0.92);
      --ticker-border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body {
      color: var(--text-color);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      background:
        radial-gradient(ellipse 800px 600px at 12% 8%,  rgba(155, 95, 255, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse 900px 600px at 88% 4%,  rgba(236, 72, 153, 0.22) 0%, transparent 55%),
        var(--bg-color);
    }
    [data-theme="light"] body {
      background:
        radial-gradient(ellipse 800px 600px at 12% 8%, rgba(155, 95, 255, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 900px 600px at 88% 4%, rgba(236, 72, 153, 0.14) 0%, transparent 55%),
        var(--bg-color);
    }

    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-color);
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      font-size: 14px;
      font-weight: 600;
    }
    .nav-back:hover { border-color: var(--accent); color: var(--accent); }
    .nav-bar .grow { flex: 1; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
    }
    [data-theme="light"] .live-pill {
      border-color: rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.55);
    }
    @media (max-width: 520px) {
      .live-pill { display: none; }
    }
    .live-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: livePulse 2s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { box-shadow: 0 0 6px rgba(155,95,255,0.45); }
      50%      { box-shadow: 0 0 14px rgba(155,95,255,0.9); }
    }
    .theme-toggle {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--accent); background: var(--accent-glow); }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 68px 20px 48px;
    }

    .page-head {
      text-align: center;
      padding: 10px 0 18px;
    }
    .page-head h1 {
      font-size: clamp(1.85rem, 4vw, 2.35rem);
      font-weight: 800;
      margin: 0 0 4px;
      line-height: 1.1;
    }
    .page-head p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .board {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: rgba(12, 10, 18, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px;
      padding: 16px 16px 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 50px rgba(0,0,0,0.28);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(28px) saturate(170%);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
    }
    [data-theme="light"] .panel {
      background: rgba(255, 255, 255, 0.62);
      border-color: rgba(0,0,0,0.06);
    }

    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 18px;
      gap: 14px;
    }
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .panel-meta {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 700;
      text-align: right;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .panel-meta b { color: var(--text-color); font-weight: 800; }
    .panel-meta .find-btn {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(155, 95, 255, 0.4);
      background: rgba(155, 95, 255, 0.1);
      color: var(--text-color);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .panel-meta .find-btn:hover {
      background: rgba(155, 95, 255, 0.25);
      border-color: var(--accent-2);
      transform: translateY(-1px);
    }

    /* ── Galaxy ────────────────────────────────────────────── */
    .galaxy-wrap {
      position: relative;
      width: 100%;
      height: min(68vh, 560px);
      border-radius: 14px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 50% 50%, rgba(155, 95, 255, 0.14) 0%, transparent 60%),
        radial-gradient(ellipse 30% 25% at 18% 22%, rgba(236, 72, 153, 0.10) 0%, transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.012) 0%, rgba(0,0,0,0.30) 100%);
      border: 1px solid rgba(155, 95, 255, 0.16);
    }
    #galaxyCanvas { display: block; width: 100%; height: 100%; }
    .galaxy-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 9, 28, 0.96);
      border: 1px solid rgba(155, 95, 255, 0.45);
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 12.5px;
      color: var(--text-color);
      box-shadow: 0 8px 28px rgba(0,0,0,0.55), 0 0 28px rgba(155,95,255,0.35);
      opacity: 0;
      transform: translate(-50%, -110%);
      transition: opacity 0.12s ease;
      white-space: nowrap;
      z-index: 5;
    }
    .galaxy-tooltip b { color: #fff; font-weight: 800; }
    .galaxy-tooltip .lvl {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    .galaxy-tooltip .lvl.max { color: var(--accent-2); }
    .galaxy-progress {
      position: absolute;
      bottom: 10px; left: 14px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .galaxy-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .galaxy-foot .hint { color: var(--text-muted); letter-spacing: 0.06em; font-size: 11px; text-transform: none; font-weight: 600; }

    /* ── Leaderboard ───────────────────────────────────────── */
    .lb-list {
      display: flex; flex-direction: column;
      gap: 6px;
      max-height: min(68vh, 560px);
      overflow-y: auto;
      padding-right: 4px;
    }
    .lb-list::-webkit-scrollbar { width: 6px; }
    .lb-list::-webkit-scrollbar-thumb {
      background: rgba(155, 95, 255, 0.35);
      border-radius: 4px;
    }
    .lb-row {
      display: grid;
      grid-template-columns: 40px 40px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-decoration: none;
      color: var(--text-color);
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }
    .lb-row:hover {
      background: rgba(155, 95, 255, 0.14);
      border-color: rgba(176, 128, 255, 0.4);
      transform: translateY(-1px);
    }
    .lb-row.me {
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.20), rgba(155, 95, 255, 0.12));
      border-color: var(--accent-2);
      box-shadow: 0 0 24px rgba(236, 72, 153, 0.28);
    }
    .lb-row .rank {
      font-size: 14px;
      font-weight: 900;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .lb-row.top1 {
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.14), rgba(155, 95, 255, 0.06));
      border-color: rgba(236, 72, 153, 0.45);
    }
    .lb-row.top1 .rank { color: var(--accent-2); font-size: 18px; }
    .lb-row.top2 .rank, .lb-row.top3 .rank { color: var(--accent); font-size: 15px; }
    .lb-row .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(155, 95, 255, 0.45);
      object-fit: cover;
      background: rgba(155, 95, 255, 0.15);
      display: block;
    }
    .lb-row .avatar.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900;
      color: var(--text-muted);
      border-color: rgba(155, 95, 255, 0.25);
    }
    .lb-row.top1 .avatar {
      width: 46px; height: 46px;
      border-color: var(--accent-2);
      box-shadow: 0 0 16px rgba(236, 72, 153, 0.55);
    }
    .lb-row .who {
      min-width: 0;
      display: flex; flex-direction: column;
      line-height: 1.2;
    }
    .lb-row .name {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-row .handle {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-row .xp {
      text-align: right;
      font-size: 16px;
      font-weight: 900;
      color: var(--text-color);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .lb-row .xp .lvl {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
      margin-top: 5px;
    }
    .lb-row .xp .lvl.max { color: var(--accent-2); }

    /* States */
    .skeleton {
      color: var(--text-muted);
      text-align: center;
      padding: 40px 12px;
      font-size: 13px;
    }
    .skeleton .spinner {
      width: 24px; height: 24px;
      border: 2.5px solid rgba(155, 95, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 22px 12px;
      font-size: 13px;
    }
    .error-state b { color: var(--text-color); display: block; font-weight: 800; margin-bottom: 4px; }

    @media (prefers-reduced-motion: reduce) {
      .live-pill .dot { animation: none; }
    }

    @media (max-width: 900px) {
      .board { grid-template-columns: 1fr; }
      .galaxy-wrap { height: 420px; }
    }
    @media (max-width: 720px) {
      .container { padding: 62px 12px 32px; }
      .page-head { padding: 8px 0 14px; }
      .panel { padding: 14px 12px 12px; border-radius: 20px; }
      .panel-head { flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 12px; }
      .panel-meta { text-align: left; }
      .galaxy-wrap { height: 380px; }
      .lb-list { max-height: 560px; }
      .lb-row { grid-template-columns: 36px 36px 1fr auto; gap: 10px; padding: 8px 11px; }
      .lb-row .avatar { width: 34px; height: 34px; }
      .lb-row.top1 .avatar { width: 40px; height: 40px; }
      .lb-row .name { font-size: 13px; }
      .lb-row .handle { font-size: 10.5px; }
      .lb-row .xp { font-size: 14px; }
      .nav-bar { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <nav class="nav-bar glass-bar">
    <a class="nav-back" href="emo.html" aria-label="Back to main site">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      $EMO
    </a>
    <span class="grow"></span>
    <div class="live-pill" id="livePill"><span class="dot"></span><span id="livePillText">Connecting…</span></div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span id="themeIcon">◐</span>
    </button>
    <span id="emoAuthSlot" class="emo-auth-host"></span>
  </nav>

  <div class="container">
    <header class="page-head">
      <h1 class="page-title">Leaderboard</h1>
      <p>i lost it all on day 1</p>
    </header>

    <div class="board">
      <section class="panel" id="leaderboardPanel">
        <div class="panel-head">
          <span class="panel-title">Ranks</span>
          <span class="panel-meta" id="lbMeta">—</span>
        </div>
        <div id="leaderboard" class="lb-list">
          <div class="skeleton"><div class="spinner"></div>Loading…</div>
        </div>
      </section>

      <section class="panel" id="galaxyPanel">
        <div class="panel-head">
          <span class="panel-title">Everyone</span>
          <span class="panel-meta">
            <button class="find-btn" id="findMeBtn" type="button">Find me</button>
            <span id="galaxyMeta">—</span>
          </span>
        </div>
        <div class="galaxy-wrap" id="galaxyWrap">
          <canvas id="galaxyCanvas" aria-label="Bubble map of every user"></canvas>
          <div class="galaxy-tooltip" id="galaxyTooltip"></div>
          <div class="galaxy-progress" id="galaxyProgress"></div>
        </div>
        <div class="galaxy-foot">
          <span>Size = XP</span>
          <span class="hint">Click a bubble to open their profile</span>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function() {
      var html = document.documentElement;
      var saved = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      html.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').addEventListener('click', function() {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>

  <script type="module" src="./chart.js"></script>
</body>
</html>
